<!DOCTYPE html>
<html lang="{{ language }}"><head><meta charset="utf-8"><title>文档译文</title></head><body>
{% for segment in segments %}
<section class="segment columns-{{ segment.columns }}{% if segment.is_header %} paper-header{% endif %}{% if loop.previtem is defined and loop.previtem.page_id != segment.page_id %} source-page-start{% endif %}">
{% for group in segment.groups %}
<div class="block-group{% if group.keep %} keep-related{% endif %}{% if group.notes | default(false) %} source-notes{% endif %}">
{% for node in group.nodes %}
{% include 'components/node.html' %}
{% endfor %}
</div>
{% endfor %}
</section>
{% endfor %}
</body></html>
