                  - generic [ref=e490]:
                    - generic [ref=e491]:
                      - generic [ref=e493]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e496]:
                      - list [ref=e503]:
                        - listitem [ref=e504]:
                          - mark [ref=e505]:
                            - text: ‌
                            - strong [ref=e506]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e507]:
                            - listitem [ref=e508]:
                              - mark [ref=e509]:
                                - text: ‌
                                - strong [ref=e510]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e511]:
                              - mark [ref=e512]:
                                - text: ‌
                                - strong [ref=e513]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e514]:
                              - mark [ref=e515]:
                                - text: ‌
                                - strong [ref=e516]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e517]:
                          - mark [ref=e518]:
                            - text: ‌
                            - strong [ref=e519]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e520]:
                            - listitem [ref=e521]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e522]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e523]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e524]:
                          - mark [ref=e525]:
                            - text: ‌
                            - strong [ref=e526]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e527]:
                            - listitem [ref=e528]:
                              - mark [ref=e529]:
                                - text: ‌
                                - strong [ref=e530]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e531]:
                              - mark [ref=e532]:
                                - text: ‌
                                - strong [ref=e533]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e534]:
                              - mark [ref=e535]:
                                - text: ‌
                                - strong [ref=e536]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e549] [cursor=pointer]:
