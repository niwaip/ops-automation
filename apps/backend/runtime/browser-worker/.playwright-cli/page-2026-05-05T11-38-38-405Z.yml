                              - text: ：通过定义统一的通信协议、数据格式和规则，使不同 AI 模型能以一致方式连接各种数据源和工具，降低碎片化集成成本 。
                            - listitem [ref=e671]:
                              - mark [ref=e672]:
                                - text: ‌
                                - strong [ref=e673]: 安全双向通信
                                - text: ‌
                              - text: ：内置 OAuth 2.1 授权框架和数据传输加密机制，确保数据源所有者掌握访问权，避免数据泄露和滥用 。‌‌
                              - generic [ref=e678] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e684]:
                          - mark [ref=e685]:
                            - text: ‌
                            - strong [ref=e686]: 与 API、CLI 的区别
                            - text: ‌
                          - text: ：MCP 不是替代 API 或 CLI，而是作为 Agent 时代的连接层，更适合生产系统。API 是基础功能，CLI 更适合本地开发者工具，而 MCP 提供远程标准化服务，支持 Web、移动端和云托管 Agent 统一接入 。‌‌‌
                      - link "" [ref=e699] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=Km0_mX2G3MiQ4ou5LIOODuzHX5xlZzmVfiPgmlkom5DiUxurnL-870YXoBB2e2qnTp7L6OqlC8EQ7i7PgJeRga
                        - generic [ref=e701]:
                          - generic [ref=e706]: 
                          - text: 
                  - generic [ref=e708]:
                    - generic [ref=e709]:
                      - generic [ref=e711]: MCP 的架构与工作原理
                      - text: 
                    - generic [ref=e714]:
                      - list [ref=e721]:
                        - listitem [ref=e722]:
                          - mark [ref=e723]:
                            - text: ‌
                            - strong [ref=e724]: 三层架构设计
                            - text: ‌
                          - text: ：MCP 遵循客户端 - 主机 - 服务器（Client-Host-Server）三层架构 ：
                          - list [ref=e725]:
                            - listitem [ref=e726]:
                              - mark [ref=e727]:
                                - text: ‌
                                - strong [ref=e728]: 主机（Host）
                                - text: ‌
                              - text: ：运行 AI 模型或代理的宿主程序，如 Claude 桌面版、Cursor 编辑器、企业自研 AI 应用，负责初始化连接和用户交互 。
                            - listitem [ref=e729]:
                              - mark [ref=e730]:
                                - text: ‌
                                - strong [ref=e731]: 客户端（Client）
                                - text: ‌
                              - text: ：嵌入在主机应用中的协议组件，与服务器保持一对一连接，负责消息路由、能力管理和协议协商 。
                            - listitem [ref=e732]:
                              - mark [ref=e733]:
                                - text: ‌
                                - strong [ref=e734]: 服务器（Server）
                                - text: ‌
                              - text: ：独立运行的轻量程序，封装数据源或服务能力（如本地文件、数据库、第三方 API），通过标准化接口对外提供 。‌‌‌
                        - listitem [ref=e740]:
                          - mark [ref=e741]:
                            - text: ‌
                            - strong [ref=e742]: 通信协议与传输
                            - text: ‌
                          - text: ：
                          - list [ref=e743]:
                            - listitem [ref=e744]: 使用 JSON-RPC 2.0 作为消息格式，支持请求、响应和通知三种基本消息类型 。
                            - listitem [ref=e745]:
                              - text: 支持多种传输方式，包括本地标准输入/输出（Stdio）、HTTP 服务器发送事件（SSE）及 Streamable HTTP 协议（2025 年 3 月版本后替换原 HTTP+SSE）。‌‌
                              - generic [ref=e750] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e756]:
                          - mark [ref=e757]:
                            - text: ‌
                            - strong [ref=e758]: 工作流程
                            - text: ‌
                          - text: ：LLM 应用发送上下文请求→外部资源返回数据→LLM 集成上下文生成响应，过程中动态维护对话历史记录和状态，确保多轮对话连贯性 。‌‌‌
                      - link "" [ref=e771] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=Km0_mX2G3MiQ4ou5LIOODuzHX5xlZzmVfiPgmlkom5DiUxurnL-870YXoBB2e2qnZniI-cf4ScJzKc6ccZ3uTq
