                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e740]:
                          - mark [ref=e741]:
                            - text: ‌
                            - strong [ref=e742]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e743]:
                            - listitem [ref=e744]:
                              - mark [ref=e745]:
                                - text: ‌
                                - strong [ref=e746]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e747]:
                              - mark [ref=e748]:
                                - text: ‌
                                - strong [ref=e749]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e750]:
                              - mark [ref=e751]:
                                - text: ‌
                                - strong [ref=e752]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e758]:
                          - mark [ref=e759]:
                            - text: ‌
                            - strong [ref=e760]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e765] [cursor=pointer]: 百科
                      - link "" [ref=e773] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=ba9AhztNQ9VFKXDGmsZfRM7YG3mj1oV3RBMLby9krOG3yahHyABPozrxg-sxQH6E_rWb6LDT6Rwifb1aWXe4u_
                        - generic [ref=e775]:
                          - generic [ref=e780]: 
                          - text: 
                  - generic [ref=e782]:
                    - generic [ref=e783]:
                      - generic [ref=e785]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e788]:
                      - list [ref=e795]:
                        - listitem [ref=e796]:
                          - mark [ref=e797]:
                            - text: ‌
                            - strong [ref=e798]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e799]:
                            - listitem [ref=e800]:
                              - mark [ref=e801]:
                                - text: ‌
                                - strong [ref=e802]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e803]:
                              - mark [ref=e804]:
                                - text: ‌
                                - strong [ref=e805]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e806]:
                              - mark [ref=e807]:
                                - text: ‌
                                - strong [ref=e808]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e809]:
                          - mark [ref=e810]:
                            - text: ‌
                            - strong [ref=e811]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e812]:
                            - listitem [ref=e813]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e814]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e815]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e816]:
                          - mark [ref=e817]:
                            - text: ‌
                            - strong [ref=e818]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e819]:
                            - listitem [ref=e820]:
                              - mark [ref=e821]:
                                - text: ‌
                                - strong [ref=e822]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e823]:
                              - mark [ref=e824]:
                                - text: ‌
                                - strong [ref=e825]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e826]:
                              - mark [ref=e827]:
                                - text: ‌
                                - strong [ref=e828]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e841] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=ba9AhztNQ9VFKXDGmsZfRM7YG3mj1oV3RBMLby9krOG3yahHyABPozrxg-sxQH6EKd2oklp3AXipgkS2Iu5Kxq
                        - generic [ref=e843]:
                          - generic [ref=e848]: 
                          - text: 
                  - generic [ref=e850]:
                    - generic [ref=e851]:
                      - generic [ref=e853]: MCP 的应用场景与优势
                      - text: 
                    - generic [ref=e856]:
                      - list [ref=e863]:
                        - listitem [ref=e864]:
                          - paragraph [ref=e865]:
                            - mark [ref=e866]:
                              - text: ‌
                              - strong [ref=e867]: 核心优势
                              - text: ‌
                            - text: ：
                          - list [ref=e868]:
                            - listitem [ref=e869]:
                              - mark [ref=e870]:
                                - text: ‌
                                - strong [ref=e871]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e872]:
                              - mark [ref=e873]:
                                - text: ‌
                                - strong [ref=e874]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e875]:
                              - mark [ref=e876]:
                                - text: ‌
                                - strong [ref=e877]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e878]:
                              - mark [ref=e879]:
                                - text: ‌
                                - strong [ref=e880]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e886]:
                          - paragraph [ref=e887]:
                            - mark [ref=e888]:
                              - text: ‌
                              - strong [ref=e889]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e890]:
                            - listitem [ref=e891]:
                              - mark [ref=e892]:
                                - text: ‌
                                - strong [ref=e893]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e894]:
                              - mark [ref=e895]:
                                - text: ‌
                                - strong [ref=e896]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e897]:
                              - mark [ref=e898]:
                                - text: ‌
                                - strong [ref=e899]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e900]:
                              - mark [ref=e901]:
                                - text: ‌
                                - strong [ref=e902]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e908]:
                          - paragraph [ref=e909]:
                            - mark [ref=e910]:
                              - text: ‌
                              - strong [ref=e911]: 生态发展
                              - text: ‌
                            - text: ：Anthropic 在发布时提供了初步的规范和 SDK（如 Python 和 TypeScript），并开源了多个预构建的 MCP 服务器（如 Google Drive、GitHub 集成），以加速社区采纳 。‌‌‌
