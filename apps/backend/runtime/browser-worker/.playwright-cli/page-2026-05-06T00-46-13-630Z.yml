                  - mark [ref=e396]:
                    - text: ‌
                    - strong [ref=e397]: MCP
                    - text: ‌
                    - mark [ref=e398]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e399]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e400]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e401]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e402]:
                    - text: ‌
                    - strong [ref=e403]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e408] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e418]:
                  - generic [ref=e419]:
                    - generic [ref=e420]:
                      - generic [ref=e422]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e425]:
                      - list [ref=e432]:
                        - listitem [ref=e433]:
                          - mark [ref=e434]:
                            - text: ‌
                            - strong [ref=e435]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e441]:
                          - mark [ref=e442]:
                            - text: ‌
                            - strong [ref=e443]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e444]:
                            - listitem [ref=e445]:
                              - mark [ref=e446]:
                                - text: ‌
                                - strong [ref=e447]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e448]:
                              - mark [ref=e449]:
                                - text: ‌
                                - strong [ref=e450]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e451]:
                              - mark [ref=e452]:
                                - text: ‌
                                - strong [ref=e453]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e459]:
                          - mark [ref=e460]:
                            - text: ‌
                            - strong [ref=e461]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e466] [cursor=pointer]: 百科
                      - link "" [ref=e474] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=M4OrNBcwX6HW34SNT0ckcaVoasttlW5t86jWEqDgayeKZv2GEpkk5i8OPcNp14pKqA-7kTIQU0_osQNivLJJg_
                        - generic [ref=e476]:
                          - generic [ref=e481]: 
                          - text: 
                  - generic [ref=e483]:
                    - generic [ref=e484]:
                      - generic [ref=e486]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e489]:
                      - list [ref=e496]:
                        - listitem [ref=e497]:
                          - mark [ref=e498]:
                            - text: ‌
                            - strong [ref=e499]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e500]:
                            - listitem [ref=e501]:
                              - mark [ref=e502]:
                                - text: ‌
                                - strong [ref=e503]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e504]:
                              - mark [ref=e505]:
                                - text: ‌
                                - strong [ref=e506]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e507]:
                              - mark [ref=e508]:
                                - text: ‌
                                - strong [ref=e509]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e510]:
                          - mark [ref=e511]:
                            - text: ‌
                            - strong [ref=e512]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e513]:
                            - listitem [ref=e514]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e515]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e516]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e517]:
                          - mark [ref=e518]:
                            - text: ‌
                            - strong [ref=e519]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e520]:
                            - listitem [ref=e521]:
                              - mark [ref=e522]:
                                - text: ‌
                                - strong [ref=e523]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e524]:
                              - mark [ref=e525]:
                                - text: ‌
                                - strong [ref=e526]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e527]:
                              - mark [ref=e528]:
                                - text: ‌
                                - strong [ref=e529]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e542] [cursor=pointer]:
