                    - strong [ref=e499]: MCP
                    - text: ‌
                  - text: （Model Context Protocol，模型上下文协议）是由 Anthropic 公司于 2024 年 11 月推出的开源协议，旨在实现大语言模型与外部数据源和工具的无缝集成，被称为 AI 领域的"USB-C 接口”。‌‌‌
                  - generic [ref=e504] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e514]:
                  - generic [ref=e515]:
                    - generic [ref=e516]:
                      - generic [ref=e518]: MCP 的核心定义与目标
                      - text: 
                    - generic [ref=e521]:
                      - list [ref=e528]:
                        - listitem [ref=e529]:
                          - mark [ref=e530]:
                            - text: ‌
                            - strong [ref=e531]: 全称与推出背景
                            - text: ‌
                          - text: ：MCP 全称为 Model Context Protocol（模型上下文协议），由 Anthropic 公司在 2024 年 11 月 25 日正式发布并开源，目标是解决大语言模型如何安全、高效地访问外部数据和工具的问题 。‌‌‌
                          - generic [ref=e536] [cursor=pointer]: 百科
                          - text: ‌
                        - listitem [ref=e542]:
                          - mark [ref=e543]:
                            - text: ‌
                            - strong [ref=e544]: 核心目标
                            - text: ‌
                          - text: ：
                          - list [ref=e545]:
                            - listitem [ref=e546]:
                              - mark [ref=e547]:
                                - text: ‌
                                - strong [ref=e548]: 标准化连接
                                - text: ‌
                              - text: ：通过定义统一的通信协议、数据格式和规则，使不同 AI 模型能以一致方式连接各种数据源和工具，降低碎片化集成成本 。
                            - listitem [ref=e549]:
                              - mark [ref=e550]:
                                - text: ‌
                                - strong [ref=e551]: 安全双向通信
                                - text: ‌
                              - text: ：内置 OAuth 2.1 授权框架和数据传输加密机制，确保数据源所有者掌握访问权，避免数据泄露和滥用 。‌‌
                              - generic [ref=e556] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e562]:
                          - mark [ref=e563]:
                            - text: ‌
                            - strong [ref=e564]: 与 API、CLI 的区别
                            - text: ‌
                          - text: ：MCP 不是替代 API 或 CLI，而是作为 Agent 时代的连接层，更适合生产系统。API 是基础功能，CLI 更适合本地开发者工具，而 MCP 提供远程标准化服务，支持 Web、移动端和云托管 Agent 统一接入 。‌‌‌
                      - link "" [ref=e577] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=FJlGqyr6AQd58tKrWB8vSGM4o_KPHe2IwKDzJdmperts4HQBGBRIGC1uv_EOVTWqz3YHI-rgO5LRaLXShfN4FK
                        - generic [ref=e579]:
                          - generic [ref=e584]: 
                          - text: 
                  - generic [ref=e586]:
                    - generic [ref=e587]:
                      - generic [ref=e589]: MCP 的架构与工作原理
                      - text: 
                    - generic [ref=e592]:
                      - list [ref=e599]:
                        - listitem [ref=e600]:
                          - mark [ref=e601]:
                            - text: ‌
                            - strong [ref=e602]: 三层架构设计
                            - text: ‌
                          - text: ：MCP 遵循客户端 - 主机 - 服务器（Client-Host-Server）三层架构 ：
                          - list [ref=e603]:
                            - listitem [ref=e604]:
                              - mark [ref=e605]:
                                - text: ‌
                                - strong [ref=e606]: 主机（Host）
                                - text: ‌
                              - text: ：运行 AI 模型或代理的宿主程序，如 Claude 桌面版、Cursor 编辑器、企业自研 AI 应用，负责初始化连接和用户交互 。
                            - listitem [ref=e607]:
                              - mark [ref=e608]:
                                - text: ‌
                                - strong [ref=e609]: 客户端（Client）
                                - text: ‌
                              - text: ：嵌入在主机应用中的协议组件，与服务器保持一对一连接，负责消息路由、能力管理和协议协商 。
                            - listitem [ref=e610]:
                              - mark [ref=e611]:
                                - text: ‌
                                - strong [ref=e612]: 服务器（Server）
                                - text: ‌
                              - text: ：独立运行的轻量程序，封装数据源或服务能力（如本地文件、数据库、第三方 API），通过标准化接口对外提供 。‌‌‌
                        - listitem [ref=e618]:
                          - mark [ref=e619]:
                            - text: ‌
                            - strong [ref=e620]: 通信协议与传输
                            - text: ‌
                          - text: ：
                          - list [ref=e621]:
                            - listitem [ref=e622]: 使用 JSON-RPC 2.0 作为消息格式，支持请求、响应和通知三种基本消息类型 。
                            - listitem [ref=e623]:
                              - text: 支持多种传输方式，包括本地标准输入/输出（Stdio）、HTTP 服务器发送事件（SSE）及 Streamable HTTP 协议（2025 年 3 月版本后替换原 HTTP+SSE）。‌‌
                              - generic [ref=e628] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e634]:
                          - mark [ref=e635]:
                            - text: ‌
                            - strong [ref=e636]: 工作流程
                            - text: ‌
                          - text: ：LLM 应用发送上下文请求→外部资源返回数据→LLM 集成上下文生成响应，过程中动态维护对话历史记录和状态，确保多轮对话连贯性 。‌‌‌
                      - link "" [ref=e649] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=FJlGqyr6AQd58tKrWB8vSGM4o_KPHe2IwKDzJdmperts4HQBGBRIGC1uv_EOVTWqq5I9o40r6y1Usu6_FkHEVK
                        - generic [ref=e651]:
                          - generic [ref=e656]: 
                          - text: 
                  - generic [ref=e658]:
                    - generic [ref=e659]:
                      - generic [ref=e661]: MCP 的应用场景与生态发展
                      - text: 
                    - generic [ref=e664]:
                      - list [ref=e671]:
                        - listitem [ref=e672]:
                          - mark [ref=e673]:
                            - text: ‌
                            - strong [ref=e674]: 行业落地案例
                            - text: ‌
                          - text: ：
                          - list [ref=e675]:
                            - listitem [ref=e676]:
                              - mark [ref=e677]:
                                - text: ‌
                                - strong [ref=e678]: 金融领域
                                - text: ‌
                              - text: ：2025 年 4 月，美国 Fifth Third Bank 推出 MCP 服务器，支持账户管理、资金转账等 19 项银行操作；支付宝推出国内首个支付领域 MCP Server。
                            - listitem [ref=e679]:
                              - mark [ref=e680]:
                                - text: ‌
                                - strong [ref=e681]: 地图服务
                                - text: ‌
                              - text: ：百度地图、高德地图、腾讯位置服务均推出基于 MCP 协议的服务器，提供天气查询、导航定位等接口，百度是国内首家兼容 MCP 协议的地图服务商 。
                            - listitem [ref=e682]:
                              - mark [ref=e683]:
                                - text: ‌
                                - strong [ref=e684]: 企业系统
                                - text: ‌
                              - text: ：Oracle NetSuite 将 MCP 集成到企业资源计划系统，Stripe 集成后开发者可用自然语言调用支付 API。‌‌‌
                              - generic [ref=e689] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e695]:
                          - mark [ref=e696]:
                            - text: ‌
                            - strong [ref=e697]: 与 Agent、Skills 的关系
                            - text: ‌
                          - text: ：
                          - list [ref=e698]:
                            - listitem [ref=e699]: MCP 提供“能用什么”（底层连接能力），Skills 提供“怎么做才对”（业务逻辑和流程），Agent 负责整体协调和任务执行，三者构成分层架构而非替代关系 。
                            - listitem [ref=e700]: MCP 是“能力供给层”，Skills 是“行为规范层”，AI Agent 是“执行层”。‌‌‌
                        - listitem [ref=e706]:
                          - mark [ref=e707]:
                            - text: ‌
                            - strong [ref=e708]: 主流平台支持
                            - text: ‌
                          - text: ：
                          - list [ref=e709]:
                            - listitem [ref=e710]: 已获得 Claude、Cursor、JetBrains 等主流平台支持，GitHub Copilot 在 Visual Studio 中通过 MCP 连接外部工具 。
                            - listitem [ref=e711]: 2025 年 3 月，OpenAI 宣布 Agent SDK 支持 MCP 协议，ChatGPT 桌面应用及 Responses API 也即将支持 。
                            - listitem [ref=e712]:
                              - text: 2025 年 12 月，Anthropic 将 MCP 正式捐赠给 Linux 基金会旗下的代理式人工智能基金会（AAIF），谷歌、微软、亚马逊等公司共同参与支持 。‌‌‌
