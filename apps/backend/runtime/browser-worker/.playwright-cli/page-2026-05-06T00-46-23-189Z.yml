                  - mark [ref=e601]:
                    - text: ‌
                    - strong [ref=e602]: MCP
                    - text: ‌
                    - mark [ref=e603]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e604]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e605]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e606]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e607]:
                    - text: ‌
                    - strong [ref=e608]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e613] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e623]:
                  - generic [ref=e624]:
                    - generic [ref=e625]:
                      - generic [ref=e627]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e630]:
                      - list [ref=e637]:
                        - listitem [ref=e638]:
                          - mark [ref=e639]:
                            - text: ‌
                            - strong [ref=e640]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e646]:
                          - mark [ref=e647]:
                            - text: ‌
                            - strong [ref=e648]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e649]:
                            - listitem [ref=e650]:
                              - mark [ref=e651]:
                                - text: ‌
                                - strong [ref=e652]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e653]:
                              - mark [ref=e654]:
                                - text: ‌
                                - strong [ref=e655]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e656]:
                              - mark [ref=e657]:
                                - text: ‌
                                - strong [ref=e658]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e664]:
                          - mark [ref=e665]:
                            - text: ‌
                            - strong [ref=e666]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e671] [cursor=pointer]: 百科
                      - link "" [ref=e679] [cursor=pointer]:
