                  - generic [ref=e688]:
                    - generic [ref=e689]:
                      - generic [ref=e691]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e694]:
                      - list [ref=e701]:
                        - listitem [ref=e702]:
                          - mark [ref=e703]:
                            - text: ‌
                            - strong [ref=e704]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e705]:
                            - listitem [ref=e706]:
                              - mark [ref=e707]:
                                - text: ‌
                                - strong [ref=e708]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e709]:
                              - mark [ref=e710]:
                                - text: ‌
                                - strong [ref=e711]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e712]:
                              - mark [ref=e713]:
                                - text: ‌
                                - strong [ref=e714]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e715]:
                          - mark [ref=e716]:
                            - text: ‌
                            - strong [ref=e717]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e718]:
                            - listitem [ref=e719]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e720]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e721]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e722]:
                          - mark [ref=e723]:
                            - text: ‌
                            - strong [ref=e724]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e725]:
                            - listitem [ref=e726]:
                              - mark [ref=e727]:
                                - text: ‌
                                - strong [ref=e728]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e729]:
                              - mark [ref=e730]:
                                - text: ‌
                                - strong [ref=e731]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e732]:
                              - mark [ref=e733]:
                                - text: ‌
                                - strong [ref=e734]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e747] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=qkKgYObagPONUMUq8r0k9e6EKjPLaWGol1-rjdYESv_2kdbgxE681UNUNxiMQmC8uVXsE9pWaMmdkU9MwrgGka
                        - generic [ref=e749]:
                          - generic [ref=e754]: 
                          - text: 
                  - generic [ref=e756]:
                    - generic [ref=e757]:
                      - generic [ref=e759]: MCP 的应用场景与优势
                      - text: 
                    - generic [ref=e762]:
                      - list [ref=e769]:
                        - listitem [ref=e770]:
                          - paragraph [ref=e771]:
                            - mark [ref=e772]:
                              - text: ‌
                              - strong [ref=e773]: 核心优势
                              - text: ‌
                            - text: ：
                          - list [ref=e774]:
                            - listitem [ref=e775]:
                              - mark [ref=e776]:
                                - text: ‌
                                - strong [ref=e777]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e778]:
                              - mark [ref=e779]:
                                - text: ‌
                                - strong [ref=e780]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e781]:
                              - mark [ref=e782]:
                                - text: ‌
                                - strong [ref=e783]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e784]:
                              - mark [ref=e785]:
                                - text: ‌
                                - strong [ref=e786]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e792]:
                          - paragraph [ref=e793]:
                            - mark [ref=e794]:
                              - text: ‌
                              - strong [ref=e795]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e796]:
                            - listitem [ref=e797]:
                              - mark [ref=e798]:
                                - text: ‌
                                - strong [ref=e799]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e800]:
                              - mark [ref=e801]:
                                - text: ‌
                                - strong [ref=e802]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e803]:
                              - mark [ref=e804]:
                                - text: ‌
                                - strong [ref=e805]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e806]:
                              - mark [ref=e807]:
                                - text: ‌
                                - strong [ref=e808]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e814]:
                          - paragraph [ref=e815]:
                            - mark [ref=e816]:
                              - text: ‌
                              - strong [ref=e817]: 生态发展
                              - text: ‌
                            - text: ：Anthropic 在发布时提供了初步的规范和 SDK（如 Python 和 TypeScript），并开源了多个预构建的 MCP 服务器（如 Google Drive、GitHub 集成），以加速社区采纳 。‌‌‌
