                  - mark [ref=e586]:
                    - text: ‌
                    - strong [ref=e587]: MCP
                    - text: ‌
                    - mark [ref=e588]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e589]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e590]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e591]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e592]:
                    - text: ‌
                    - strong [ref=e593]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e598] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e608]:
                  - generic [ref=e609]:
                    - generic [ref=e610]:
                      - generic [ref=e612]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e615]:
                      - list [ref=e622]:
                        - listitem [ref=e623]:
                          - mark [ref=e624]:
                            - text: ‌
                            - strong [ref=e625]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e631]:
                          - mark [ref=e632]:
                            - text: ‌
                            - strong [ref=e633]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e634]:
                            - listitem [ref=e635]:
                              - mark [ref=e636]:
                                - text: ‌
                                - strong [ref=e637]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e638]:
                              - mark [ref=e639]:
                                - text: ‌
                                - strong [ref=e640]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e641]:
                              - mark [ref=e642]:
                                - text: ‌
                                - strong [ref=e643]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e649]:
                          - mark [ref=e650]:
                            - text: ‌
                            - strong [ref=e651]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e656] [cursor=pointer]: 百科
                      - link "" [ref=e664] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=gjWRsTTxJ968KfhGsS0YVLSy4fwhoJ5ts8Q5U6placHIpglifsn9BIrQXqwuH8rvUbqKi03nTZVvvHqXwQ9U6q
                        - generic [ref=e666]:
                          - generic [ref=e671]: 
                          - text: 
                  - generic [ref=e673]:
                    - generic [ref=e674]:
                      - generic [ref=e676]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e679]:
                      - list [ref=e686]:
                        - listitem [ref=e687]:
                          - mark [ref=e688]:
                            - text: ‌
                            - strong [ref=e689]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e690]:
                            - listitem [ref=e691]:
                              - mark [ref=e692]:
                                - text: ‌
                                - strong [ref=e693]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e694]:
                              - mark [ref=e695]:
                                - text: ‌
                                - strong [ref=e696]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e697]:
                              - mark [ref=e698]:
                                - text: ‌
                                - strong [ref=e699]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e700]:
                          - mark [ref=e701]:
                            - text: ‌
                            - strong [ref=e702]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e703]:
                            - listitem [ref=e704]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e705]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e706]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e707]:
                          - mark [ref=e708]:
                            - text: ‌
                            - strong [ref=e709]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e710]:
                            - listitem [ref=e711]:
                              - mark [ref=e712]:
                                - text: ‌
                                - strong [ref=e713]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e714]:
                              - mark [ref=e715]:
                                - text: ‌
                                - strong [ref=e716]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e717]:
                              - mark [ref=e718]:
                                - text: ‌
                                - strong [ref=e719]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e732] [cursor=pointer]:
