                    - strong [ref=e586]: MCP
                    - text: ‌
                    - mark [ref=e587]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e588]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e589]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e590]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e591]:
                    - text: ‌
                    - strong [ref=e592]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e597] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e607]:
                  - generic [ref=e608]:
                    - generic [ref=e609]:
                      - generic [ref=e611]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e614]:
                      - list [ref=e621]:
                        - listitem [ref=e622]:
                          - mark [ref=e623]:
                            - text: ‌
                            - strong [ref=e624]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e630]:
                          - mark [ref=e631]:
                            - text: ‌
                            - strong [ref=e632]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e633]:
                            - listitem [ref=e634]:
                              - mark [ref=e635]:
                                - text: ‌
                                - strong [ref=e636]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e637]:
                              - mark [ref=e638]:
                                - text: ‌
                                - strong [ref=e639]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e640]:
                              - mark [ref=e641]:
                                - text: ‌
                                - strong [ref=e642]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e648]:
                          - mark [ref=e649]:
                            - text: ‌
                            - strong [ref=e650]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e655] [cursor=pointer]: 百科
                      - link "" [ref=e663] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=x76dYG4RIEKonnBaq_0YTVSbmw9KOF8qMgNimPJkv1-vazgnQrJon-xEDws6AGCzwxHXqBmhnVsAl9vngkvcKK
                        - generic [ref=e665]:
                          - generic [ref=e670]: 
                          - text: 
                  - generic [ref=e672]:
                    - generic [ref=e673]:
                      - generic [ref=e675]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e678]:
                      - list [ref=e685]:
                        - listitem [ref=e686]:
                          - mark [ref=e687]:
                            - text: ‌
                            - strong [ref=e688]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e689]:
                            - listitem [ref=e690]:
                              - mark [ref=e691]:
                                - text: ‌
                                - strong [ref=e692]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e693]:
                              - mark [ref=e694]:
                                - text: ‌
                                - strong [ref=e695]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e696]:
                              - mark [ref=e697]:
                                - text: ‌
                                - strong [ref=e698]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e699]:
                          - mark [ref=e700]:
                            - text: ‌
                            - strong [ref=e701]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e702]:
                            - listitem [ref=e703]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e704]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e705]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e706]:
                          - mark [ref=e707]:
                            - text: ‌
                            - strong [ref=e708]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e709]:
                            - listitem [ref=e710]:
                              - mark [ref=e711]:
                                - text: ‌
                                - strong [ref=e712]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e713]:
                              - mark [ref=e714]:
                                - text: ‌
                                - strong [ref=e715]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e716]:
                              - mark [ref=e717]:
                                - text: ‌
                                - strong [ref=e718]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e731] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=x76dYG4RIEKonnBaq_0YTVSbmw9KOF8qMgNimPJkv1-vazgnQrJon-xEDws6AGCzzYgsxJrZdPYzJAG5cAzVPK
                        - generic [ref=e733]:
                          - generic [ref=e738]: 
                          - text: 
                  - generic [ref=e740]:
                    - generic [ref=e741]:
                      - generic [ref=e743]: MCP 的应用场景与优势
                      - text: 
                    - generic [ref=e746]:
                      - list [ref=e753]:
                        - listitem [ref=e754]:
                          - paragraph [ref=e755]:
                            - mark [ref=e756]:
                              - text: ‌
                              - strong [ref=e757]: 核心优势
                              - text: ‌
                            - text: ：
                          - list [ref=e758]:
                            - listitem [ref=e759]:
                              - mark [ref=e760]:
                                - text: ‌
                                - strong [ref=e761]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e762]:
                              - mark [ref=e763]:
                                - text: ‌
                                - strong [ref=e764]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e765]:
                              - mark [ref=e766]:
                                - text: ‌
                                - strong [ref=e767]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e768]:
                              - mark [ref=e769]:
                                - text: ‌
                                - strong [ref=e770]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e776]:
                          - paragraph [ref=e777]:
                            - mark [ref=e778]:
                              - text: ‌
                              - strong [ref=e779]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e780]:
                            - listitem [ref=e781]:
                              - mark [ref=e782]:
                                - text: ‌
                                - strong [ref=e783]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e784]:
                              - mark [ref=e785]:
                                - text: ‌
                                - strong [ref=e786]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e787]:
                              - mark [ref=e788]:
                                - text: ‌
                                - strong [ref=e789]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e790]:
                              - mark [ref=e791]:
                                - text: ‌
                                - strong [ref=e792]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e798]:
                          - paragraph [ref=e799]:
                            - mark [ref=e800]:
                              - text: ‌
                              - strong [ref=e801]: 生态发展
                              - text: ‌
                            - text: ：Anthropic 在发布时提供了初步的规范和 SDK（如 Python 和 TypeScript），并开源了多个预构建的 MCP 服务器（如 Google Drive、GitHub 集成），以加速社区采纳 。‌‌‌
