                        - listitem [ref=e694]:
                          - mark [ref=e695]:
                            - text: ‌
                            - strong [ref=e696]: 与 Agent、Skills 的关系
                            - text: ‌
                          - text: ：
                          - list [ref=e697]:
                            - listitem [ref=e698]: MCP 提供“能用什么”（底层连接能力），Skills 提供“怎么做才对”（业务逻辑和流程），Agent 负责整体协调和任务执行，三者构成分层架构而非替代关系 。
                            - listitem [ref=e699]: MCP 是“能力供给层”，Skills 是“行为规范层”，AI Agent 是“执行层”。‌‌‌
                        - listitem [ref=e705]:
                          - mark [ref=e706]:
                            - text: ‌
                            - strong [ref=e707]: 主流平台支持
                            - text: ‌
                          - text: ：
                          - list [ref=e708]:
                            - listitem [ref=e709]: 已获得 Claude、Cursor、JetBrains 等主流平台支持，GitHub Copilot 在 Visual Studio 中通过 MCP 连接外部工具 。
                            - listitem [ref=e710]: 2025 年 3 月，OpenAI 宣布 Agent SDK 支持 MCP 协议，ChatGPT 桌面应用及 Responses API 也即将支持 。
                            - listitem [ref=e711]:
                              - text: 2025 年 12 月，Anthropic 将 MCP 正式捐赠给 Linux 基金会旗下的代理式人工智能基金会（AAIF），谷歌、微软、亚马逊等公司共同参与支持 。‌‌‌
