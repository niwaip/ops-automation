                            - text: ‌
                          - text: ：
                          - list [ref=e592]:
                            - listitem [ref=e593]:
                              - mark [ref=e594]:
                                - text: ‌
                                - strong [ref=e595]: 金融领域
                                - text: ‌
                              - text: ：2025 年 4 月，美国 Fifth Third Bank 推出 MCP 服务器，支持账户管理、资金转账等 19 项银行操作；支付宝推出国内首个支付领域 MCP Server。
                            - listitem [ref=e596]:
                              - mark [ref=e597]:
                                - text: ‌
                                - strong [ref=e598]: 地图服务
                                - text: ‌
                              - text: ：百度地图、高德地图、腾讯位置服务均推出基于 MCP 协议的服务器，提供天气查询、导航定位等接口，百度是国内首家兼容 MCP 协议的地图服务商 。
                            - listitem [ref=e599]:
                              - mark [ref=e600]:
                                - text: ‌
                                - strong [ref=e601]: 企业系统
                                - text: ‌
                              - text: ：Oracle NetSuite 将 MCP 集成到企业资源计划系统，Stripe 集成后开发者可用自然语言调用支付 API。‌‌‌
                              - generic [ref=e606] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e612]:
                          - mark [ref=e613]:
                            - text: ‌
                            - strong [ref=e614]: 与 Agent、Skills 的关系
                            - text: ‌
                          - text: ：
                          - list [ref=e615]:
                            - listitem [ref=e616]: MCP 提供“能用什么”（底层连接能力），Skills 提供“怎么做才对”（业务逻辑和流程），Agent 负责整体协调和任务执行，三者构成分层架构而非替代关系 。
                            - listitem [ref=e617]: MCP 是“能力供给层”，Skills 是“行为规范层”，AI Agent 是“执行层”。‌‌‌
                        - listitem [ref=e623]:
                          - mark [ref=e624]:
                            - text: ‌
                            - strong [ref=e625]: 主流平台支持
                            - text: ‌
                          - text: ：
                          - list [ref=e626]:
                            - listitem [ref=e627]: 已获得 Claude、Cursor、JetBrains 等主流平台支持，GitHub Copilot 在 Visual Studio 中通过 MCP 连接外部工具 。
                            - listitem [ref=e628]: 2025 年 3 月，OpenAI 宣布 Agent SDK 支持 MCP 协议，ChatGPT 桌面应用及 Responses API 也即将支持 。
                            - listitem [ref=e629]:
                              - text: 2025 年 12 月，Anthropic 将 MCP 正式捐赠给 Linux 基金会旗下的代理式人工智能基金会（AAIF），谷歌、微软、亚马逊等公司共同参与支持 。‌‌‌
