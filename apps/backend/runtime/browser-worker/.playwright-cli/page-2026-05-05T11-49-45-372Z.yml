                                - text: ‌
                              - text: ：通过定义统一的通信协议、数据格式和规则，使不同 AI 模型能以一致方式连接各种数据源和工具，降低碎片化集成成本 。
                            - listitem [ref=e466]:
                              - mark [ref=e467]:
                                - text: ‌
                                - strong [ref=e468]: 安全双向通信
                                - text: ‌
                              - text: ：内置 OAuth 2.1 授权框架和数据传输加密机制，确保数据源所有者掌握访问权，避免数据泄露和滥用 。‌‌
                              - generic [ref=e473] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e479]:
                          - mark [ref=e480]:
                            - text: ‌
                            - strong [ref=e481]: 与 API、CLI 的区别
                            - text: ‌
                          - text: ：MCP 不是替代 API 或 CLI，而是作为 Agent 时代的连接层，更适合生产系统。API 是基础功能，CLI 更适合本地开发者工具，而 MCP 提供远程标准化服务，支持 Web、移动端和云托管 Agent 统一接入 。‌‌‌
                      - link "" [ref=e494] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=Km0_mX2G3MiQ4ou5LIOODuzHX5xlZzmVfiPgmlkom5DiUxurnL-870YXoBB2e2qnTp7L6OqlC8EQ7i7PgJeRga
                        - generic [ref=e496]:
                          - generic [ref=e501]: 
                          - text: 
                  - generic [ref=e503]:
                    - generic [ref=e504]:
                      - generic [ref=e506]: MCP 的架构与工作原理
                      - text: 
                    - generic [ref=e509]:
                      - list [ref=e516]:
                        - listitem [ref=e517]:
                          - mark [ref=e518]:
                            - text: ‌
                            - strong [ref=e519]: 三层架构设计
                            - text: ‌
                          - text: ：MCP 遵循客户端 - 主机 - 服务器（Client-Host-Server）三层架构 ：
                          - list [ref=e520]:
                            - listitem [ref=e521]:
                              - mark [ref=e522]:
                                - text: ‌
                                - strong [ref=e523]: 主机（Host）
                                - text: ‌
                              - text: ：运行 AI 模型或代理的宿主程序，如 Claude 桌面版、Cursor 编辑器、企业自研 AI 应用，负责初始化连接和用户交互 。
                            - listitem [ref=e524]:
                              - mark [ref=e525]:
                                - text: ‌
                                - strong [ref=e526]: 客户端（Client）
                                - text: ‌
                              - text: ：嵌入在主机应用中的协议组件，与服务器保持一对一连接，负责消息路由、能力管理和协议协商 。
                            - listitem [ref=e527]:
                              - mark [ref=e528]:
                                - text: ‌
                                - strong [ref=e529]: 服务器（Server）
                                - text: ‌
                              - text: ：独立运行的轻量程序，封装数据源或服务能力（如本地文件、数据库、第三方 API），通过标准化接口对外提供 。‌‌‌
                        - listitem [ref=e535]:
                          - mark [ref=e536]:
                            - text: ‌
                            - strong [ref=e537]: 通信协议与传输
                            - text: ‌
                          - text: ：
                          - list [ref=e538]:
                            - listitem [ref=e539]: 使用 JSON-RPC 2.0 作为消息格式，支持请求、响应和通知三种基本消息类型 。
                            - listitem [ref=e540]:
                              - text: 支持多种传输方式，包括本地标准输入/输出（Stdio）、HTTP 服务器发送事件（SSE）及 Streamable HTTP 协议（2025 年 3 月版本后替换原 HTTP+SSE）。‌‌
                              - generic [ref=e545] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e551]:
                          - mark [ref=e552]:
                            - text: ‌
                            - strong [ref=e553]: 工作流程
                            - text: ‌
                          - text: ：LLM 应用发送上下文请求→外部资源返回数据→LLM 集成上下文生成响应，过程中动态维护对话历史记录和状态，确保多轮对话连贯性 。‌‌‌
                      - link "" [ref=e566] [cursor=pointer]:
