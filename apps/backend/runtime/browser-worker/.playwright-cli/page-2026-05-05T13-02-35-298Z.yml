                    - strong [ref=e296]: MCP
                    - text: ‌
                  - text: （Model Context Protocol，模型上下文协议）是由 Anthropic 公司于 2024 年 11 月推出的开源协议，旨在实现大语言模型与外部数据源和工具的无缝集成，被称为 AI 领域的"USB-C 接口”。‌‌‌
                  - generic [ref=e301] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e311]:
                  - generic [ref=e312]:
                    - generic [ref=e313]:
                      - generic [ref=e315]: MCP 的核心定义与目标
                      - text: 
                    - generic [ref=e318]:
                      - list [ref=e325]:
                        - listitem [ref=e326]:
                          - mark [ref=e327]:
                            - text: ‌
                            - strong [ref=e328]: 全称与推出背景
                            - text: ‌
                          - text: ：MCP 全称为 Model Context Protocol（模型上下文协议），由 Anthropic 公司在 2024 年 11 月 25 日正式发布并开源，目标是解决大语言模型如何安全、高效地访问外部数据和工具的问题 。‌‌‌
                          - generic [ref=e333] [cursor=pointer]: 百科
                          - text: ‌
                        - listitem [ref=e339]:
                          - mark [ref=e340]:
                            - text: ‌
                            - strong [ref=e341]: 核心目标
                            - text: ‌
                          - text: ：
                          - list [ref=e342]:
                            - listitem [ref=e343]:
                              - mark [ref=e344]:
                                - text: ‌
                                - strong [ref=e345]: 标准化连接
                                - text: ‌
                              - text: ：通过定义统一的通信协议、数据格式和规则，使不同 AI 模型能以一致方式连接各种数据源和工具，降低碎片化集成成本 。
                            - listitem [ref=e346]:
                              - mark [ref=e347]:
                                - text: ‌
                                - strong [ref=e348]: 安全双向通信
                                - text: ‌
                              - text: ：内置 OAuth 2.1 授权框架和数据传输加密机制，确保数据源所有者掌握访问权，避免数据泄露和滥用 。‌‌
                              - generic [ref=e353] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e359]:
                          - mark [ref=e360]:
                            - text: ‌
                            - strong [ref=e361]: 与 API、CLI 的区别
                            - text: ‌
                          - text: ：MCP 不是替代 API 或 CLI，而是作为 Agent 时代的连接层，更适合生产系统。API 是基础功能，CLI 更适合本地开发者工具，而 MCP 提供远程标准化服务，支持 Web、移动端和云托管 Agent 统一接入 。‌‌‌
                      - link "" [ref=e374] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=C-r6d9ivFK4gkPnlJeUzW8g_wlC6uaq_xovzlgbk5Y38B6BlgH1B9WscYNvXM23YeWI0glb_cwsZbNTyzTVUj_
                        - generic [ref=e376]:
                          - generic [ref=e381]: 
                          - text: 
                  - generic [ref=e383]:
                    - generic [ref=e384]:
                      - generic [ref=e386]: MCP 的架构与工作原理
                      - text: 
                    - generic [ref=e389]:
                      - list [ref=e396]:
                        - listitem [ref=e397]:
                          - mark [ref=e398]:
                            - text: ‌
                            - strong [ref=e399]: 三层架构设计
                            - text: ‌
                          - text: ：MCP 遵循客户端 - 主机 - 服务器（Client-Host-Server）三层架构 ：
                          - list [ref=e400]:
                            - listitem [ref=e401]:
                              - mark [ref=e402]:
                                - text: ‌
                                - strong [ref=e403]: 主机（Host）
                                - text: ‌
                              - text: ：运行 AI 模型或代理的宿主程序，如 Claude 桌面版、Cursor 编辑器、企业自研 AI 应用，负责初始化连接和用户交互 。
                            - listitem [ref=e404]:
                              - mark [ref=e405]:
                                - text: ‌
                                - strong [ref=e406]: 客户端（Client）
                                - text: ‌
                              - text: ：嵌入在主机应用中的协议组件，与服务器保持一对一连接，负责消息路由、能力管理和协议协商 。
                            - listitem [ref=e407]:
                              - mark [ref=e408]:
                                - text: ‌
                                - strong [ref=e409]: 服务器（Server）
                                - text: ‌
                              - text: ：独立运行的轻量程序，封装数据源或服务能力（如本地文件、数据库、第三方 API），通过标准化接口对外提供 。‌‌‌
                        - listitem [ref=e415]:
                          - mark [ref=e416]:
                            - text: ‌
                            - strong [ref=e417]: 通信协议与传输
                            - text: ‌
                          - text: ：
                          - list [ref=e418]:
                            - listitem [ref=e419]: 使用 JSON-RPC 2.0 作为消息格式，支持请求、响应和通知三种基本消息类型 。
                            - listitem [ref=e420]:
                              - text: 支持多种传输方式，包括本地标准输入/输出（Stdio）、HTTP 服务器发送事件（SSE）及 Streamable HTTP 协议（2025 年 3 月版本后替换原 HTTP+SSE）。‌‌
                              - generic [ref=e425] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e431]:
                          - mark [ref=e432]:
                            - text: ‌
                            - strong [ref=e433]: 工作流程
                            - text: ‌
                          - text: ：LLM 应用发送上下文请求→外部资源返回数据→LLM 集成上下文生成响应，过程中动态维护对话历史记录和状态，确保多轮对话连贯性 。‌‌‌
                      - link "" [ref=e446] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=C-r6d9ivFK4gkPnlJeUzW8g_wlC6uaq_xovzlgbk5Y38B6BlgH1B9WscYNvXM23Yq4J3nfQ1cML6l3UWW1ZmMK
                        - generic [ref=e448]:
                          - generic [ref=e453]: 
                          - text: 
                  - generic [ref=e455]:
                    - generic [ref=e456]:
                      - generic [ref=e458]: MCP 的应用场景与生态发展
                      - text: 
                    - generic [ref=e461]:
                      - list [ref=e468]:
                        - listitem [ref=e469]:
                          - mark [ref=e470]:
                            - text: ‌
                            - strong [ref=e471]: 行业落地案例
                            - text: ‌
                          - text: ：
                          - list [ref=e472]:
                            - listitem [ref=e473]:
                              - mark [ref=e474]:
                                - text: ‌
                                - strong [ref=e475]: 金融领域
                                - text: ‌
                              - text: ：2025 年 4 月，美国 Fifth Third Bank 推出 MCP 服务器，支持账户管理、资金转账等 19 项银行操作；支付宝推出国内首个支付领域 MCP Server。
                            - listitem [ref=e476]:
                              - mark [ref=e477]:
                                - text: ‌
                                - strong [ref=e478]: 地图服务
                                - text: ‌
                              - text: ：百度地图、高德地图、腾讯位置服务均推出基于 MCP 协议的服务器，提供天气查询、导航定位等接口，百度是国内首家兼容 MCP 协议的地图服务商 。
                            - listitem [ref=e479]:
                              - mark [ref=e480]:
                                - text: ‌
                                - strong [ref=e481]: 企业系统
                                - text: ‌
                              - text: ：Oracle NetSuite 将 MCP 集成到企业资源计划系统，Stripe 集成后开发者可用自然语言调用支付 API。‌‌‌
                              - generic [ref=e486] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e492]:
                          - mark [ref=e493]:
                            - text: ‌
                            - strong [ref=e494]: 与 Agent、Skills 的关系
                            - text: ‌
                          - text: ：
                          - list [ref=e495]:
                            - listitem [ref=e496]: MCP 提供“能用什么”（底层连接能力），Skills 提供“怎么做才对”（业务逻辑和流程），Agent 负责整体协调和任务执行，三者构成分层架构而非替代关系 。
                            - listitem [ref=e497]: MCP 是“能力供给层”，Skills 是“行为规范层”，AI Agent 是“执行层”。‌‌‌
                        - listitem [ref=e503]:
                          - mark [ref=e504]:
                            - text: ‌
                            - strong [ref=e505]: 主流平台支持
                            - text: ‌
                          - text: ：
                          - list [ref=e506]:
                            - listitem [ref=e507]: 已获得 Claude、Cursor、JetBrains 等主流平台支持，GitHub Copilot 在 Visual Studio 中通过 MCP 连接外部工具 。
                            - listitem [ref=e508]: 2025 年 3 月，OpenAI 宣布 Agent SDK 支持 MCP 协议，ChatGPT 桌面应用及 Responses API 也即将支持 。
                            - listitem [ref=e509]:
                              - text: 2025 年 12 月，Anthropic 将 MCP 正式捐赠给 Linux 基金会旗下的代理式人工智能基金会（AAIF），谷歌、微软、亚马逊等公司共同参与支持 。‌‌‌
