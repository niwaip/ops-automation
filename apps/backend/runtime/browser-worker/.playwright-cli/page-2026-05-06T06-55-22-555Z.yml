                  - mark [ref=e367]:
                    - text: ‌
                    - strong [ref=e368]: MCP
                    - text: ‌
                    - mark [ref=e369]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e370]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e371]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e372]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e373]:
                    - text: ‌
                    - strong [ref=e374]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e379] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e389]:
                  - generic [ref=e390]:
                    - generic [ref=e391]:
                      - generic [ref=e393]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e396]:
                      - list [ref=e403]:
                        - listitem [ref=e404]:
                          - mark [ref=e405]:
                            - text: ‌
                            - strong [ref=e406]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e412]:
                          - mark [ref=e413]:
                            - text: ‌
                            - strong [ref=e414]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e415]:
                            - listitem [ref=e416]:
                              - mark [ref=e417]:
                                - text: ‌
                                - strong [ref=e418]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e419]:
                              - mark [ref=e420]:
                                - text: ‌
                                - strong [ref=e421]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e422]:
                              - mark [ref=e423]:
                                - text: ‌
                                - strong [ref=e424]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e430]:
                          - mark [ref=e431]:
                            - text: ‌
                            - strong [ref=e432]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e437] [cursor=pointer]: 百科
                      - link "" [ref=e445] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=J9SE4xUmLj0TSRqXIJEgjWQxcrgDTCGdlRzudSogVbJWIVPI2DyKHTUEx0v2tI5IvqjMgBFkqn8cAWXMXhLdj_
                        - generic [ref=e447]:
                          - generic [ref=e452]: 
                          - text: 
                  - generic [ref=e454]:
                    - generic [ref=e455]:
                      - generic [ref=e457]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e460]:
                      - list [ref=e467]:
                        - listitem [ref=e468]:
                          - mark [ref=e469]:
                            - text: ‌
                            - strong [ref=e470]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e471]:
                            - listitem [ref=e472]:
                              - mark [ref=e473]:
                                - text: ‌
                                - strong [ref=e474]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e475]:
                              - mark [ref=e476]:
                                - text: ‌
                                - strong [ref=e477]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e478]:
                              - mark [ref=e479]:
                                - text: ‌
                                - strong [ref=e480]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e481]:
                          - mark [ref=e482]:
                            - text: ‌
                            - strong [ref=e483]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e484]:
                            - listitem [ref=e485]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e486]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e487]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e488]:
                          - mark [ref=e489]:
                            - text: ‌
                            - strong [ref=e490]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e491]:
                            - listitem [ref=e492]:
                              - mark [ref=e493]:
                                - text: ‌
                                - strong [ref=e494]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e495]:
                              - mark [ref=e496]:
                                - text: ‌
                                - strong [ref=e497]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e498]:
                              - mark [ref=e499]:
                                - text: ‌
                                - strong [ref=e500]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e513] [cursor=pointer]:
