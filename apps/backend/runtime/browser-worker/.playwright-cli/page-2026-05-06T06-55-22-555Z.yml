                            - listitem [ref=e547]:
                              - mark [ref=e548]:
                                - text: ‌
                                - strong [ref=e549]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e550]:
                              - mark [ref=e551]:
                                - text: ‌
                                - strong [ref=e552]: 强化安全保障
                                - text: ‌
