                - paragraph [ref=e601]:
                  - mark [ref=e602]:
                    - text: ‌
                    - strong [ref=e603]: MCP
                    - text: ‌
                    - mark [ref=e604]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e605]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e606]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e607]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e608]:
                    - text: ‌
                    - strong [ref=e609]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e614] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e624]:
                  - generic [ref=e625]:
                    - generic [ref=e626]:
                      - generic [ref=e628]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e631]:
                      - list [ref=e638]:
                        - listitem [ref=e639]:
                          - mark [ref=e640]:
                            - text: ‌
                            - strong [ref=e641]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e647]:
                          - mark [ref=e648]:
                            - text: ‌
                            - strong [ref=e649]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e650]:
                            - listitem [ref=e651]:
                              - mark [ref=e652]:
                                - text: ‌
                                - strong [ref=e653]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e654]:
                              - mark [ref=e655]:
                                - text: ‌
                                - strong [ref=e656]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e657]:
                              - mark [ref=e658]:
                                - text: ‌
                                - strong [ref=e659]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e665]:
                          - mark [ref=e666]:
                            - text: ‌
                            - strong [ref=e667]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e672] [cursor=pointer]: 百科
                      - link "" [ref=e680] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=ts-kT_Cm9tHnTpg02dNgVmApTYncdiGwN5qnnOGszuM4vgHIrkkJDv3RZ0GNT2U-lrDnCJyfRr53uk26K7FZGq
                        - generic [ref=e682]:
                          - generic [ref=e687]: 
                          - text: 
                  - generic [ref=e689]:
                    - generic [ref=e690]:
                      - generic [ref=e692]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e695]:
                      - list [ref=e702]:
                        - listitem [ref=e703]:
                          - mark [ref=e704]:
                            - text: ‌
                            - strong [ref=e705]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e706]:
                            - listitem [ref=e707]:
                              - mark [ref=e708]:
                                - text: ‌
                                - strong [ref=e709]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e710]:
                              - mark [ref=e711]:
                                - text: ‌
                                - strong [ref=e712]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e713]:
                              - mark [ref=e714]:
                                - text: ‌
                                - strong [ref=e715]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e716]:
                          - mark [ref=e717]:
                            - text: ‌
                            - strong [ref=e718]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e719]:
                            - listitem [ref=e720]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e721]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e722]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e723]:
                          - mark [ref=e724]:
                            - text: ‌
                            - strong [ref=e725]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e726]:
                            - listitem [ref=e727]:
                              - mark [ref=e728]:
                                - text: ‌
                                - strong [ref=e729]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e730]:
                              - mark [ref=e731]:
                                - text: ‌
                                - strong [ref=e732]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e733]:
                              - mark [ref=e734]:
                                - text: ‌
                                - strong [ref=e735]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e748] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=ts-kT_Cm9tHnTpg02dNgVmApTYncdiGwN5qnnOGszuM4vgHIrkkJDv3RZ0GNT2U-9n7TmDx1q54pMLx8LvDJzq
                        - generic [ref=e750]:
                          - generic [ref=e755]: 
                          - text: 
                  - generic [ref=e757]:
                    - generic [ref=e758]:
                      - generic [ref=e760]: MCP 的应用场景与优势
                      - text: 
                    - generic [ref=e763]:
                      - list [ref=e770]:
                        - listitem [ref=e771]:
                          - paragraph [ref=e772]:
                            - mark [ref=e773]:
                              - text: ‌
                              - strong [ref=e774]: 核心优势
                              - text: ‌
                            - text: ：
                          - list [ref=e775]:
                            - listitem [ref=e776]:
                              - mark [ref=e777]:
                                - text: ‌
                                - strong [ref=e778]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e779]:
                              - mark [ref=e780]:
                                - text: ‌
                                - strong [ref=e781]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e782]:
                              - mark [ref=e783]:
                                - text: ‌
                                - strong [ref=e784]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e785]:
                              - mark [ref=e786]:
                                - text: ‌
                                - strong [ref=e787]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e793]:
                          - paragraph [ref=e794]:
                            - mark [ref=e795]:
                              - text: ‌
                              - strong [ref=e796]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e797]:
                            - listitem [ref=e798]:
                              - mark [ref=e799]:
                                - text: ‌
                                - strong [ref=e800]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e801]:
                              - mark [ref=e802]:
                                - text: ‌
                                - strong [ref=e803]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e804]:
                              - mark [ref=e805]:
                                - text: ‌
                                - strong [ref=e806]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e807]:
                              - mark [ref=e808]:
                                - text: ‌
                                - strong [ref=e809]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e815]:
                          - paragraph [ref=e816]:
                            - mark [ref=e817]:
                              - text: ‌
                              - strong [ref=e818]: 生态发展
                              - text: ‌
                            - text: ：Anthropic 在发布时提供了初步的规范和 SDK（如 Python 和 TypeScript），并开源了多个预构建的 MCP 服务器（如 Google Drive、GitHub 集成），以加速社区采纳 。‌‌‌
