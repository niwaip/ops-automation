                    - text: ‌
                    - strong [ref=e531]: MCP
                    - text: ‌
                    - mark [ref=e532]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e533]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e534]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e535]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e536]:
                    - text: ‌
                    - strong [ref=e537]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e542] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e552]:
                  - generic [ref=e553]:
                    - generic [ref=e554]:
                      - generic [ref=e556]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e559]:
                      - list [ref=e566]:
                        - listitem [ref=e567]:
                          - mark [ref=e568]:
                            - text: ‌
                            - strong [ref=e569]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e575]:
                          - mark [ref=e576]:
                            - text: ‌
                            - strong [ref=e577]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e578]:
                            - listitem [ref=e579]:
                              - mark [ref=e580]:
                                - text: ‌
                                - strong [ref=e581]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e582]:
                              - mark [ref=e583]:
                                - text: ‌
                                - strong [ref=e584]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e585]:
                              - mark [ref=e586]:
                                - text: ‌
                                - strong [ref=e587]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e593]:
                          - mark [ref=e594]:
                            - text: ‌
                            - strong [ref=e595]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e600] [cursor=pointer]: 百科
                      - link "" [ref=e608] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=QrTFmglu6AWFFhKu2VrRTGDfB6DSskhLmC6DEKdhxpQd61b6dqyagKEX-lUI93k_7w5que2o7Gk6hm8sMoW4pq
                        - generic [ref=e610]:
                          - generic [ref=e615]: 
                          - text: 
                  - generic [ref=e617]:
                    - generic [ref=e618]:
                      - generic [ref=e620]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e623]:
                      - list [ref=e630]:
                        - listitem [ref=e631]:
                          - mark [ref=e632]:
                            - text: ‌
                            - strong [ref=e633]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e634]:
                            - listitem [ref=e635]:
                              - mark [ref=e636]:
                                - text: ‌
                                - strong [ref=e637]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e638]:
                              - mark [ref=e639]:
                                - text: ‌
                                - strong [ref=e640]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e641]:
                              - mark [ref=e642]:
                                - text: ‌
                                - strong [ref=e643]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e644]:
                          - mark [ref=e645]:
                            - text: ‌
                            - strong [ref=e646]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e647]:
                            - listitem [ref=e648]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e649]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e650]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e651]:
                          - mark [ref=e652]:
                            - text: ‌
                            - strong [ref=e653]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e654]:
                            - listitem [ref=e655]:
                              - mark [ref=e656]:
                                - text: ‌
                                - strong [ref=e657]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e658]:
                              - mark [ref=e659]:
                                - text: ‌
                                - strong [ref=e660]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e661]:
                              - mark [ref=e662]:
                                - text: ‌
                                - strong [ref=e663]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e676] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=QrTFmglu6AWFFhKu2VrRTGDfB6DSskhLmC6DEKdhxpQd61b6dqyagKEX-lUI93k_VSt99a5ZJ5Jzib8PRDNc4_
                        - generic [ref=e678]:
                          - generic [ref=e683]: 
                          - text: 
                  - generic [ref=e685]:
                    - generic [ref=e686]:
                      - generic [ref=e688]: MCP 的应用场景与优势
                      - text: 
                    - generic [ref=e691]:
                      - list [ref=e698]:
                        - listitem [ref=e699]:
                          - paragraph [ref=e700]:
                            - mark [ref=e701]:
                              - text: ‌
                              - strong [ref=e702]: 核心优势
                              - text: ‌
                            - text: ：
                          - list [ref=e703]:
                            - listitem [ref=e704]:
                              - mark [ref=e705]:
                                - text: ‌
                                - strong [ref=e706]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e707]:
                              - mark [ref=e708]:
                                - text: ‌
                                - strong [ref=e709]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e710]:
                              - mark [ref=e711]:
                                - text: ‌
                                - strong [ref=e712]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e713]:
                              - mark [ref=e714]:
                                - text: ‌
                                - strong [ref=e715]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e721]:
                          - paragraph [ref=e722]:
                            - mark [ref=e723]:
                              - text: ‌
                              - strong [ref=e724]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e725]:
                            - listitem [ref=e726]:
                              - mark [ref=e727]:
                                - text: ‌
                                - strong [ref=e728]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e729]:
                              - mark [ref=e730]:
                                - text: ‌
                                - strong [ref=e731]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e732]:
                              - mark [ref=e733]:
                                - text: ‌
                                - strong [ref=e734]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e735]:
                              - mark [ref=e736]:
                                - text: ‌
                                - strong [ref=e737]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e743]:
                          - paragraph [ref=e744]:
                            - mark [ref=e745]:
                              - text: ‌
                              - strong [ref=e746]: 生态发展
                              - text: ‌
