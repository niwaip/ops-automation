                  - generic [ref=e644]:
                    - generic [ref=e645]:
                      - generic [ref=e647]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e650]:
                      - list [ref=e657]:
                        - listitem [ref=e658]:
                          - mark [ref=e659]:
                            - text: ‌
                            - strong [ref=e660]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e661]:
                            - listitem [ref=e662]:
                              - mark [ref=e663]:
                                - text: ‌
                                - strong [ref=e664]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e665]:
                              - mark [ref=e666]:
                                - text: ‌
                                - strong [ref=e667]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e668]:
                              - mark [ref=e669]:
                                - text: ‌
                                - strong [ref=e670]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e671]:
                          - mark [ref=e672]:
                            - text: ‌
                            - strong [ref=e673]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e674]:
                            - listitem [ref=e675]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e676]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e677]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e678]:
                          - mark [ref=e679]:
                            - text: ‌
                            - strong [ref=e680]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e681]:
                            - listitem [ref=e682]:
                              - mark [ref=e683]:
                                - text: ‌
                                - strong [ref=e684]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e685]:
                              - mark [ref=e686]:
                                - text: ‌
                                - strong [ref=e687]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e688]:
                              - mark [ref=e689]:
                                - text: ‌
                                - strong [ref=e690]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e703] [cursor=pointer]:
