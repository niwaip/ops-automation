                    - text: ‌
                    - mark [ref=e559]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e560]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e561]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e562]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e563]:
                    - text: ‌
                    - strong [ref=e564]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e569] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e579]:
                  - generic [ref=e580]:
                    - generic [ref=e581]:
                      - generic [ref=e583]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e586]:
                      - list [ref=e593]:
                        - listitem [ref=e594]:
                          - mark [ref=e595]:
                            - text: ‌
                            - strong [ref=e596]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e602]:
                          - mark [ref=e603]:
                            - text: ‌
                            - strong [ref=e604]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e605]:
                            - listitem [ref=e606]:
                              - mark [ref=e607]:
                                - text: ‌
                                - strong [ref=e608]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e609]:
                              - mark [ref=e610]:
                                - text: ‌
                                - strong [ref=e611]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e612]:
                              - mark [ref=e613]:
                                - text: ‌
                                - strong [ref=e614]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e620]:
                          - mark [ref=e621]:
                            - text: ‌
                            - strong [ref=e622]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e627] [cursor=pointer]: 百科
                      - link "" [ref=e635] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=q0Gn8Tcfe1lTALht7tA4VFq7O1hXy_f2UOzLNII30-C8vuJ_1thph7_8gTuS9AIL57ItjVAH1LmFsZXn87Ic1q
                        - generic [ref=e637]:
