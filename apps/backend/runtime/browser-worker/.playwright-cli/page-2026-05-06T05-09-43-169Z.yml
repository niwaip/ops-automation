                      - list [ref=e725]:
                        - listitem [ref=e726]:
                          - paragraph [ref=e727]:
                            - mark [ref=e728]:
                              - text: ‌
                              - strong [ref=e729]: 核心优势
                              - text: ‌
                            - text: ：
                          - list [ref=e730]:
                            - listitem [ref=e731]:
                              - mark [ref=e732]:
                                - text: ‌
                                - strong [ref=e733]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e734]:
                              - mark [ref=e735]:
                                - text: ‌
                                - strong [ref=e736]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e737]:
                              - mark [ref=e738]:
                                - text: ‌
                                - strong [ref=e739]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e740]:
                              - mark [ref=e741]:
                                - text: ‌
                                - strong [ref=e742]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e748]:
                          - paragraph [ref=e749]:
                            - mark [ref=e750]:
                              - text: ‌
                              - strong [ref=e751]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e752]:
                            - listitem [ref=e753]:
                              - mark [ref=e754]:
                                - text: ‌
                                - strong [ref=e755]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e756]:
                              - mark [ref=e757]:
                                - text: ‌
                                - strong [ref=e758]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e759]:
                              - mark [ref=e760]:
                                - text: ‌
                                - strong [ref=e761]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e762]:
                              - mark [ref=e763]:
                                - text: ‌
                                - strong [ref=e764]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e770]:
                          - paragraph [ref=e771]:
                            - mark [ref=e772]:
                              - text: ‌
                              - strong [ref=e773]: 生态发展
                              - text: ‌
                            - text: ：Anthropic 在发布时提供了初步的规范和 SDK（如 Python 和 TypeScript），并开源了多个预构建的 MCP 服务器（如 Google Drive、GitHub 集成），以加速社区采纳 。‌‌‌
