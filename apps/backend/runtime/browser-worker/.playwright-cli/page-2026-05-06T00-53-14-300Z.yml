                  - mark [ref=e631]:
                    - text: ‌
                    - strong [ref=e632]: MCP
                    - text: ‌
                    - mark [ref=e633]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e634]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e635]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e636]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e637]:
                    - text: ‌
                    - strong [ref=e638]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e643] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e653]:
                  - generic [ref=e654]:
                    - generic [ref=e655]:
                      - generic [ref=e657]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e660]:
                      - list [ref=e667]:
                        - listitem [ref=e668]:
                          - mark [ref=e669]:
                            - text: ‌
                            - strong [ref=e670]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e676]:
                          - mark [ref=e677]:
                            - text: ‌
                            - strong [ref=e678]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e679]:
                            - listitem [ref=e680]:
                              - mark [ref=e681]:
                                - text: ‌
                                - strong [ref=e682]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e683]:
                              - mark [ref=e684]:
                                - text: ‌
                                - strong [ref=e685]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e686]:
                              - mark [ref=e687]:
                                - text: ‌
                                - strong [ref=e688]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e694]:
                          - mark [ref=e695]:
                            - text: ‌
                            - strong [ref=e696]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e701] [cursor=pointer]: 百科
                      - link "" [ref=e709] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=riFYAFls9CCZ3G1pfwIbVSs-Id1_vj7UCXkJJY2bZI_nxHiIHYxPGB80uf3WD8xrwuNAjpwU9wW2S1c4n5osJa
                        - generic [ref=e711]:
                          - generic [ref=e716]: 
                          - text: 
                  - generic [ref=e718]:
                    - generic [ref=e719]:
                      - generic [ref=e721]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e724]:
                      - list [ref=e731]:
                        - listitem [ref=e732]:
                          - mark [ref=e733]:
                            - text: ‌
                            - strong [ref=e734]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e735]:
                            - listitem [ref=e736]:
                              - mark [ref=e737]:
                                - text: ‌
                                - strong [ref=e738]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e739]:
                              - mark [ref=e740]:
                                - text: ‌
                                - strong [ref=e741]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e742]:
                              - mark [ref=e743]:
                                - text: ‌
                                - strong [ref=e744]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e745]:
                          - mark [ref=e746]:
                            - text: ‌
                            - strong [ref=e747]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e748]:
                            - listitem [ref=e749]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e750]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e751]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e752]:
                          - mark [ref=e753]:
                            - text: ‌
                            - strong [ref=e754]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e755]:
                            - listitem [ref=e756]:
                              - mark [ref=e757]:
                                - text: ‌
                                - strong [ref=e758]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e759]:
                              - mark [ref=e760]:
                                - text: ‌
                                - strong [ref=e761]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e762]:
                              - mark [ref=e763]:
                                - text: ‌
                                - strong [ref=e764]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e777] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=riFYAFls9CCZ3G1pfwIbVSs-Id1_vj7UCXkJJY2bZI_nxHiIHYxPGB80uf3WD8xrDr7AQudjDJIequP7FdBaVK
                        - generic [ref=e779]:
                          - generic [ref=e784]: 
                          - text: 
                  - generic [ref=e786]:
                    - generic [ref=e787]:
                      - generic [ref=e789]: MCP 的应用场景与优势
                      - text: 
                    - generic [ref=e792]:
                      - list [ref=e799]:
                        - listitem [ref=e800]:
                          - paragraph [ref=e801]:
                            - mark [ref=e802]:
                              - text: ‌
                              - strong [ref=e803]: 核心优势
                              - text: ‌
                            - text: ：
                          - list [ref=e804]:
                            - listitem [ref=e805]:
                              - mark [ref=e806]:
                                - text: ‌
                                - strong [ref=e807]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e808]:
                              - mark [ref=e809]:
                                - text: ‌
                                - strong [ref=e810]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e811]:
                              - mark [ref=e812]:
                                - text: ‌
                                - strong [ref=e813]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e814]:
                              - mark [ref=e815]:
                                - text: ‌
                                - strong [ref=e816]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e822]:
                          - paragraph [ref=e823]:
                            - mark [ref=e824]:
                              - text: ‌
                              - strong [ref=e825]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e826]:
                            - listitem [ref=e827]:
                              - mark [ref=e828]:
                                - text: ‌
                                - strong [ref=e829]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e830]:
                              - mark [ref=e831]:
                                - text: ‌
                                - strong [ref=e832]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e833]:
                              - mark [ref=e834]:
                                - text: ‌
                                - strong [ref=e835]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e836]:
                              - mark [ref=e837]:
                                - text: ‌
                                - strong [ref=e838]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e844]:
                          - paragraph [ref=e845]:
                            - mark [ref=e846]:
                              - text: ‌
                              - strong [ref=e847]: 生态发展
                              - text: ‌
                            - text: ：Anthropic 在发布时提供了初步的规范和 SDK（如 Python 和 TypeScript），并开源了多个预构建的 MCP 服务器（如 Google Drive、GitHub 集成），以加速社区采纳 。‌‌‌
