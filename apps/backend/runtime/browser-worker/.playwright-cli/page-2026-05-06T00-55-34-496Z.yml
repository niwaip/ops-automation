                    - strong [ref=e434]: MCP
                    - text: ‌
                    - mark [ref=e435]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e436]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e437]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e438]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e439]:
                    - text: ‌
                    - strong [ref=e440]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e445] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e455]:
                  - generic [ref=e456]:
                    - generic [ref=e457]:
                      - generic [ref=e459]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e462]:
                      - list [ref=e469]:
                        - listitem [ref=e470]:
                          - mark [ref=e471]:
                            - text: ‌
                            - strong [ref=e472]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e478]:
                          - mark [ref=e479]:
                            - text: ‌
                            - strong [ref=e480]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e481]:
                            - listitem [ref=e482]:
                              - mark [ref=e483]:
                                - text: ‌
                                - strong [ref=e484]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e485]:
                              - mark [ref=e486]:
                                - text: ‌
                                - strong [ref=e487]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e488]:
                              - mark [ref=e489]:
                                - text: ‌
                                - strong [ref=e490]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e496]:
                          - mark [ref=e497]:
                            - text: ‌
                            - strong [ref=e498]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e503] [cursor=pointer]: 百科
                      - link "" [ref=e511] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=riFYAFls9CCZ3G1pfwIbVSs-Id1_vj7UCXkJJY2bZI_nxHiIHYxPGB80uf3WD8xrwuNAjpwU9wW2S1c4n5osJa
                        - generic [ref=e513]:
                          - generic [ref=e518]: 
                          - text: 
                  - generic [ref=e520]:
                    - generic [ref=e521]:
                      - generic [ref=e523]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e526]:
                      - list [ref=e533]:
                        - listitem [ref=e534]:
                          - mark [ref=e535]:
                            - text: ‌
                            - strong [ref=e536]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e537]:
                            - listitem [ref=e538]:
                              - mark [ref=e539]:
                                - text: ‌
                                - strong [ref=e540]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e541]:
                              - mark [ref=e542]:
                                - text: ‌
                                - strong [ref=e543]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e544]:
                              - mark [ref=e545]:
                                - text: ‌
                                - strong [ref=e546]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e547]:
                          - mark [ref=e548]:
                            - text: ‌
                            - strong [ref=e549]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e550]:
                            - listitem [ref=e551]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e552]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e553]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e554]:
                          - mark [ref=e555]:
                            - text: ‌
                            - strong [ref=e556]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e557]:
                            - listitem [ref=e558]:
                              - mark [ref=e559]:
                                - text: ‌
                                - strong [ref=e560]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e561]:
                              - mark [ref=e562]:
                                - text: ‌
                                - strong [ref=e563]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e564]:
                              - mark [ref=e565]:
                                - text: ‌
                                - strong [ref=e566]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e579] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=riFYAFls9CCZ3G1pfwIbVSs-Id1_vj7UCXkJJY2bZI_nxHiIHYxPGB80uf3WD8xrDr7AQudjDJIequP7FdBaVK
                        - generic [ref=e581]:
                          - generic [ref=e586]: 
                          - text: 
                  - generic [ref=e588]:
                    - generic [ref=e589]:
                      - generic [ref=e591]: MCP 的应用场景与优势
                      - text: 
                    - generic [ref=e594]:
                      - list [ref=e601]:
                        - listitem [ref=e602]:
                          - paragraph [ref=e603]:
                            - mark [ref=e604]:
                              - text: ‌
                              - strong [ref=e605]: 核心优势
                              - text: ‌
                            - text: ：
                          - list [ref=e606]:
                            - listitem [ref=e607]:
                              - mark [ref=e608]:
                                - text: ‌
                                - strong [ref=e609]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e610]:
                              - mark [ref=e611]:
                                - text: ‌
                                - strong [ref=e612]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e613]:
                              - mark [ref=e614]:
                                - text: ‌
                                - strong [ref=e615]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e616]:
                              - mark [ref=e617]:
                                - text: ‌
                                - strong [ref=e618]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e624]:
                          - paragraph [ref=e625]:
                            - mark [ref=e626]:
                              - text: ‌
                              - strong [ref=e627]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e628]:
                            - listitem [ref=e629]:
                              - mark [ref=e630]:
                                - text: ‌
                                - strong [ref=e631]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e632]:
                              - mark [ref=e633]:
                                - text: ‌
                                - strong [ref=e634]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e635]:
                              - mark [ref=e636]:
                                - text: ‌
                                - strong [ref=e637]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e638]:
                              - mark [ref=e639]:
                                - text: ‌
                                - strong [ref=e640]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e646]:
                          - paragraph [ref=e647]:
                            - mark [ref=e648]:
                              - text: ‌
                              - strong [ref=e649]: 生态发展
                              - text: ‌
                            - text: ：Anthropic 在发布时提供了初步的规范和 SDK（如 Python 和 TypeScript），并开源了多个预构建的 MCP 服务器（如 Google Drive、GitHub 集成），以加速社区采纳 。‌‌‌
