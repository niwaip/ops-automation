                  - generic [ref=e354]:
                    - generic [ref=e356]: AI领域的核心概念：Skills规范
                    - text: 
                  - generic [ref=e359]:
                    - generic [ref=e365]:
                      - paragraph [ref=e366]:
                        - text: 在人工智能，特别是大模型与智能体（Agent）技术快速发展的背景下，
                        - mark [ref=e367]:
                          - text: ‌
                          - strong [ref=e368]: “Skills”已从一个普通词汇演变为一个特定的技术概念
                          - text: ‌
                        - text: 。它最早由Anthropic公司为其大模型Claude提出，并于2025年成为一个开放的行业标准。‌‌‌
                        - generic [ref=e373] [cursor=pointer]: 百科
                        - text: ‌
                      - list [ref=e379]:
                        - listitem [ref=e380]:
                          - mark [ref=e381]:
                            - text: ‌
                            - strong [ref=e382]: 基本定义与作用
                            - text: ‌
                            - mark [ref=e383]: ：一个Skill是一个打包好的“技能包”或“专家级操作手册”。
                            - text: ‌
                            - strong [ref=e384]: 它将完成特定任务（如预订机票、生成简历）所需的领域知识、操作流程、工具调用和最佳实践封装在一起
                            - text: ‌
                          - text: 。当用户向AI智能体提出请求时，智能体会自动匹配并加载相应的Skill，从而稳定、一致地输出高质量结果，而非依赖一次性的临时提示词（prompt）。
                        - listitem [ref=e385]:
                          - mark [ref=e386]:
                            - text: ‌
                            - strong [ref=e387]: 技术实现与架构
                            - text: ‌
                          - text: ：从技术上看，一个Skill通常是一个包含核心文件
                          - code [ref=e388]: SKILL.md
                          - text: 的文件夹。
                          - mark [ref=e389]:
                            - text: ‌
                            - strong [ref=e390]:
                              - code [ref=e391]: SKILL.md
                              - text: 文件定义了该技能的元数据、执行指令和上下文
                            - text: ‌
                          - text: ，还可能包含脚本、参考文档等资源。AI智能体通过读取这份“说明书”来理解如何执行任务。在整体架构中，Skills属于“行为规范层”，负责定义业务逻辑和流程，它与负责提供底层工具和数据的MCP（Model Context Protocol）协议以及负责整体协调执行的Agent共同协作。
                        - listitem [ref=e392]:
                          - mark [ref=e393]:
                            - text: ‌
                            - strong [ref=e394]: 发展现状与生态
                            - text: ‌
                            - mark [ref=e395]: ：目前，
                            - text: ‌
                            - strong [ref=e396]: Skills规范已获得微软Azure、GitHub Copilot等主流平台的支持
                            - text: ‌
                          - text: ，正在从Claude独有的功能发展为行业通用标准。许多企业也开始集成或开发自己的Skills，例如在金融、支付、地图服务等领域，通过Skills让AI能够执行专业的业务流程。‌‌‌
