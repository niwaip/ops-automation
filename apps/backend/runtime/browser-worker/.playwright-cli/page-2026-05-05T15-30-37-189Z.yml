                    - paragraph [ref=e436]: 抛开技术语境，“skills”是名词“skill”的复数形式，其基本释义在全球范围内通用。
                    - list [ref=e437]:
                      - listitem [ref=e438]:
                        - mark [ref=e439]:
                          - text: ‌
