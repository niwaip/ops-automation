                            - listitem [ref=e764]:
                              - mark [ref=e765]:
                                - text: ‌
                                - strong [ref=e766]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e767]:
                              - mark [ref=e768]:
                                - text: ‌
                                - strong [ref=e769]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e770]:
                              - mark [ref=e771]:
                                - text: ‌
                                - strong [ref=e772]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e778]:
                          - paragraph [ref=e779]:
                            - mark [ref=e780]:
                              - text: ‌
                              - strong [ref=e781]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e782]:
                            - listitem [ref=e783]:
                              - mark [ref=e784]:
                                - text: ‌
                                - strong [ref=e785]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e786]:
                              - mark [ref=e787]:
                                - text: ‌
                                - strong [ref=e788]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e789]:
                              - mark [ref=e790]:
                                - text: ‌
                                - strong [ref=e791]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e792]:
                              - mark [ref=e793]:
                                - text: ‌
                                - strong [ref=e794]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e800]:
                          - paragraph [ref=e801]:
                            - mark [ref=e802]:
