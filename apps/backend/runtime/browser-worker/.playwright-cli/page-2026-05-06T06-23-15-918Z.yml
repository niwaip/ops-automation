                    - generic [ref=e611]:
                      - generic [ref=e613]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e616]:
                      - list [ref=e623]:
                        - listitem [ref=e624]:
                          - mark [ref=e625]:
                            - text: ‌
                            - strong [ref=e626]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e632]:
                          - mark [ref=e633]:
                            - text: ‌
                            - strong [ref=e634]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e635]:
                            - listitem [ref=e636]:
                              - mark [ref=e637]:
                                - text: ‌
                                - strong [ref=e638]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e639]:
                              - mark [ref=e640]:
                                - text: ‌
                                - strong [ref=e641]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e642]:
                              - mark [ref=e643]:
                                - text: ‌
                                - strong [ref=e644]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e650]:
                          - mark [ref=e651]:
                            - text: ‌
                            - strong [ref=e652]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e657] [cursor=pointer]: 百科
                      - link "" [ref=e665] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=QItJdNPoT3fsP_o75G6xAoVUfnRLvs5PZbUUqomvzwnMD9mmzYl3FhiQ1BA5xrimDuJBdYkx-xf-llE8qJnfS_
                        - generic [ref=e667]:
                          - generic [ref=e672]: 
                          - text: 
                  - generic [ref=e674]:
                    - generic [ref=e675]:
                      - generic [ref=e677]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e680]:
                      - list [ref=e687]:
                        - listitem [ref=e688]:
                          - mark [ref=e689]:
                            - text: ‌
                            - strong [ref=e690]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e691]:
                            - listitem [ref=e692]:
                              - mark [ref=e693]:
                                - text: ‌
                                - strong [ref=e694]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e695]:
                              - mark [ref=e696]:
                                - text: ‌
                                - strong [ref=e697]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e698]:
                              - mark [ref=e699]:
                                - text: ‌
                                - strong [ref=e700]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e701]:
                          - mark [ref=e702]:
                            - text: ‌
                            - strong [ref=e703]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e704]:
                            - listitem [ref=e705]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e706]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e707]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e708]:
                          - mark [ref=e709]:
                            - text: ‌
                            - strong [ref=e710]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e711]:
                            - listitem [ref=e712]:
                              - mark [ref=e713]:
                                - text: ‌
                                - strong [ref=e714]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e715]:
                              - mark [ref=e716]:
                                - text: ‌
                                - strong [ref=e717]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e718]:
                              - mark [ref=e719]:
                                - text: ‌
                                - strong [ref=e720]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
