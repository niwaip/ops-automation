                  - mark [ref=e572]:
                    - text: ‌
                    - strong [ref=e573]: MCP
                    - text: ‌
                    - mark [ref=e574]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e575]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e576]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e577]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e578]:
                    - text: ‌
                    - strong [ref=e579]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌
                  - generic [ref=e584] [cursor=pointer]: 百科
                  - text: ‌‌
                  - generic [ref=e588] [cursor=pointer]: "2"
                  - text: ‌‌
                  - generic [ref=e592] [cursor=pointer]: "3"
                - generic [ref=e597]:
                  - generic [ref=e598]:
                    - generic [ref=e599]:
                      - generic [ref=e601]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e604]:
                      - list [ref=e611]:
                        - listitem [ref=e612]:
                          - mark [ref=e613]:
                            - text: ‌
                            - strong [ref=e614]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌
                          - generic [ref=e618] [cursor=pointer]: "4"
                          - text: ‌‌
                          - generic [ref=e622] [cursor=pointer]: "5"
                        - listitem [ref=e623]:
                          - mark [ref=e624]:
                            - text: ‌
                            - strong [ref=e625]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e626]:
                            - listitem [ref=e627]:
                              - mark [ref=e628]:
                                - text: ‌
                                - strong [ref=e629]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e630]:
                              - mark [ref=e631]:
                                - text: ‌
                                - strong [ref=e632]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e633]:
                              - mark [ref=e634]:
                                - text: ‌
                                - strong [ref=e635]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌
                              - generic [ref=e639] [cursor=pointer]: "2"
                              - text: ‌‌
                              - generic [ref=e643] [cursor=pointer]: "4"
                        - listitem [ref=e644]:
                          - mark [ref=e645]:
                            - text: ‌
                            - strong [ref=e646]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌
                          - generic [ref=e651] [cursor=pointer]: 百科
                      - link "" [ref=e659] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=GZbeSvHGDDr-UTyjBbeDmXKJSqpIK9smj0ThYd96PIEOhl9bPv12Cm9z18WI__qDlMoU5T-z_N1JKN-Re2dnU_
                        - generic [ref=e661]:
                          - generic [ref=e666]: 
                          - text: 
                  - generic [ref=e668]:
                    - generic [ref=e669]:
                      - generic [ref=e671]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e674]:
                      - list [ref=e681]:
                        - listitem [ref=e682]:
                          - mark [ref=e683]:
                            - text: ‌
                            - strong [ref=e684]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e685]:
                            - listitem [ref=e686]:
                              - mark [ref=e687]:
                                - text: ‌
                                - strong [ref=e688]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e689]:
                              - mark [ref=e690]:
                                - text: ‌
                                - strong [ref=e691]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e692]:
                              - mark [ref=e693]:
                                - text: ‌
                                - strong [ref=e694]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e695]:
                          - mark [ref=e696]:
                            - text: ‌
                            - strong [ref=e697]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e698]:
                            - listitem [ref=e699]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e700]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e701]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e702]:
                          - mark [ref=e703]:
                            - text: ‌
                            - strong [ref=e704]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e705]:
                            - listitem [ref=e706]:
                              - mark [ref=e707]:
                                - text: ‌
                                - strong [ref=e708]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e709]:
                              - mark [ref=e710]:
                                - text: ‌
                                - strong [ref=e711]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e712]:
                              - mark [ref=e713]:
                                - text: ‌
                                - strong [ref=e714]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌
                              - generic [ref=e718] [cursor=pointer]: "4"
                      - link "" [ref=e726] [cursor=pointer]:
