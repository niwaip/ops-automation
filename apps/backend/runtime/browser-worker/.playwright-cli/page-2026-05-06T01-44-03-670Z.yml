                    - generic [ref=e565]:
                      - list [ref=e572]:
                        - listitem [ref=e573]:
                          - paragraph [ref=e574]:
                            - mark [ref=e575]:
                              - text: ‌
                              - strong [ref=e576]: 核心优势
                              - text: ‌
                            - text: ：
                          - list [ref=e577]:
                            - listitem [ref=e578]:
                              - mark [ref=e579]:
                                - text: ‌
                                - strong [ref=e580]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e581]:
                              - mark [ref=e582]:
                                - text: ‌
                                - strong [ref=e583]: 工具自动发现
                                - text: ‌
                              - text: ：AI 能够自主检测并集成新工具，提升效率与便捷性。
                            - listitem [ref=e584]:
                              - mark [ref=e585]:
                                - text: ‌
                                - strong [ref=e586]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e587]:
                              - mark [ref=e588]:
                                - text: ‌
                                - strong [ref=e589]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e595]:
                          - paragraph [ref=e596]:
                            - mark [ref=e597]:
                              - text: ‌
                              - strong [ref=e598]: 典型应用场景
                              - text: ‌
                            - text: ：
                          - list [ref=e599]:
                            - listitem [ref=e600]:
                              - mark [ref=e601]:
                                - text: ‌
                                - strong [ref=e602]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e603]:
                              - mark [ref=e604]:
                                - text: ‌
                                - strong [ref=e605]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e606]:
                              - mark [ref=e607]:
                                - text: ‌
                                - strong [ref=e608]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e609]:
                              - mark [ref=e610]:
                                - text: ‌
                                - strong [ref=e611]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e617]:
                          - paragraph [ref=e618]:
                            - mark [ref=e619]:
