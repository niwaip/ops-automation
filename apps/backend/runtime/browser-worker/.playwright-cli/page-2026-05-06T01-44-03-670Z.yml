                  - mark [ref=e404]:
                    - text: ‌
                    - strong [ref=e405]: MCP
                    - text: ‌
                    - mark [ref=e406]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e407]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e408]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e409]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e410]:
                    - text: ‌
                    - strong [ref=e411]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e416] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e426]:
                  - generic [ref=e427]:
                    - generic [ref=e428]:
                      - generic [ref=e430]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e433]:
                      - list [ref=e440]:
                        - listitem [ref=e441]:
                          - mark [ref=e442]:
                            - text: ‌
                            - strong [ref=e443]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e449]:
                          - mark [ref=e450]:
                            - text: ‌
                            - strong [ref=e451]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e452]:
                            - listitem [ref=e453]:
                              - mark [ref=e454]:
                                - text: ‌
                                - strong [ref=e455]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e456]:
                              - mark [ref=e457]:
                                - text: ‌
                                - strong [ref=e458]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e459]:
                              - mark [ref=e460]:
                                - text: ‌
                                - strong [ref=e461]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e467]:
                          - mark [ref=e468]:
                            - text: ‌
                            - strong [ref=e469]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e474] [cursor=pointer]: 百科
                      - link "" [ref=e482] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=ts-kT_Cm9tHnTpg02dNgVmApTYncdiGwN5qnnOGszuM4vgHIrkkJDv3RZ0GNT2U-lrDnCJyfRr53uk26K7FZGq
                        - generic [ref=e484]:
                          - generic [ref=e489]: 
                          - text: 
                  - generic [ref=e491]:
                    - generic [ref=e492]:
                      - generic [ref=e494]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e497]:
                      - list [ref=e504]:
                        - listitem [ref=e505]:
                          - mark [ref=e506]:
                            - text: ‌
                            - strong [ref=e507]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e508]:
                            - listitem [ref=e509]:
                              - mark [ref=e510]:
                                - text: ‌
                                - strong [ref=e511]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e512]:
                              - mark [ref=e513]:
                                - text: ‌
                                - strong [ref=e514]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e515]:
                              - mark [ref=e516]:
                                - text: ‌
                                - strong [ref=e517]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e518]:
                          - mark [ref=e519]:
                            - text: ‌
                            - strong [ref=e520]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e521]:
                            - listitem [ref=e522]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e523]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e524]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e525]:
                          - mark [ref=e526]:
                            - text: ‌
                            - strong [ref=e527]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e528]:
                            - listitem [ref=e529]:
                              - mark [ref=e530]:
                                - text: ‌
                                - strong [ref=e531]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e532]:
                              - mark [ref=e533]:
                                - text: ‌
                                - strong [ref=e534]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e535]:
                              - mark [ref=e536]:
                                - text: ‌
                                - strong [ref=e537]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e550] [cursor=pointer]:
