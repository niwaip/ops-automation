                              - mark [ref=e748]:
                                - text: ‌
                                - strong [ref=e749]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e750]:
