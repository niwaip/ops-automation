                  - mark [ref=e573]:
                    - text: ‌
                    - strong [ref=e574]: MCP
                    - text: ‌
                    - mark [ref=e575]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e576]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e577]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e578]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e579]:
                    - text: ‌
                    - strong [ref=e580]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e585] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e595]:
                  - generic [ref=e596]:
                    - generic [ref=e597]:
                      - generic [ref=e599]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e602]:
                      - list [ref=e609]:
                        - listitem [ref=e610]:
                          - mark [ref=e611]:
                            - text: ‌
                            - strong [ref=e612]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e618]:
                          - mark [ref=e619]:
                            - text: ‌
                            - strong [ref=e620]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e621]:
                            - listitem [ref=e622]:
                              - mark [ref=e623]:
                                - text: ‌
                                - strong [ref=e624]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e625]:
                              - mark [ref=e626]:
                                - text: ‌
                                - strong [ref=e627]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e628]:
                              - mark [ref=e629]:
                                - text: ‌
                                - strong [ref=e630]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e636]:
                          - mark [ref=e637]:
                            - text: ‌
                            - strong [ref=e638]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e643] [cursor=pointer]: 百科
                      - link "" [ref=e651] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=J9SE4xUmLj0TSRqXIJEgjWQxcrgDTCGdlRzudSogVbJWIVPI2DyKHTUEx0v2tI5IvqjMgBFkqn8cAWXMXhLdj_
                        - generic [ref=e653]:
                          - generic [ref=e658]: 
                          - text: 
                  - generic [ref=e660]:
                    - generic [ref=e661]:
                      - generic [ref=e663]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e666]:
                      - list [ref=e673]:
                        - listitem [ref=e674]:
                          - mark [ref=e675]:
                            - text: ‌
                            - strong [ref=e676]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e677]:
                            - listitem [ref=e678]:
                              - mark [ref=e679]:
                                - text: ‌
                                - strong [ref=e680]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e681]:
                              - mark [ref=e682]:
                                - text: ‌
                                - strong [ref=e683]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e684]:
                              - mark [ref=e685]:
                                - text: ‌
                                - strong [ref=e686]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e687]:
                          - mark [ref=e688]:
                            - text: ‌
                            - strong [ref=e689]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e690]:
                            - listitem [ref=e691]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e692]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e693]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e694]:
                          - mark [ref=e695]:
                            - text: ‌
                            - strong [ref=e696]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e697]:
                            - listitem [ref=e698]:
                              - mark [ref=e699]:
                                - text: ‌
                                - strong [ref=e700]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e701]:
                              - mark [ref=e702]:
                                - text: ‌
                                - strong [ref=e703]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e704]:
                              - mark [ref=e705]:
                                - text: ‌
                                - strong [ref=e706]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
