                - generic [ref=e309]: 百度百科
              - link "王楚钦 王楚钦，男，2000年5月11日出生于吉林省吉林市，国际级运动健将，中国男子乒乓球运动员，中共党员，效力于中国男子乒乓球队和山东魏桥乒乓球俱乐部。2015年12月升入中国国家乒乓球队一队。2017年12月与薛飞获2017世界青少年锦标赛男双冠军。2019年4月27日，搭档马龙获得世界乒乓球锦标赛男双冠军；2021年9月获第十四届全运会男双冠军；2021年11月获休斯顿世乒赛混双金牌。2022年1月获WTT澳门冠军赛男子单打冠军；10月获成都第56届世界乒乓球团体锦标赛冠军、WTT澳门冠军赛男子单打冠军、新乡WTT世界杯男子单打冠军。2023年4月获2023年WTT冠军赛澳门站男单冠军；9月获杭州第19届亚运会乒乓球男子团体、混双、男单、男双冠军。2024年2月获釜山世乒赛团体赛男子团体决赛冠军；5月获2024年WTT沙特阿拉伯大满贯男单、男双、混双冠军。2024年7月获巴黎奥运会乒乓球混双" [ref=e312] [cursor=pointer]:
