                  - mark [ref=e596]:
                    - text: ‌
                    - strong [ref=e597]: MCP
                    - text: ‌
                    - mark [ref=e598]: 主要有两个含义：在人工智能领域指
                    - text: ‌
                    - strong [ref=e599]: 模型上下文协议（Model Context Protocol）
                    - text: ‌
                    - mark [ref=e600]: ，是由 Anthropic 于 2024 年 11 月推出的开放标准协议；在集成电路领域指
                    - text: ‌
                    - strong [ref=e601]: 多芯片封装（Multi-Chip Package）
                    - text: ‌
                  - text: 技术 。当前 AI 领域的 MCP 更为热门，被视为
                  - mark [ref=e602]:
                    - text: ‌
                    - strong [ref=e603]: AI 应用的"USB-C 接口"
                    - text: ‌
                  - text: ，用于实现大模型与外部数据源和工具的无缝集成 。‌‌
                  - generic [ref=e608] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e618]:
                  - generic [ref=e619]:
                    - generic [ref=e620]:
                      - generic [ref=e622]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e625]:
                      - list [ref=e632]:
                        - listitem [ref=e633]:
                          - mark [ref=e634]:
                            - text: ‌
                            - strong [ref=e635]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e641]:
                          - mark [ref=e642]:
                            - text: ‌
                            - strong [ref=e643]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e644]:
                            - listitem [ref=e645]:
                              - mark [ref=e646]:
                                - text: ‌
                                - strong [ref=e647]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e648]:
                              - mark [ref=e649]:
                                - text: ‌
                                - strong [ref=e650]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e651]:
                              - mark [ref=e652]:
                                - text: ‌
                                - strong [ref=e653]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e659]:
                          - mark [ref=e660]:
                            - text: ‌
                            - strong [ref=e661]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e666] [cursor=pointer]: 百科
                      - link "" [ref=e674] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=M4OrNBcwX6HW34SNT0ckcaVoasttlW5t86jWEqDgayeKZv2GEpkk5i8OPcNp14pKqA-7kTIQU0_osQNivLJJg_
                        - generic [ref=e676]:
                          - generic [ref=e681]: 
                          - text: 
                  - generic [ref=e683]:
                    - generic [ref=e684]:
                      - generic [ref=e686]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e689]:
                      - list [ref=e696]:
                        - listitem [ref=e697]:
                          - mark [ref=e698]:
                            - text: ‌
                            - strong [ref=e699]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e700]:
                            - listitem [ref=e701]:
                              - mark [ref=e702]:
                                - text: ‌
                                - strong [ref=e703]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e704]:
                              - mark [ref=e705]:
                                - text: ‌
                                - strong [ref=e706]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e707]:
                              - mark [ref=e708]:
                                - text: ‌
                                - strong [ref=e709]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e710]:
                          - mark [ref=e711]:
                            - text: ‌
                            - strong [ref=e712]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e713]:
                            - listitem [ref=e714]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e715]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e716]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e717]:
                          - mark [ref=e718]:
                            - text: ‌
                            - strong [ref=e719]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e720]:
                            - listitem [ref=e721]:
                              - mark [ref=e722]:
                                - text: ‌
                                - strong [ref=e723]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e724]:
                              - mark [ref=e725]:
                                - text: ‌
                                - strong [ref=e726]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e727]:
                              - mark [ref=e728]:
                                - text: ‌
                                - strong [ref=e729]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
                      - link "" [ref=e742] [cursor=pointer]:
