                              - mark [ref=e771]:
                                - text: ‌
                                - strong [ref=e772]: 实时双向通信
                                - text: ‌
                              - text: ：赋予 AI 动态获取与发送信息的能力，实现信息的即时互通与流转。
                            - listitem [ref=e773]:
