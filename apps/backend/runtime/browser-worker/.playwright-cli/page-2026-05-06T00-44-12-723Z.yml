                                - text: ‌
                                - strong [ref=e778]: 高可伸缩性
                                - text: ‌
                              - text: ：支持在不干扰现有工作流程的前提下，轻松集成新服务。
                            - listitem [ref=e779]:
                              - mark [ref=e780]:
                                - text: ‌
                                - strong [ref=e781]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
