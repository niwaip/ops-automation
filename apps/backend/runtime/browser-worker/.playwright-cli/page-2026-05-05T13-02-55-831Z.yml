                    - strong [ref=e498]: MCP
                    - text: ‌
                  - text: （Model Context Protocol，模型上下文协议）是由 Anthropic 公司于 2024 年 11 月推出的开源协议，旨在实现大语言模型与外部数据源和工具的无缝集成，被称为 AI 领域的"USB-C 接口”。‌‌‌
                  - generic [ref=e503] [cursor=pointer]: 百科
                  - text: ‌
                - generic [ref=e513]:
                  - generic [ref=e514]:
                    - generic [ref=e515]:
                      - generic [ref=e517]: MCP 的核心定义与目标
                      - text: 
                    - generic [ref=e520]:
                      - list [ref=e527]:
                        - listitem [ref=e528]:
                          - mark [ref=e529]:
                            - text: ‌
                            - strong [ref=e530]: 全称与推出背景
                            - text: ‌
                          - text: ：MCP 全称为 Model Context Protocol（模型上下文协议），由 Anthropic 公司在 2024 年 11 月 25 日正式发布并开源，目标是解决大语言模型如何安全、高效地访问外部数据和工具的问题 。‌‌‌
                          - generic [ref=e535] [cursor=pointer]: 百科
                          - text: ‌
                        - listitem [ref=e541]:
                          - mark [ref=e542]:
                            - text: ‌
                            - strong [ref=e543]: 核心目标
                            - text: ‌
                          - text: ：
                          - list [ref=e544]:
                            - listitem [ref=e545]:
                              - mark [ref=e546]:
                                - text: ‌
                                - strong [ref=e547]: 标准化连接
                                - text: ‌
                              - text: ：通过定义统一的通信协议、数据格式和规则，使不同 AI 模型能以一致方式连接各种数据源和工具，降低碎片化集成成本 。
                            - listitem [ref=e548]:
                              - mark [ref=e549]:
                                - text: ‌
                                - strong [ref=e550]: 安全双向通信
                                - text: ‌
                              - text: ：内置 OAuth 2.1 授权框架和数据传输加密机制，确保数据源所有者掌握访问权，避免数据泄露和滥用 。‌‌
                              - generic [ref=e555] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e561]:
                          - mark [ref=e562]:
                            - text: ‌
                            - strong [ref=e563]: 与 API、CLI 的区别
                            - text: ‌
                          - text: ：MCP 不是替代 API 或 CLI，而是作为 Agent 时代的连接层，更适合生产系统。API 是基础功能，CLI 更适合本地开发者工具，而 MCP 提供远程标准化服务，支持 Web、移动端和云托管 Agent 统一接入 。‌‌‌
                      - link "" [ref=e576] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=PSlCFdTQYqQtBpfLmAgTqQRkxZ2atS32OYJKeX2ORVot_BjcVD6gy8DqB6I8t5JhRNyv2mfLjpi0SnydwqMbma
                        - generic [ref=e578]:
                          - generic [ref=e583]: 
                          - text: 
                  - generic [ref=e585]:
                    - generic [ref=e586]:
                      - generic [ref=e588]: MCP 的架构与工作原理
                      - text: 
                    - generic [ref=e591]:
                      - list [ref=e598]:
                        - listitem [ref=e599]:
                          - mark [ref=e600]:
                            - text: ‌
                            - strong [ref=e601]: 三层架构设计
                            - text: ‌
                          - text: ：MCP 遵循客户端 - 主机 - 服务器（Client-Host-Server）三层架构 ：
                          - list [ref=e602]:
                            - listitem [ref=e603]:
                              - mark [ref=e604]:
                                - text: ‌
                                - strong [ref=e605]: 主机（Host）
                                - text: ‌
                              - text: ：运行 AI 模型或代理的宿主程序，如 Claude 桌面版、Cursor 编辑器、企业自研 AI 应用，负责初始化连接和用户交互 。
                            - listitem [ref=e606]:
                              - mark [ref=e607]:
                                - text: ‌
                                - strong [ref=e608]: 客户端（Client）
                                - text: ‌
                              - text: ：嵌入在主机应用中的协议组件，与服务器保持一对一连接，负责消息路由、能力管理和协议协商 。
                            - listitem [ref=e609]:
                              - mark [ref=e610]:
                                - text: ‌
                                - strong [ref=e611]: 服务器（Server）
                                - text: ‌
                              - text: ：独立运行的轻量程序，封装数据源或服务能力（如本地文件、数据库、第三方 API），通过标准化接口对外提供 。‌‌‌
                        - listitem [ref=e617]:
                          - mark [ref=e618]:
                            - text: ‌
                            - strong [ref=e619]: 通信协议与传输
                            - text: ‌
                          - text: ：
                          - list [ref=e620]:
                            - listitem [ref=e621]: 使用 JSON-RPC 2.0 作为消息格式，支持请求、响应和通知三种基本消息类型 。
                            - listitem [ref=e622]:
                              - text: 支持多种传输方式，包括本地标准输入/输出（Stdio）、HTTP 服务器发送事件（SSE）及 Streamable HTTP 协议（2025 年 3 月版本后替换原 HTTP+SSE）。‌‌
                              - generic [ref=e627] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e633]:
                          - mark [ref=e634]:
                            - text: ‌
                            - strong [ref=e635]: 工作流程
                            - text: ‌
                          - text: ：LLM 应用发送上下文请求→外部资源返回数据→LLM 集成上下文生成响应，过程中动态维护对话历史记录和状态，确保多轮对话连贯性 。‌‌‌
                      - link "" [ref=e648] [cursor=pointer]:
                        - /url: http://www.baidu.com/link?url=PSlCFdTQYqQtBpfLmAgTqQRkxZ2atS32OYJKeX2ORVot_BjcVD6gy8DqB6I8t5JhM7y93t2Lf0skvBXDci8wLK
                        - generic [ref=e650]:
                          - generic [ref=e655]: 
                          - text: 
                  - generic [ref=e657]:
                    - generic [ref=e658]:
                      - generic [ref=e660]: MCP 的应用场景与生态发展
                      - text: 
                    - generic [ref=e663]:
                      - list [ref=e670]:
                        - listitem [ref=e671]:
                          - mark [ref=e672]:
                            - text: ‌
                            - strong [ref=e673]: 行业落地案例
                            - text: ‌
                          - text: ：
                          - list [ref=e674]:
                            - listitem [ref=e675]:
                              - mark [ref=e676]:
                                - text: ‌
                                - strong [ref=e677]: 金融领域
                                - text: ‌
                              - text: ：2025 年 4 月，美国 Fifth Third Bank 推出 MCP 服务器，支持账户管理、资金转账等 19 项银行操作；支付宝推出国内首个支付领域 MCP Server。
                            - listitem [ref=e678]:
                              - mark [ref=e679]:
                                - text: ‌
                                - strong [ref=e680]: 地图服务
                                - text: ‌
                              - text: ：百度地图、高德地图、腾讯位置服务均推出基于 MCP 协议的服务器，提供天气查询、导航定位等接口，百度是国内首家兼容 MCP 协议的地图服务商 。
                            - listitem [ref=e681]:
                              - mark [ref=e682]:
                                - text: ‌
                                - strong [ref=e683]: 企业系统
                                - text: ‌
                              - text: ：Oracle NetSuite 将 MCP 集成到企业资源计划系统，Stripe 集成后开发者可用自然语言调用支付 API。‌‌‌
                              - generic [ref=e688] [cursor=pointer]: 百科
                              - text: ‌
                        - listitem [ref=e694]:
                          - mark [ref=e695]:
                            - text: ‌
                            - strong [ref=e696]: 与 Agent、Skills 的关系
                            - text: ‌
                          - text: ：
                          - list [ref=e697]:
                            - listitem [ref=e698]: MCP 提供“能用什么”（底层连接能力），Skills 提供“怎么做才对”（业务逻辑和流程），Agent 负责整体协调和任务执行，三者构成分层架构而非替代关系 。
                            - listitem [ref=e699]: MCP 是“能力供给层”，Skills 是“行为规范层”，AI Agent 是“执行层”。‌‌‌
