                          - text: 
                  - generic [ref=e675]:
                    - generic [ref=e676]:
                      - generic [ref=e678]: MCP 的技术架构与工作原理
                      - text: 
                    - generic [ref=e681]:
                      - list [ref=e688]:
                        - listitem [ref=e689]:
                          - mark [ref=e690]:
                            - text: ‌
                            - strong [ref=e691]: 客户端 - 服务器架构
                            - text: ‌
                          - text: ：MCP 采用分层设计，包含三个核心模块 ：
                          - list [ref=e692]:
                            - listitem [ref=e693]:
                              - mark [ref=e694]:
                                - text: ‌
                                - strong [ref=e695]: 协议层
                                - text: ‌
                              - text: ：定义标准化的交互接口，包括请求结构（工具标识、输入参数、上下文快照）和响应结构（执行结果、状态码、更新后的上下文）。
                            - listitem [ref=e696]:
                              - mark [ref=e697]:
                                - text: ‌
                                - strong [ref=e698]: 工具适配层
                                - text: ‌
                              - text: ：负责将具体工具的 API 转换为 MCP 协议格式。
                            - listitem [ref=e699]:
                              - mark [ref=e700]:
                                - text: ‌
                                - strong [ref=e701]: 模型集成层
                                - text: ‌
                              - text: ：在模型推理流程中嵌入 MCP 调用节点。
                        - listitem [ref=e702]:
                          - mark [ref=e703]:
                            - text: ‌
                            - strong [ref=e704]: MCP 服务器功能
                            - text: ‌
                          - text: ：MCP 服务器是系统中的资源供应方，负责连接 AI 模型所需的外部能力和数据 ：
                          - list [ref=e705]:
                            - listitem [ref=e706]: 支持远程（URL 和凭据）和本地（命令行调用）服务器配置。
                            - listitem [ref=e707]: 可连接文件访问、存储库管理、PR 创建等功能。
                            - listitem [ref=e708]: 遵循组织管理员在 GitHub 上设置的白名单策略。
                        - listitem [ref=e709]:
                          - mark [ref=e710]:
                            - text: ‌
                            - strong [ref=e711]: 与 Function Calling 的区别
                            - text: ‌
                          - text: ：
                          - list [ref=e712]:
                            - listitem [ref=e713]:
                              - mark [ref=e714]:
                                - text: ‌
                                - strong [ref=e715]: 上下文管理
                                - text: ‌
                              - text: ：MCP 可细粒度控制模型行为，实现多轮对话；Function Calling 缺乏上下文管理能力。
                            - listitem [ref=e716]:
                              - mark [ref=e717]:
                                - text: ‌
                                - strong [ref=e718]: 执行方式
                                - text: ‌
                              - text: ：MCP 支持异步执行，可调用多个任务；Function Calling 为同步调用。
                            - listitem [ref=e719]:
                              - mark [ref=e720]:
                                - text: ‌
                                - strong [ref=e721]: 开发成本
                                - text: ‌
                              - text: ：MCP 有统一标准，适配 MCP 的 Server 可用统一代码调用；Function Calling 需针对每个工具定制开发。‌‌‌
