                                - text: ‌
                                - strong [ref=e773]: 强化安全保障
                                - text: ‌
                              - text: ：采用标准化的安全协议，为所有集成提供全方位防护。‌‌‌
                        - listitem [ref=e779]:
                          - paragraph [ref=e780]:
                            - mark [ref=e781]:
                              - text: ‌
