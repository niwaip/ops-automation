                      - generic [ref=e614]: MCP 的核心概念与定位
                      - text: 
                    - generic [ref=e617]:
                      - list [ref=e624]:
                        - listitem [ref=e625]:
                          - mark [ref=e626]:
                            - text: ‌
                            - strong [ref=e627]: 定义与推出背景
                            - text: ‌
                          - text: ：MCP（Model Context Protocol，模型上下文协议）是由 Anthropic（Claude 的母公司）于 2024 年 11 月底推出的开源协议，旨在统一大模型与外部数据源和工具之间的通信标准 。‌‌‌
                        - listitem [ref=e633]:
                          - mark [ref=e634]:
                            - text: ‌
                            - strong [ref=e635]: 核心定位
                            - text: ‌
                          - text: ：
                          - list [ref=e636]:
                            - listitem [ref=e637]:
                              - mark [ref=e638]:
                                - text: ‌
                                - strong [ref=e639]: 标准化连接
                                - text: ‌
                              - text: ：如同 USB-C 统一了设备连接方式，MCP 统一了 AI 模型接入各种外部能力的方式，避免为每个数据源单独开发定制化连接器。
                            - listitem [ref=e640]:
                              - mark [ref=e641]:
                                - text: ‌
                                - strong [ref=e642]: 安全双向链接
                                - text: ‌
                              - text: ：在大模型和数据源之间建立安全双向的链接，数据源所有者始终掌握访问权。
                            - listitem [ref=e643]:
                              - mark [ref=e644]:
                                - text: ‌
                                - strong [ref=e645]: 打破数据孤岛
                                - text: ‌
                              - text: ：解决 AI 模型因数据孤岛限制而无法充分发挥潜力的难题。‌‌‌
                        - listitem [ref=e651]:
                          - mark [ref=e652]:
                            - text: ‌
                            - strong [ref=e653]: 与多芯片封装 MCP 的区别
                            - text: ‌
                          - text: ：集成电路领域的 MCP（多芯片封装）是通过 2.5D/3D 集成架构将逻辑芯片、存储芯片等异构模块集成于单一封装体的技术，与 AI 领域的模型上下文协议完全不同 。‌‌
                          - generic [ref=e658] [cursor=pointer]: 百科
                      - link "" [ref=e666] [cursor=pointer]:
