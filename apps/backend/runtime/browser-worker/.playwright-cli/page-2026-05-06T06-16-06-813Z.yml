                                - strong [ref=e786]: AI 助手集成
                                - text: ‌
                              - text: ：在 Visual Studio 中，MCP 允许 GitHub Copilot 代理连接 MCP 服务器使用外部工具。
                            - listitem [ref=e787]:
                              - mark [ref=e788]:
                                - text: ‌
                                - strong [ref=e789]: 多工具协同
                                - text: ‌
                              - text: ：允许单一模型同时调用多个工具（如数据库查询 + 文件生成 + 邮件发送）。
                            - listitem [ref=e790]:
                              - mark [ref=e791]:
                                - text: ‌
                                - strong [ref=e792]: 动态上下文管理
                                - text: ‌
                              - text: ：支持在对话过程中动态注入工具调用结果，使模型能基于实时数据调整响应策略。
                            - listitem [ref=e793]:
                              - mark [ref=e794]:
                                - text: ‌
                                - strong [ref=e795]: 自主 Agent 构建
                                - text: ‌
                              - text: ：帮助开发者在大模型之上构建代理和复杂的工作流。‌‌‌
                        - listitem [ref=e801]:
