            - text: MCP（模型上下文协议）一般指模型上下文协议
          - generic [ref=e320]:
            - generic [ref=e321]:
              - text: 模型上下文协议（Model Context Protocol，MCP），是由
              - link "Anthropic" [ref=e323] [cursor=pointer]:
                - /url: /item/Anthropic/62639515?fromModule=lemma_inlink
              - text: 推出的开源协议，旨在实现大语言模型与外部数据源和工具的集成，用来在大模型和数据源之间建立安全双向的连接。该协议通过相同的协议同时处理本地资源（例如数据库、文件、服务等）和远程资源（例如Slack或GitHub等API）
              - superscript [ref=e325] [cursor=pointer]:
                - text: "[1]"
                - emphasis
              - text: 。
            - generic [ref=e326]:
              - text: 模型上下文协议是专为高效获得模型所需上下文信息而设计的通用接口，旨在推动大语言模型应用的标准化和去中心化。作为开放协议，它定义了类似于
              - link "OpenAPI" [ref=e328] [cursor=pointer]:
                - /url: /item/OpenAPI/801962?fromModule=lemma_inlink
              - text: 的标准，包含通用的通信协议、数据格式和规则，具有简化开发、灵活、实时响应、安全合规、可扩展的特点
              - superscript [ref=e330] [cursor=pointer]:
                - text: "[5]"
                - emphasis
              - text: 。该协议采用客户端-服务器架构，支持工具、资源和提示三种功能类型，主机应用可通过标准化接口连接多个服务器获取LLM可理解的上下文数据
              - superscript [ref=e332] [cursor=pointer]:
                - text: "[2]"
                - emphasis
              - superscript [ref=e334] [cursor=pointer]:
                - text: "[11]"
                - emphasis
              - text: 。国内主要科技企业如
              - link "百度地图" [ref=e336] [cursor=pointer]:
                - /url: /item/%E7%99%BE%E5%BA%A6%E5%9C%B0%E5%9B%BE/3702797?fromModule=lemma_inlink
              - text: 、
              - link "高德地图" [ref=e338] [cursor=pointer]:
                - /url: /item/%E9%AB%98%E5%BE%B7%E5%9C%B0%E5%9B%BE/2726788?fromModule=lemma_inlink
              - text: 、
              - link "腾讯位置服务" [ref=e340] [cursor=pointer]:
                - /url: /item/%E8%85%BE%E8%AE%AF%E4%BD%8D%E7%BD%AE%E6%9C%8D%E5%8A%A1/20102302?fromModule=lemma_inlink
              - text: 已推出基于MCP协议的服务器，提供天气查询、导航定位等场景化服务接口
              - superscript [ref=e342] [cursor=pointer]:
                - text: "[6-8]"
                - emphasis
                - emphasis
                - emphasis
              - text: 。
            - generic [ref=e343]:
              - text: Anthropic于2024年底首次提出该协议
              - superscript [ref=e345] [cursor=pointer]:
                - text: "[13]"
                - emphasis
              - text: ，2025年3月
              - link "OpenAI" [ref=e347] [cursor=pointer]:
                - /url: /item/OpenAI/19758408?fromModule=lemma_inlink
              - text: 宣布其Agent SDK支持该协议，ChatGPT桌面应用及
              - link "Responses API" [ref=e349] [cursor=pointer]:
                - /url: /item/Responses%20API/65710963?fromModule=lemma_inlink
              - text: 也将接入
              - superscript [ref=e351] [cursor=pointer]:
                - text: "[3]"
                - emphasis
              - text: 。截至当月，已有超过1000个社区服务器和数千个集成MCP协议的应用投入实际使用
              - superscript [ref=e353] [cursor=pointer]:
                - text: "[4]"
                - emphasis
              - text: 。2025年12月
              - link "Linux基金会" [ref=e355] [cursor=pointer]:
                - /url: /item/Linux%E5%9F%BA%E9%87%91%E4%BC%9A/4514386?fromModule=lemma_inlink
              - text: 成立Agentic AI Foundation（AAIF），MCP被正式移交至该基金会管理
              - superscript [ref=e357] [cursor=pointer]:
                - text: "[12]"
