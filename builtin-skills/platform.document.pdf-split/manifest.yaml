apiVersion: platform.ops/v1alpha1
kind: BuiltinWorkflowSkill
metadata:
  key: platform.document.pdf-split
  displayName: 内置 PDF 拆页
  description: 将 PDF 全量拆页或按 1,3,5-7 页码规格抽取为独立 PDF 产物
  owner: platform-document
  labels:
    category: artifact
    domain: document
    format: pdf
    operation: split
spec:
  definitionVersion: 1.0.0
  lifecycle: stable
  defaultAccess:
    mode: authenticated
  planner:
    enabled: true
    triggerKeywords:
      - PDF拆页
      - 拆分PDF
      - 提取PDF页面
      - PDF抽页
      - split pdf
    matchSummary: 将 PDF 拆成独立页面，或按页码范围抽取多个单页 PDF
    runtimeType: artifact
    supportsArtifact: true
  contracts:
    input:
      schemaRef: inline
      schema:
        type: object
        additionalProperties: false
        required: [fileBase64]
        properties:
          fileBase64:
            type: string
            contentEncoding: base64
            minLength: 8
            maxLength: 13981020
          fileName:
            type: string
            maxLength: 255
          pages:
            type: string
            description: 要拆分的页码范围组合（用逗号分隔，如 "1-5,6-11" 为两部分，或 "1,3,5-7"），留空则默认按单页全量拆分
            maxLength: 240
            pattern: "^[0-9, -]+$"
          fileNamePrefix:
            type: string
            maxLength: 100
    output:
      schemaRef: inline
      schema:
        type: object
        additionalProperties: false
        x-primary-output: artifact
        required: [operation, artifact, artifacts, pageCount, selectedPages]
        properties:
          operation: { type: string, const: split }
          artifact:
            type: object
            x-value-type: artifact_ref
            required: [type, name, url, mimeType, metadata]
            properties:
              type: { type: string }
              id: { type: string }
              name: { type: string }
              url: { type: string }
              mimeType: { type: string, const: application/pdf }
              sizeBytes: { type: number }
              metadata: { type: object }
          artifacts:
            type: array
            minItems: 1
            maxItems: 50
          pageCount: { type: integer, minimum: 1, maximum: 50 }
          selectedPages:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: integer, minimum: 1 }
  workflow:
    engine: domain-handler
    definitionRef: workflow.json
  runtime:
    adapterRoute: builtin:workflow
    handlerKey: document.pdf.split
    idempotency: required
    timeoutSeconds: 30
    retryPolicy:
      maximumAttempts: 2
  migration:
    minimumPlatformVersion: 4.0.0
    contractCompatibility: backward
  smokeTest:
    inputRef: fixtures/smoke-input.json
    assertions:
      - output.operation equals split
      - output.pageCount equals 2
      - output.artifacts length equals 2
      - output.artifact.metadata.sha256 exists
