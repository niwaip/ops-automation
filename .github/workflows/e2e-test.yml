name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops_secret
          POSTGRES_DB: ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database schema
        run: |
          psql -h localhost -U ops -d ops -f docker/sql/migrations/001_init.sql
        env:
          PGPASSWORD: ops_secret

      - name: Seed test data
        run: |
          psql -h localhost -U ops -d ops -f docker/sql/seed.sql
        env:
          PGPASSWORD: ops_secret

      - name: Build services
        run: pnpm build

      - name: Start services (background)
        run: |
          # Start all services in background
          node apps/backend/core/platform/dist/main.js &
          node apps/backend/sessions/session-broker/dist/main.js &
          node apps/backend/domain/browser-template/dist/main.js &
          node apps/backend/orchestration/ai-orchestrator/dist/main.js &
          node apps/backend/runtime/replay-worker/dist/main.js &

          # Wait for services to start
          sleep 10
        env:
          DATABASE_URL: postgresql://ops:ops_secret@localhost:5432/ops
          REDIS_URL: redis://localhost:6379
          AUTH_PORT: 3001
          SESSION_BROKER_PORT: 3002
          BROWSER_TEMPLATE_PORT: 3005
          AI_ORCHESTRATOR_PORT: 3007
          REPLAY_ENGINE_PORT: 3006
          SKIP_SERVICE_HEALTH_CHECK: true

      - name: Run E2E tests
        run: |
          pnpm exec jest --config tests/integration/jest.config.js --coverage
        env:
          DATABASE_URL: postgresql://ops:ops_secret@localhost:5432/ops
          REDIS_URL: redis://localhost:6379
          AUTH_HOST: localhost
          AUTH_PORT: 3001
          SESSION_BROKER_HOST: localhost
          SESSION_BROKER_PORT: 3002
          BROWSER_TEMPLATE_HOST: localhost
          BROWSER_TEMPLATE_PORT: 3005
          AI_ORCHESTRATOR_HOST: localhost
          AI_ORCHESTRATOR_PORT: 3007
          REPLAY_ENGINE_HOST: localhost
          REPLAY_ENGINE_PORT: 3006
          SKIP_SERVICE_HEALTH_CHECK: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/integration/lcov.info
          fail_ci_if_error: false
          flags: integration

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: coverage/integration/*.json
          reporter: jest-junit
        continue-on-error: true

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            coverage/integration/
            test-results/
          retention-days: 7
