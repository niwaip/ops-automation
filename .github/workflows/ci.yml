name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint || exit 0
        continue-on-error: true

      - name: Check formatting
        run: pnpm format:check || exit 0
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck || exit 0
        continue-on-error: true

      - name: Validate user-core boundaries
        run: pnpm validate:user-core || exit 0
        continue-on-error: true

      - name: Build
        run: pnpm build || exit 0
        continue-on-error: true

  docker-lint:
    name: Docker Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate infrastructure compose
        run: |
          ./docker/start-smart.sh docker-compose.yml config --quiet

      - name: Validate add-in compose
        run: |
          ./docker/start-smart.sh docker-compose.addin.yml config --quiet

      - name: Validate base compose
        run: |
          ./docker/start-smart.sh docker-compose.base.yml config --quiet

      - name: Validate V4 core compose
        run: |
          ./docker/start-smart.sh docker-compose.core.yml config --quiet

      - name: Validate V4 planner compose
        run: |
          ./docker/start-smart.sh docker-compose.planner.yml config --quiet

      - name: Validate V4 runtime compose
        run: |
          ./docker/start-smart.sh docker-compose.runtime.yml config --quiet

      - name: Validate V4 experience compose
        run: |
          ./docker/start-smart.sh docker-compose.experience.yml config --quiet

      - name: Validate V4 full compose
        run: |
          ./docker/start-smart.sh docker-compose.full.yml config --quiet

      - name: Run V4 layering audit
        run: |
          bash ./docker/scripts/v4/validate-layering.sh

      - name: Run V4 full alignment audit
        run: |
          bash ./docker/scripts/v4/validate-full-alignment.sh

      - name: Check V4 shell entrypoints
        run: |
          bash -n ./docker/scripts/smoke/addin-smoke.sh
          bash -n ./docker/scripts/smoke/core-smoke.sh
          bash -n ./docker/scripts/smoke/planner-smoke.sh
          bash -n ./docker/scripts/smoke/runtime-smoke.sh
          bash -n ./docker/scripts/smoke/full-smoke.sh
          bash -n ./docker/scripts/v4/v4-acceptance.sh
