version: '3.8'

# Full development environment with all services
# Usage: docker compose up -d
# Set EXTERNAL_HOST to your machine's IP for external access (e.g., EXTERNAL_HOST=192.168.100.143)

x-common-env: &common-env
  EXTERNAL_HOST: ${EXTERNAL_HOST:-localhost}

services:
  # ============================================
  # Infrastructure Services
  # ============================================
  postgres:
    image: docker.1ms.run/library/postgres:15-alpine
    container_name: ops-postgres
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops_secret
      POSTGRES_DB: ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.1ms.run/library/redis:7-alpine
    container_name: ops-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend Services (with code mount for hot reload)
  # ============================================
  auth:
    image: docker.1ms.run/library/node:20-bullseye
    container_name: ops-auth
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npx prisma generate && npm run dev"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - DATABASE_URL=postgresql://ops:ops_secret@postgres:5432/ops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=jwt_secret_key_change_in_production
      - PORT=3001
      - EXTERNAL_HOST=${EXTERNAL_HOST:-localhost}
    ports:
      - "3001:3001"
    volumes:
      - ../services/auth:/app
      - auth_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  session-broker:
    image: docker.1ms.run/library/node:20-bullseye
    container_name: ops-session-broker
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && rm -f tsconfig.tsbuildinfo && npx tsc && node dist/main.js"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://ops:ops_secret@postgres:5432/ops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3002
    ports:
      - "3002:3002"
    volumes:
      - ../services/session-broker:/app
      - session_broker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  control-plane:
    image: docker.1ms.run/library/node:20-bullseye
    container_name: ops-control-plane
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://ops:ops_secret@postgres:5432/ops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=jwt_secret_key_change_in_production
      - PORT=3003
    ports:
      - "3003:3003"
    volumes:
      - ../services/control-plane:/app
      - control_plane_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-worker:
    image: docker.1ms.run/library/node:20-bullseye
    container_name: ops-browser-worker
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - CHROME_REMOTE_DEBUGGING_HOST=browser-chrome
      - CHROME_REMOTE_DEBUGGING_PORT=9222
      - CODEGEN_API_PORT=3011
    ports:
      - "3004:3004"
    volumes:
      - ../services/browser-worker:/app
      - browser_worker_node_modules:/app/node_modules
    depends_on:
      - browser-chrome

  template:
    image: docker.1ms.run/library/node:20-bullseye
    container_name: ops-template
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://ops:ops_secret@postgres:5432/ops
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=ops
      - DB_PASSWORD=ops_secret
      - DB_DATABASE=ops
      - PORT=3005
    ports:
      - "3005:3005"
    volumes:
      - ../services/template:/app
      - template_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  replay-engine:
    image: docker.1ms.run/library/node:20-bullseye
    container_name: ops-replay-engine
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://ops:ops_secret@postgres:5432/ops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3006
    ports:
      - "3006:3006"
    volumes:
      - ../services/replay-engine:/app
      - replay_engine_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-orchestrator:
    image: docker.1ms.run/library/node:20-bullseye
    container_name: ops-ai-orchestrator
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - AUTH_SERVICE_URL=http://ops-auth:3001
      - CARBONE_SERVICE_URL=http://carbone-engine:3009
      - CARBONE_EXTERNAL_URL=http://${EXTERNAL_HOST:-localhost}:3009
      - DATABASE_URL=postgresql://ops:ops_secret@postgres:5432/ops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3007
      # AI Model API Keys - Set these in your environment or .env file
      # Alibaba Cloud Coding (阿里云 DashScope Coding)
      - ALIBABA_CODING_API_KEY=${ALIBABA_CODING_API_KEY:-}
      # Alibaba Cloud Bailian (阿里云百炼)
      - ALIBABA_BAILIAN_API_KEY=${ALIBABA_BAILIAN_API_KEY:-}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # DeepSeek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    ports:
      - "3007:3007"
    volumes:
      - ../services/ai-orchestrator:/app
      - ai_orchestrator_node_modules:/app/node_modules
      - ai_orchestrator_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  report:
    image: docker.1ms.run/library/node:20-bullseye
    container_name: ops-report
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://ops:ops_secret@postgres:5432/ops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3008
      - AI_ORCHESTRATOR_URL=http://ai-orchestrator:3007
      - SESSION_BROKER_URL=http://session-broker:3002
      - FILES_DIR=/app/files
    ports:
      - "3008:3008"
    volumes:
      - ../services/report:/app
      - report_node_modules:/app/node_modules
      - report_files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-orchestrator:
        condition: service_started
      session-broker:
        condition: service_started

  # ============================================
  # Frontend Service
  # ============================================
  portal:
    image: docker.1ms.run/library/node:20-bullseye
    container_name: ops-portal
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - VITE_API_BASE_URL=/api
      - VITE_RECORDER_WS_URL=ws://localhost:3004
    ports:
      - "5173:5173"
    volumes:
      - ../services/portal:/app
      - portal_node_modules:/app/node_modules
    depends_on:
      - auth
      - browser-worker
      - template

  # ============================================
  # Browser Worker (Chrome + noVNC + Codegen)
  # ============================================
  browser-chrome:
    build:
      context: .
      dockerfile: browser-worker.Dockerfile
    container_name: ops-browser-chrome
    ports:
      - "6080:8080"  # noVNC
      - "9222:9222"  # CDP
      - "5901:5900"  # VNC
      - "3011:3011"  # Codegen API
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - CODEGEN_API_PORT=3011
    command: ["/start-recorder.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/vnc.html >/dev/null && curl -fsS http://localhost:3011/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Temporal Server & UI
  # ============================================
  temporal:
    image: docker.1ms.run/library/temporalio/auto-setup:1.22.0
    container_name: ops-temporal
    ports:
      - "7233:7233"   # Frontend gRPC
      - "7234:7234"   # History gRPC
      - "7235:7235"   # Matching gRPC
      - "7236:7236"   # Worker gRPC
    environment:
      - DB=postgresql
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=ops
      - POSTGRES_PASSWORD=ops_secret
      - POSTGRES_DB=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic_config.yaml
    volumes:
      - temporal_data:/var/lib/postgresql/data
      - ./dynamic_config.yaml:/etc/temporal/dynamic_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  temporal-ui:
    image: docker.1ms.run/library/temporalio/ui:2.20.0
    container_name: ops-temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088,http://localhost:5173
    depends_on:
      - temporal
    networks:
      - default

  # ============================================
  # Temporal Sandbox Agent (Python)
  # Long-lived agent that executes code in sandbox
  # ============================================
  temporal-sandbox-agent:
    build:
      context: .
      dockerfile: temporal-sandbox-agent.Dockerfile
    container_name: ops-temporal-sandbox-agent
    working_dir: /app
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - AUTH_SERVICE_URL=http://ops-auth:3001
      - SANDBOX_TASK_QUEUE=sandbox-agent-task-queue
      - SANDBOX_HTTP_PORT=8090
    ports:
      - "8090:8090"
    volumes:
      - ../services/temporal-sandbox-agent:/app
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker sandbox backend
    depends_on:
      - temporal
    networks:
      - default

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  auth_node_modules:
  session_broker_node_modules:
  control_plane_node_modules:
  browser_worker_node_modules:
  template_node_modules:
  replay_engine_node_modules:
  ai_orchestrator_node_modules:
  ai_orchestrator_data:
  portal_node_modules:
  report_node_modules:
  report_files:
  temporal_data:

networks:
  default:
    name: ops-network
    external: true
