version: '3.8'

services:
  # 官方 Carbone 服务 (Community Edition)
  carbone-community:
    build:
      context: .
      dockerfile: Dockerfile.community
    container_name: carbone-community
    ports:
      - "3100:3100"
    volumes:
      - ./templates:/app/templates
    environment:
      - CARBONE_API_PORT=3100
      - NODE_ENV=production
    restart: unless-stopped

  # 官方 Carbone Enterprise Edition (可选)
