[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_DISPLAY_WIDTH)x%(ENV_DISPLAY_HEIGHT)x24
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb-error.log

[program:fluxbox]
command=/usr/bin/fluxbox -display :0
environment=HOME="/home/chrome",USER="chrome"
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox-error.log
user=chrome

[program:vnc]
command=/usr/bin/x11vnc -display :0 -forever -shared -rfbport %(ENV_VNC_PORT) -passwd %(ENV_VNC_PASSWORD) -nobell -cursor_name arrow
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc-error.log

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc/www %(ENV_NOVNC_PORT) localhost:%(ENV_VNC_PORT)
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc-error.log

[program:chromium]
command=/usr/bin/chromium-browser %(ENV_CHROME_ARGS)
environment=HOME="/home/chrome",USER="chrome",DISPLAY=":0"
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium-error.log
user=chrome