# Legacy infra-only development override
# 仅保留给需要单独调试 infra 变体的场景。
# 日常开发请优先使用 ./docker/start-smart.sh dev up -d

services:
  postgres:
    container_name: ops-postgres-dev
    environment:
      POSTGRES_USER: ops_dev
      POSTGRES_PASSWORD: ops_dev_secret
      POSTGRES_DB: ops_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      # Mount for local development - allows SQL file execution
      - ${PROJECT_ROOT:-..}/docker/sql/migrations:/migrations:ro

  redis:
    container_name: ops-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
