# Full development environment with all services
# Usage: docker compose up -d
# Set HOST_IP to your machine's IP for external access (e.g., HOST_IP=192.168.100.143)

x-common-env: &common-env
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  EXTERNAL_HOST: ${HOST_IP:-localhost}

services:
  # ============================================
  # Infrastructure Services
  # ============================================
  postgres:
    image: ${DOCKER_REGISTRY:-}postgres:15-alpine
    container_name: ops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops} -d ${POSTGRES_DB:-ops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    container_name: ops-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend Services (with code mount for hot reload)
  # ============================================
  auth:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-auth
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npx prisma generate && npm run dev"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=jwt_secret_key_change_in_production
      - PORT=${AUTH_PORT:-3001}
      - EXTERNAL_HOST=${HOST_IP:-localhost}
    ports:
      - "${AUTH_PORT:-3001}:${AUTH_PORT:-3001}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/core/auth:/app
      - auth_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  session-broker:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-session-broker
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && rm -f tsconfig.tsbuildinfo && npx tsc && node dist/main.js"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - PORT=${SESSION_BROKER_PORT:-3002}
    ports:
      - "${SESSION_BROKER_PORT:-3002}:${SESSION_BROKER_PORT:-3002}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/runtime/session-broker:/app
      - session_broker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  control-plane:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-control-plane
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npx prisma generate && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=jwt_secret_key_change_in_production
      - INTERNAL_API_SHARED_SECRET=${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      - PORT=${CONTROL_PLANE_PORT:-3003}
      - AI_ORCHESTRATOR_URL=http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      - SESSION_BROKER_URL=http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
    ports:
      - "${CONTROL_PLANE_PORT:-3003}:${CONTROL_PLANE_PORT:-3003}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/core/control-plane:/app
      - ${PROJECT_ROOT:-..}/packages/contracts:/packages/contracts
      - control_plane_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-worker:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-browser-worker
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - PORT=${BROWSER_WORKER_PORT:-3004}
      - CHROME_REMOTE_DEBUGGING_HOST=browser-chrome
      - CHROME_REMOTE_DEBUGGING_PORT=${CDP_PORT:-9222}
      - CODEGEN_API_PORT=${CODEGEN_API_PORT:-3011}
    ports:
      - "${BROWSER_WORKER_PORT:-3004}:${BROWSER_WORKER_PORT:-3004}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/runtime/browser-worker:/app
      - browser_worker_node_modules:/app/node_modules
    depends_on:
      - browser-chrome

  carbone-engine:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: carbone-engine
    working_dir: /app
    command: >
      sh -c "apt-get update || true && apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress curl || echo 'LibreOffice install skipped; template listing APIs can still run without it' && apt-get clean && rm -rf /var/lib/apt/lists/* && npm config set registry https://registry.npmmirror.com && npm install --include=dev && npm run build && npm run start"
    environment:
      - NODE_ENV=production
      - PORT=${CARBONE_ENGINE_PORT:-3009}
      - TEMPLATES_DIR=/app/templates
      - OUTPUTS_DIR=/app/outputs
      - LIBREOFFICE_PATH=/usr/bin/soffice
      - TMP_DIR=/tmp/carbone-preview
      - AI_ORCHESTRATOR_URL=http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
    ports:
      - "${CARBONE_ENGINE_PORT:-3009}:${CARBONE_ENGINE_PORT:-3009}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/runtime/carbone-engine:/app
      - carbone_engine_node_modules:/app/node_modules
      - carbone_templates:/app/templates
      - carbone_outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CARBONE_ENGINE_PORT:-3009}/api"]
      interval: 30s
      timeout: 10s
      retries: 3

  template:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-template
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-ops}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-ops_secret}
      - DB_DATABASE=${POSTGRES_DB:-ops}
      - PORT=${TEMPLATE_PORT:-3005}
    ports:
      - "${TEMPLATE_PORT:-3005}:${TEMPLATE_PORT:-3005}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/domain/template:/app
      - template_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  replay-engine:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-replay-engine
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=${REPLAY_ENGINE_PORT:-3006}
    ports:
      - "${REPLAY_ENGINE_PORT:-3006}:${REPLAY_ENGINE_PORT:-3006}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/domain/replay-engine:/app
      - replay_engine_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-orchestrator:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-ai-orchestrator
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - INTERNAL_API_SHARED_SECRET=${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      - AUTH_SERVICE_URL=http://${AUTH_SERVICE_HOST:-auth}:${AUTH_PORT:-3001}
      - BROWSER_WORKER_URL=http://${BROWSER_WORKER_HOST:-browser-worker}:${BROWSER_WORKER_PORT:-3004}
      - CONTROL_PLANE_URL=http://${CONTROL_PLANE_HOST:-control-plane}:${CONTROL_PLANE_PORT:-3003}
      - CARBONE_SERVICE_URL=http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      - CARBONE_EXTERNAL_URL=http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=${AI_ORCHESTRATOR_PORT:-3007}
      # AI Model API Keys - Set these in your environment or .env file
      # Alibaba Cloud Coding (阿里云 DashScope Coding)
      - ALIBABA_CODING_API_KEY=${ALIBABA_CODING_API_KEY:-}
      # Alibaba Cloud Bailian (阿里云百炼)
      - ALIBABA_BAILIAN_API_KEY=${ALIBABA_BAILIAN_API_KEY:-}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # DeepSeek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    ports:
      - "${AI_ORCHESTRATOR_PORT:-3007}:${AI_ORCHESTRATOR_PORT:-3007}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/core/ai-orchestrator:/app
      - ${PROJECT_ROOT:-..}/packages/contracts:/packages/contracts
      - ai_orchestrator_node_modules:/app/node_modules
      - ai_orchestrator_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  report:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-report
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=${REPORT_PORT:-3008}
      - AI_ORCHESTRATOR_URL=http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      - SESSION_BROKER_URL=http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
      - FILES_DIR=/app/files
    ports:
      - "${REPORT_PORT:-3008}:${REPORT_PORT:-3008}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/domain/report:/app
      - report_node_modules:/app/node_modules
      - report_files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-orchestrator:
        condition: service_started
      session-broker:
        condition: service_started

  # ============================================
  # Frontend Service
  # ============================================
  portal:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-portal
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - VITE_API_BASE_URL=/api
      - VITE_CONTROL_PLANE_API_URL=http://${HOST_IP:-localhost}:${CONTROL_PLANE_PORT:-3003}/api
      - VITE_HOST_IP=${HOST_IP:-localhost}
      - VITE_RECORDER_WS_URL=ws://${HOST_IP:-localhost}:${BROWSER_WORKER_PORT:-3004}
      - VITE_CARBONE_API_URL=http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
      - VITE_NOVNC_URL=http://${HOST_IP:-localhost}:${NOVNC_PORT:-6080}/vnc.html
    ports:
      - "${PORTAL_PORT:-5173}:${PORTAL_PORT:-5173}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/frontend/portal:/app
      - ${PROJECT_ROOT:-..}/packages/contracts:/packages/contracts
      - portal_node_modules:/app/node_modules
    depends_on:
      - auth
      - browser-worker
      - template

  # ============================================
  # Browser Worker (Chrome + noVNC + Codegen)
  # ============================================
  browser-chrome:
    build:
      context: .
      dockerfile: browser-worker.Dockerfile
    container_name: ops-browser-chrome
    ports:
      - "${NOVNC_PORT:-6080}:8080"  # noVNC
      - "${CDP_PORT:-9222}:9222"  # CDP
      - "${VNC_PORT:-5901}:5900"  # VNC
      - "${CODEGEN_API_PORT:-3011}:${CODEGEN_API_PORT:-3011}"  # Codegen API
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - CODEGEN_API_PORT=${CODEGEN_API_PORT:-3011}
    command: ["/start-recorder.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/vnc.html >/dev/null && curl -fsS http://localhost:${CODEGEN_API_PORT:-3011}/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Temporal Server & UI
  # ============================================
  temporal:
    image: docker.1ms.run/library/temporalio/auto-setup:1.22.0
    container_name: ops-temporal
    ports:
      - "7233:7233"   # Frontend gRPC
      - "7234:7234"   # History gRPC
      - "7235:7235"   # Matching gRPC
      - "7236:7236"   # Worker gRPC
    environment:
      - DB=postgresql
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-ops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ops_secret}
      - POSTGRES_DB=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic_config.yaml
    volumes:
      - temporal_data:/var/lib/postgresql/data
      - ./dynamic_config.yaml:/etc/temporal/dynamic_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  temporal-ui:
    image: docker.1ms.run/library/temporalio/ui:2.20.0
    container_name: ops-temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://${HOST_IP:-localhost}:8088,http://${HOST_IP:-localhost}:${PORTAL_PORT:-5173}
    depends_on:
      - temporal
    networks:
      - default

  # ============================================
  # Temporal Sandbox Agent (Python)
  # Long-lived agent that executes code in sandbox
  # ============================================
  temporal-sandbox-agent:
    build:
      context: .
      dockerfile: temporal-sandbox-agent.Dockerfile
    container_name: ops-temporal-sandbox-agent
    working_dir: /app
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - AUTH_SERVICE_URL=http://${AUTH_SERVICE_HOST:-auth}:${AUTH_PORT:-3001}
      - SANDBOX_TASK_QUEUE=sandbox-agent-task-queue
      - ACTIVITY_VALIDATION_TASK_QUEUE=activity-validation-task-queue
      - SANDBOX_HTTP_PORT=8090
      - CARBONE_SERVICE_URL=http://carbone-engine:3009
      - CARBONE_EXTERNAL_URL=http://${HOST_IP:-localhost}:3009
    ports:
      - "8090:8090"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/temporal-sandbox-agent:/app
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker sandbox backend
    depends_on:
      - temporal
    networks:
      - default

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  auth_node_modules:
  session_broker_node_modules:
  control_plane_node_modules:
  browser_worker_node_modules:
  carbone_engine_node_modules:
  template_node_modules:
  replay_engine_node_modules:
  ai_orchestrator_node_modules:
  ai_orchestrator_data:
  portal_node_modules:
  report_node_modules:
  report_files:
  carbone_templates:
  carbone_outputs:
  temporal_data:

networks:
  default:
    external: true
    name: ${NETWORK_NAME:-ops-network}
