# Legacy full-stack compose
# 保留为兼容入口；日常开发请优先使用 ./docker/start-smart.sh dev up -d
# Optional services such as `report` require explicit profiles
# Explicit legacy usage: ./docker/start-smart.sh docker-compose.full.yml up -d
# Set HOST_IP to your machine's IP for external access (e.g., HOST_IP=192.168.100.143)

x-common-env: &common-env
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  EXTERNAL_HOST: ${HOST_IP:-localhost}

services:
  # ============================================
  # Workspace Dependencies Init (must complete before other services)
  # ============================================
  workspace-deps-init:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-workspace-init
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && bash /workspace/docker/scripts/apply-latest-db-schema-in-container.sh"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ops-network

  # ============================================
  # Infrastructure Services
  # ============================================
  postgres:
    image: ${DOCKER_REGISTRY:-}postgres:15-alpine
    container_name: ops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops} -d ${POSTGRES_DB:-ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ops-network

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    container_name: ops-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ops-network

  # ============================================
  # Backend Services (with code mount for hot reload)
  # ============================================
  platform:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-platform
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && cd /workspace/apps/backend/core/platform
      && pnpm run build
      && rm -rf /workspace/apps/backend/core/platform/dist/generated
      && mkdir -p /workspace/apps/backend/core/platform/dist/generated
      && cp -R /workspace/apps/backend/core/platform/src/generated/prisma /workspace/apps/backend/core/platform/dist/generated/prisma
      && pnpm run start"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      - INTERNAL_API_SHARED_SECRET=${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      - PORT=${PLATFORM_PORT:-3001}
      - EXTERNAL_HOST=${HOST_IP:-localhost}
    ports:
      - "${PLATFORM_PORT:-3001}:${PLATFORM_PORT:-3001}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-network

  session-broker:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-session-broker
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && cd /workspace/apps/backend/execution-control/session-broker
      && pnpm run build
      && rm -rf dist/generated
      && mkdir -p dist/generated
      && cp -R src/generated/prisma dist/generated/prisma
      && pnpm run start"

    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - PORT=${SESSION_BROKER_PORT:-3002}
    ports:
      - "${SESSION_BROKER_PORT:-3002}:${SESSION_BROKER_PORT:-3002}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-network

  control-plane:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-control-plane
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && cd /workspace/apps/backend/execution-control/control-plane
      && pnpm run build
      && rm -rf dist/apps/backend/execution-control/control-plane/src/generated
      && mkdir -p dist/apps/backend/execution-control/control-plane/src/generated
      && cp -R src/generated/prisma dist/apps/backend/execution-control/control-plane/src/generated/prisma
      && pnpm run start"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROWSER_LOOP_WORKFLOW_ENABLED=${BROWSER_LOOP_WORKFLOW_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      - INTERNAL_API_SHARED_SECRET=${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      - PORT=${CONTROL_PLANE_PORT:-3003}
      - AUTH_SERVICE_URL=http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      - AI_ORCHESTRATOR_URL=http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      - LLM_OPERATION_TIMEOUT_MS=${LLM_OPERATION_TIMEOUT_MS:-180000}
      - SESSION_BROKER_URL=http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
    ports:
      - "${CONTROL_PLANE_PORT:-3003}:${CONTROL_PLANE_PORT:-3003}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-network

  browser-worker:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-browser-worker
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && cd /workspace/apps/backend/runtimes/browser-worker
      && pnpm exec nest start --watch"
    environment:
      - NODE_ENV=development
      - PORT=${BROWSER_WORKER_PORT:-3004}
      - CHROME_REMOTE_DEBUGGING_HOST=browser-chrome
      - CHROME_REMOTE_DEBUGGING_PORT=${CDP_PORT:-9222}
      - CODEGEN_API_PORT=${CODEGEN_API_PORT:-3011}
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - SESSION_BROWSER_IMAGE=${SESSION_BROWSER_IMAGE:-ops-browser-chrome:local}
      - NETWORK_NAME=${NETWORK_NAME:-ops-network}
      - EXTERNAL_HOST=${HOST_IP:-localhost}
    ports:
      - "${BROWSER_WORKER_PORT:-3004}:${BROWSER_WORKER_PORT:-3004}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      browser-chrome:
        condition: service_started
    networks:
      - ops-network

  carbone-engine:
    build:
      context: ../..
      dockerfile: docker/carbone-engine/Dockerfile
    container_name: carbone-engine
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && cd /workspace/apps/backend/capabilities/document-domain
      && pnpm run build
      && pnpm run start:prod"
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - PORT=${CARBONE_ENGINE_PORT:-3009}
      - TEMPLATES_DIR=/workspace/apps/backend/var/templates/document-engine
      - OUTPUTS_DIR=/workspace/apps/backend/var/outputs/document-engine
      - STORAGE_RENDER_DIR=/workspace/apps/backend/var/outputs/document-engine/renders
      - LIBREOFFICE_PATH=/usr/bin/soffice
      - TMP_DIR=/tmp/carbone-preview
      - AI_ORCHESTRATOR_URL=http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
    ports:
      - "${CARBONE_ENGINE_PORT:-3009}:${CARBONE_ENGINE_PORT:-3009}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
      - ${PROJECT_ROOT:-..}/apps/backend/var/templates/document-engine:/workspace/apps/backend/var/templates/document-engine
      - ${PROJECT_ROOT:-..}/apps/backend/var/outputs/document-engine:/workspace/apps/backend/var/outputs/document-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CARBONE_ENGINE_PORT:-3009}/api"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
    networks:
      - ops-network

  browser-template:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-browser-template
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && pnpm --filter @ops/browser-template exec prisma db push
      && pnpm --filter @ops/browser-template run build
      && pnpm --filter @ops/browser-template run start"

    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=browser_templates
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-ops}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-ops_secret}
      - DB_DATABASE=${POSTGRES_DB:-ops}
      - PORT=${BROWSER_TEMPLATE_PORT:-3005}
    ports:
      - "${BROWSER_TEMPLATE_PORT:-3005}:${BROWSER_TEMPLATE_PORT:-3005}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - ops-network

  browser-semantics:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-browser-semantics
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && pnpm --filter @ops/browser-semantics run build
      && pnpm --filter @ops/browser-semantics run start"

    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=browser_semantics
      - PORT=${BROWSER_SEMANTICS_PORT:-3006}
      - BROWSER_SEMANTICS_AUTO_SEED=${BROWSER_SEMANTICS_AUTO_SEED:-true}
      - BROWSER_SEMANTICS_RUN_DEFAULT_SEED=${BROWSER_SEMANTICS_RUN_DEFAULT_SEED:-false}
    ports:
      - "${BROWSER_SEMANTICS_PORT:-3006}:${BROWSER_SEMANTICS_PORT:-3006}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - ops-network

  ai-orchestrator:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-ai-orchestrator
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && pnpm --filter @ops/ai-orchestrator exec prisma generate
      && pnpm --filter @ops/ai-orchestrator run dev"

    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - INTERNAL_API_SHARED_SECRET=${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      - AUTH_SERVICE_URL=http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      - BROWSER_WORKER_URL=http://${BROWSER_WORKER_HOST:-browser-worker}:${BROWSER_WORKER_PORT:-3004}
      - CONTROL_PLANE_URL=http://${CONTROL_PLANE_HOST:-control-plane}:${CONTROL_PLANE_PORT:-3003}
      - CARBONE_SERVICE_URL=http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      - CARBONE_EXTERNAL_URL=http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=${AI_ORCHESTRATOR_PORT:-3007}
      # AI Model API Keys - Set these in your environment or .env file
      # Alibaba Cloud Coding (阿里云 DashScope Coding)
      - ALIBABA_CODING_API_KEY=${ALIBABA_CODING_API_KEY:-}
      # Alibaba Cloud Bailian (阿里云百炼)
      - ALIBABA_BAILIAN_API_KEY=${ALIBABA_BAILIAN_API_KEY:-}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # DeepSeek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DOCUMENT_SEMANTIC_SUBAGENT_ENABLED=${DOCUMENT_SEMANTIC_SUBAGENT_ENABLED:-true}
      - DOCUMENT_SEMANTIC_PARAM_THRESHOLD=${DOCUMENT_SEMANTIC_PARAM_THRESHOLD:-8}
      - DOCUMENT_SEMANTIC_MISSING_THRESHOLD=${DOCUMENT_SEMANTIC_MISSING_THRESHOLD:-4}
      - DOCUMENT_SEMANTIC_ARRAY_GROUP_THRESHOLD=${DOCUMENT_SEMANTIC_ARRAY_GROUP_THRESHOLD:-2}
    ports:
      - "${AI_ORCHESTRATOR_PORT:-3007}:${AI_ORCHESTRATOR_PORT:-3007}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
      - ${PROJECT_ROOT:-..}/apps/backend/var/cache/ai-orchestrator:/workspace/apps/backend/var/cache/ai-orchestrator
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser-semantics:
        condition: service_started
    networks:
      - ops-network

  report:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-report
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && cd /workspace/apps/backend/capabilities/document-domain/report
      && pnpm exec prisma db push
      && pnpm run build
      && rm -rf dist/generated
      && mkdir -p dist/generated
      && cp -R generated/prisma dist/generated/prisma
      && pnpm run start"

    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=reports
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - PORT=${REPORT_PORT:-3008}
      - AI_ORCHESTRATOR_URL=http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      - SESSION_BROKER_URL=http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
      - FILES_DIR=/app/files
    ports:
      - "${REPORT_PORT:-3008}:${REPORT_PORT:-3008}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
      - report_files:/workspace/apps/backend/capabilities/document-domain/report/files
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-orchestrator:
        condition: service_started
      session-broker:
        condition: service_started
    networks:
      - ops-network

  # ============================================
  # Frontend Service
  # ============================================
  portal:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-portal
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && pnpm --filter @ops/portal run dev"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - AUTH_SERVICE_HOST=platform
      - PLATFORM_HOST=platform
      - CONTROL_PLANE_HOST=control-plane
      - SESSION_BROKER_HOST=session-broker
      - BROWSER_TEMPLATE_HOST=browser-template
      - BROWSER_WORKER_HOST=browser-worker
      - AI_ORCHESTRATOR_HOST=ai-orchestrator
      - CARBONE_ENGINE_HOST=carbone-engine
      - VITE_API_BASE_URL=/api
      - VITE_CONTROL_PLANE_API_URL=http://${HOST_IP:-localhost}:${CONTROL_PLANE_PORT:-3003}/api
      - VITE_HOST_IP=${HOST_IP:-localhost}
      - VITE_RECORDER_WS_URL=ws://${HOST_IP:-localhost}:${BROWSER_WORKER_PORT:-3004}
      - VITE_CARBONE_API_URL=http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
      - VITE_NOVNC_URL=http://${HOST_IP:-localhost}:${NOVNC_PORT:-6080}/vnc.html
    ports:
      - "${PORTAL_PORT:-5173}:${PORTAL_PORT:-5173}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      platform:
        condition: service_started
      browser-worker:
        condition: service_started
      browser-template:
        condition: service_started
    networks:
      - ops-network

  user-web:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-user-web
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && pnpm --filter @ops/user-web run dev"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - USER_WEB_PORT=${USER_WEB_PORT:-5174}
      - VITE_API_BASE_URL=/api
      - VITE_CONTROL_PLANE_API_URL=http://${HOST_IP:-localhost}:${CONTROL_PLANE_PORT:-3003}/api
      - VITE_AI_API_BASE_URL=/api/ai
      - VITE_HOST_IP=${HOST_IP:-localhost}
    ports:
      - "${USER_WEB_PORT:-5174}:${USER_WEB_PORT:-5174}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      platform:
        condition: service_started
      control-plane:
        condition: service_started
      ai-orchestrator:
        condition: service_started
    networks:
      - ops-network

  # ============================================
  # Browser Worker (Chrome + noVNC + Codegen)
  # ============================================
  browser-chrome:
    build:
      context: ../..
      dockerfile: docker/browser-worker/Dockerfile
    image: ${SESSION_BROWSER_IMAGE:-ops-browser-chrome:local}
    container_name: ops-browser-chrome
    ports:
      - "${NOVNC_PORT:-6080}:8080"  # noVNC
      - "${CDP_PORT:-9222}:9222"  # CDP
      - "${VNC_PORT:-5901}:5900"  # VNC
      - "${CODEGEN_API_PORT:-3011}:${CODEGEN_API_PORT:-3011}"  # Codegen API
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - CODEGEN_API_PORT=${CODEGEN_API_PORT:-3011}
    command: ["/start-recorder.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/vnc.html >/dev/null && curl -fsS http://localhost:${CODEGEN_API_PORT:-3011}/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ops-network

  # ============================================
  # Temporal Server & UI
  # ============================================
  temporal:
    image: temporalio/auto-setup:1.22.0
    container_name: ops-temporal
    ports:
      - "7233:7233"   # Frontend gRPC
      - "7234:7234"   # History gRPC
      - "7235:7235"   # Matching gRPC
      - "7236:7236"   # Worker gRPC
    environment:
      - DB=postgresql
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-ops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ops_secret}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-ops_secret}
      - POSTGRES_DB=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic_config.yaml
    volumes:
      - temporal_data:/var/lib/postgresql/data
      - ../temporal/dynamic_config.yaml:/etc/temporal/dynamic_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ops-network

  temporal-ui:
    image: temporalio/ui:2.20.0
    container_name: ops-temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://${HOST_IP:-localhost}:8088,http://${HOST_IP:-localhost}:${PORTAL_PORT:-5173}
    depends_on:
      - temporal
    networks:
      - ops-network

  # ============================================
  # Sandbox Worker (Python)
  # Long-lived worker that executes code in sandbox
  # ============================================
  sandbox-worker:
    build:
      context: ../..
      dockerfile: docker/temporal/Dockerfile
      args:
        SANDBOX_WORKER_PROJECT_PATH: ${SANDBOX_WORKER_PROJECT_PATH:-apps/backend/runtimes/sandbox-worker}
    container_name: ops-sandbox-worker
    working_dir: /workspace/apps/backend/runtimes/sandbox-worker
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - AUTH_SERVICE_URL=http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      - SANDBOX_WORKER_TASK_QUEUE=sandbox-worker-task-queue
      - ACTIVITY_VALIDATION_TASK_QUEUE=activity-validation-task-queue
      - SANDBOX_HTTP_PORT=8090
      - CARBONE_SERVICE_URL=http://carbone-engine:3009
      - CARBONE_EXTERNAL_URL=http://${HOST_IP:-localhost}:3009
    ports:
      - "8090:8090"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker sandbox backend
    depends_on:
      - temporal
    networks:
      - ops-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  report_files:
  temporal_data:

networks:
  ops-network:
    external: true
    name: ${NETWORK_NAME:-ops-network}
