# AI识别测试环境
# 必须从仓库根目录通过 start-smart.sh 启动，确保挂载当前仓库
# 使用方法: ./docker/start-smart.sh docker-compose.test.yml up --abort-on-container-exit carbone-engine-test
# 或者: ./docker/start-smart.sh docker-compose.test.yml run --rm carbone-engine-test

services:
  # Mock AI服务（用于测试）
  mock-ai-server:
    image: node:20-bullseye
    container_name: mock-ai-server-test
    working_dir: /app
    command: >
      sh -c "npm install express && node server.js"
    environment:
      - PORT=3007
    ports:
      - "13007:3007"
    volumes:
      - ../mock-services/mock-ai-server.js:/app/server.js:ro

  # Carbone Engine测试容器
  carbone-engine-test:
    image: node:20-bullseye
    container_name: carbone-engine-test
    working_dir: /workspace/apps/backend/capabilities/document-domain
    command: >
      sh -c "npm install --workspaces=false --include=dev --package-lock=false
      && npm run prisma:generate
      && npm run test -- --runInBand --coverage=false --detectOpenHandles"
    environment:
      - NODE_ENV=test
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - PORT=3009
      - TEMPLATES_DIR=/tmp/test_templates
      - OUTPUTS_DIR=/tmp/test_outputs
      - AI_ORCHESTRATOR_URL=http://mock-ai-server:3007
      - AI_MODEL_ID=test-model-id
    ports:
      - "13009:3009"
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      - mock-ai-server
