# Carbone API + Office Add-in development stack
# Recommended entrypoint: ./docker/start-smart.sh docker-compose.addin.yml up -d

services:
  carbone-api:
    build:
      context: ../carbone-official
      dockerfile: Dockerfile.community
    container_name: carbone-api
    ports:
      - "3100:3100"
      - "3443:3443"
    volumes:
      - ../carbone-official/templates:/app/templates
      - ../office-addin/certs:/app/certs:ro
    environment:
      - CARBONE_API_PORT=3100
      - CARBONE_API_HTTPS_PORT=3443
      - ENABLE_HTTPS=true
      - CERT_PATH=/app/certs
      - NODE_ENV=production
      - CARBONE_ENGINE_URL=http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      - CARBONE_ENGINE_PROXY_TIMEOUT_MS=360000
    networks:
      - ops-network
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "require('https').get({host:'localhost',port:3443,path:'/health',rejectUnauthorized:false},(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  office-addin:
    build:
      context: ${PROJECT_ROOT:-..}/apps/frontend/office-addin
      dockerfile: ../../../docker/office-addin/Dockerfile.dev
    container_name: office-addin
    ports:
      - "3000:3000"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/frontend/office-addin/src:/app/src
      - ${PROJECT_ROOT:-..}/apps/frontend/office-addin/public:/app/public
      - ../office-addin/certs:/app/certs:ro
    environment:
      - VITE_ADDIN_BASE_URL=https://${OFFICE_ADDIN_PUBLIC_HOST:-localhost}:${OFFICE_ADDIN_PORT:-3000}
      - VITE_API_URL=https://${CARBONE_API_PUBLIC_HOST:-localhost}:${CARBONE_API_HTTPS_PORT:-3443}
      - VITE_HOST_IP=${HOST_IP:-localhost}
      - VITE_AI_ORCHESTRATOR_URL=https://${OFFICE_ADDIN_PUBLIC_HOST:-localhost}:${OFFICE_ADDIN_PORT:-3000}/proxy/ai-orchestrator
      - VITE_AI_ORCHESTRATOR_PROXY_TARGET=http://${HOST_IP:-localhost}:${AI_ORCHESTRATOR_PORT:-3007}
      - NODE_ENV=development
      - DOCKER=true
    networks:
      - ops-network
    depends_on:
      - carbone-api
    restart: unless-stopped

networks:
  ops-network:
    external: true
    name: ${NETWORK_NAME:-ops-network}
