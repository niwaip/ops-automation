# Ops Automation - Base Docker Compose Configuration
# This file defines common infrastructure and service templates
# Optional services such as `report` are gated by compose profiles
# Usage: docker compose -f docker-compose.base.yml [other overrides] up -d

x-common-env: &common-env
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?connection_limit=${PRISMA_CONNECTION_LIMIT:-5}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
  EXTERNAL_HOST: ${HOST_IP:-localhost}

x-common-node-service: &common-node-service
  image: ${DOCKER_REGISTRY:-}node:20-bullseye
  working_dir: /app
  command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npm run dev"
  networks:
    - ops-network

services:
  # ============================================
  # Infrastructure Services
  # ============================================
  postgres:
    image: ${DOCKER_REGISTRY:-}postgres:15-alpine
    container_name: ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops} -d ${POSTGRES_DB:-ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ops-network

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    container_name: ops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ops-network

  # ============================================
  # Backend Service Templates (override as needed)
  # ============================================
  platform:
    <<: *common-node-service
    container_name: ops-platform
    working_dir: /workspace
    environment:
      <<: *common-env
      DOCKER_ENV: true
      PORT: ${PLATFORM_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      AI_ORCHESTRATOR_URL: http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      SANDBOX_WORKER_URL: http://sandbox-worker:8090
      ACTIVITY_VALIDATION_AGENT_URL: http://sandbox-worker:8090
    command: >
      sh -c "corepack enable
      && COREPACK_NPM_REGISTRY=https://registry.npmmirror.com corepack prepare pnpm@8.12.0 --activate
      && pnpm config set registry https://registry.npmmirror.com
      && pnpm install --no-frozen-lockfile
      && pnpm --filter @ops/platform run build
      && rm -rf /workspace/apps/backend/core/platform/dist/generated
      && mkdir -p /workspace/apps/backend/core/platform/dist/generated
      && cp -R /workspace/apps/backend/core/platform/src/generated/prisma /workspace/apps/backend/core/platform/dist/generated/prisma
      && pnpm --filter @ops/platform run start"
    ports:
      - "${PLATFORM_PORT:-3001}:${PLATFORM_PORT:-3001}"
    volumes:
      - ${PROJECT_ROOT:-..}:/workspace
      - auth_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  session-broker:
    <<: *common-node-service
    container_name: ops-session-broker
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && rm -f tsconfig.tsbuildinfo && npm run build && rm -rf /app/dist/generated && mkdir -p /app/dist/generated && cp -R /app/src/generated/prisma /app/dist/generated/prisma && node dist/main.js"
    environment:
      <<: *common-env
      PORT: ${SESSION_BROKER_PORT:-3002}
      DOCKER_ENV: true
      BROWSER_WORKER_URL: http://${BROWSER_WORKER_HOST:-browser-worker}:${BROWSER_WORKER_PORT:-3004}
    ports:
      - "${SESSION_BROKER_PORT:-3002}:${SESSION_BROKER_PORT:-3002}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/execution-control/session-broker:/app
      - ${PROJECT_ROOT:-..}/packages/backend-contracts:/packages/backend-contracts
      - session_broker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  control-plane:
    <<: *common-node-service
    container_name: ops-control-plane
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && npx prisma generate && npm run build && rm -rf /app/dist/generated && mkdir -p /app/dist/generated && cp -R /app/src/generated/prisma /app/dist/generated/prisma && npm run start"
    environment:
      <<: *common-env
      DOCKER_ENV: true
      PORT: ${CONTROL_PLANE_PORT:-3003}
      BROWSER_LOOP_WORKFLOW_ENABLED: ${BROWSER_LOOP_WORKFLOW_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      AUTH_SERVICE_URL: http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      AI_ORCHESTRATOR_URL: http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      SESSION_BROKER_URL: http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
      PROXY_TIMEOUT_DEFAULT_MS: ${PROXY_TIMEOUT_DEFAULT_MS:-60000}
      PROXY_TIMEOUT_PLATFORM_MS: ${PROXY_TIMEOUT_PLATFORM_MS:-60000}
      PROXY_TIMEOUT_AUTH_MS: ${PROXY_TIMEOUT_AUTH_MS:-60000}
      PROXY_TIMEOUT_BROWSER_TEMPLATE_MS: ${PROXY_TIMEOUT_BROWSER_TEMPLATE_MS:-60000}
      PROXY_TIMEOUT_SESSION_MS: ${PROXY_TIMEOUT_SESSION_MS:-60000}
      PROXY_TIMEOUT_AI_MS: ${PROXY_TIMEOUT_AI_MS:-60000}
      PROXY_TIMEOUT_WORKER_MS: ${PROXY_TIMEOUT_WORKER_MS:-60000}
    ports:
      - "${CONTROL_PLANE_PORT:-3003}:${CONTROL_PLANE_PORT:-3003}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/execution-control/control-plane:/app
      - ${PROJECT_ROOT:-..}/packages/contracts:/packages/contracts
      - ${PROJECT_ROOT:-..}/packages/backend-contracts:/packages/backend-contracts
      - control_plane_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-worker:
    <<: *common-node-service
    container_name: ops-browser-worker
    command: >
      sh -c "npm config set registry https://registry.npmmirror.com
      && npm install --legacy-peer-deps --include=dev
      && if [ \"${BROWSER_WORKER_RUN_MODE:-prod}\" = \"dev\" ]; then npm run dev; else npm run build && node --enable-source-maps dist/main.js; fi"
    environment:
      NODE_ENV: ${BROWSER_WORKER_NODE_ENV:-production}
      DOCKER_ENV: true
      PORT: ${BROWSER_WORKER_PORT:-3004}
      CHROME_REMOTE_DEBUGGING_HOST: browser-chrome
      CHROME_REMOTE_DEBUGGING_PORT: ${CDP_PORT:-9222}
      CODEGEN_API_PORT: ${CODEGEN_API_PORT:-3011}
      BROWSER_WORKER_RUN_MODE: ${BROWSER_WORKER_RUN_MODE:-prod}
      CHROME_DEVTOOLS_CLI_IDLE_TTL_MS: ${CHROME_DEVTOOLS_CLI_IDLE_TTL_MS:-300000}
      SESSION_BROKER_URL: http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
      BROWSER_WORKER_ORPHAN_SWEEP_ENABLED: ${BROWSER_WORKER_ORPHAN_SWEEP_ENABLED:-true}
      BROWSER_WORKER_ORPHAN_SWEEP_INTERVAL_MS: ${BROWSER_WORKER_ORPHAN_SWEEP_INTERVAL_MS:-30000}
      BROWSER_WORKER_ORPHAN_SWEEP_REQUEST_TIMEOUT_MS: ${BROWSER_WORKER_ORPHAN_SWEEP_REQUEST_TIMEOUT_MS:-3000}
      BROWSER_WORKER_ORPHAN_SWEEP_MIN_IDLE_MS: ${BROWSER_WORKER_ORPHAN_SWEEP_MIN_IDLE_MS:-1800000}
      PLAYWRIGHT_CLI_ACTION_TIMEOUT_MS: ${PLAYWRIGHT_CLI_ACTION_TIMEOUT_MS:-60000}
      PLAYWRIGHT_CLI_NAVIGATION_TIMEOUT_MS: ${PLAYWRIGHT_CLI_NAVIGATION_TIMEOUT_MS:-60000}
      PLAYWRIGHT_CLI_PROCESS_TIMEOUT_MS: ${PLAYWRIGHT_CLI_PROCESS_TIMEOUT_MS:-120000}
      BROWSER_WORKER_PROFILE_ROOT: /backend-var/browser-profiles/sessions
      PLAYWRIGHT_CLI_PROFILE_DIR: /backend-var/browser-profiles/playwright-cli
      PLAYWRIGHT_CLI_ARTIFACT_DIR: /backend-var/tmp/browser-worker/playwright-cli-artifacts
      SESSION_BROWSER_IMAGE: ${SESSION_BROWSER_IMAGE:-ops-browser-chrome:local}
      NETWORK_NAME: ${NETWORK_NAME:-ops-network}
      EXTERNAL_HOST: ${HOST_IP:-localhost}
    ports:
      - "${BROWSER_WORKER_PORT:-3004}:${BROWSER_WORKER_PORT:-3004}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/runtimes/browser-worker:/app
      - ${PROJECT_ROOT:-..}/packages/backend-contracts:/packages/backend-contracts
      - browser_worker_node_modules:/app/node_modules
      - ${PROJECT_ROOT:-..}/apps/backend/var/browser-profiles:/backend-var/browser-profiles
      - ${PROJECT_ROOT:-..}/apps/backend/var/tmp/browser-worker:/backend-var/tmp/browser-worker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - browser-chrome

  browser-template:
    <<: *common-node-service
    container_name: ops-browser-template
    command: >
      sh -c "npm config set registry https://registry.npmmirror.com
      && npm config set fetch-retries 5
      && npm config set fetch-retry-mintimeout 20000
      && npm config set fetch-retry-maxtimeout 120000
      && i=0
      && until [ $$i -ge 5 ]; do
        npm install --legacy-peer-deps --include=dev && break;
        i=$$((i+1));
        echo 'npm install failed, retrying in 10s...';
        sleep 10;
      done
      && [ $$i -lt 5 ]
      && j=0
      && until [ $$j -ge 5 ]; do
        npx prisma generate && break;
        j=$$((j+1));
        echo 'prisma generate failed, retrying in 10s...';
        sleep 10;
      done
      && [ $$j -lt 5 ]
      && npm run build
      && rm -rf /app/dist/generated
      && mkdir -p /app/dist/generated
      && cp -R /app/generated/prisma /app/dist/generated/prisma
      && npm run start"
    environment:
      <<: *common-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-ops}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ops_secret}
      DB_DATABASE: ${POSTGRES_DB:-ops}
      PORT: ${BROWSER_TEMPLATE_PORT:-3005}
    ports:
      - "${BROWSER_TEMPLATE_PORT:-3005}:${BROWSER_TEMPLATE_PORT:-3005}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/capabilities/browser-domain/templates:/app
      - browser_template_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  browser-semantics:
    <<: *common-node-service
    container_name: ops-browser-semantics
    command: >
      sh -c "npm config set registry https://registry.npmmirror.com
      && npm config set fetch-retries 5
      && npm config set fetch-retry-mintimeout 20000
      && npm config set fetch-retry-maxtimeout 120000
      && i=0
      && until [ $$i -ge 5 ]; do
        npm install --legacy-peer-deps --include=dev && break;
        i=$$((i+1));
        echo 'npm install failed, retrying in 10s...';
        sleep 10;
      done
      && [ $$i -lt 5 ]
      && j=0
      && until [ $$j -ge 5 ]; do
        npx prisma generate && break;
        j=$$((j+1));
        echo 'prisma generate failed, retrying in 10s...';
        sleep 10;
      done
      && [ $$j -lt 5 ]
      && npx prisma db push
      && if [ \"${BROWSER_SEMANTICS_RUN_DEFAULT_SEED:-false}\" = \"true\" ]; then npm run seed:browser-recorder; fi
      && npm run build
      && rm -rf /app/dist/generated
      && mkdir -p /app/dist/generated
      && cp -R /app/generated/prisma /app/dist/generated/prisma
      && npm run start"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=browser_semantics&connection_limit=${PRISMA_CONNECTION_LIMIT:-5}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      EXTERNAL_HOST: ${HOST_IP:-localhost}
      PORT: ${BROWSER_SEMANTICS_PORT:-3006}
      BROWSER_SEMANTICS_AUTO_SEED: ${BROWSER_SEMANTICS_AUTO_SEED:-true}
      BROWSER_SEMANTICS_RUN_DEFAULT_SEED: ${BROWSER_SEMANTICS_RUN_DEFAULT_SEED:-false}
    ports:
      - "${BROWSER_SEMANTICS_PORT:-3006}:${BROWSER_SEMANTICS_PORT:-3006}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/capabilities/browser-domain/semantics:/app
      - browser_semantics_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  ai-orchestrator:
    <<: *common-node-service
    container_name: ops-ai-orchestrator
    command: >
      sh -c "npm config set registry https://registry.npmmirror.com
      && npm install --legacy-peer-deps
      && npx prisma generate
      && npm run dev"
    environment:
      <<: *common-env
      DOCKER_ENV: true
      PORT: ${AI_ORCHESTRATOR_PORT:-3007}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      AUTH_SERVICE_URL: http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      BROWSER_WORKER_URL: http://${BROWSER_WORKER_HOST:-browser-worker}:${BROWSER_WORKER_PORT:-3004}
      CONTROL_PLANE_URL: http://${CONTROL_PLANE_HOST:-control-plane}:${CONTROL_PLANE_PORT:-3003}
      CARBONE_SERVICE_URL: http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      CARBONE_EXTERNAL_URL: http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
      ALIBABA_CODING_API_KEY: ${ALIBABA_CODING_API_KEY:-}
      ALIBABA_BAILIAN_API_KEY: ${ALIBABA_BAILIAN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DOCUMENT_SEMANTIC_SUBAGENT_ENABLED: ${DOCUMENT_SEMANTIC_SUBAGENT_ENABLED:-true}
      DOCUMENT_SEMANTIC_PARAM_THRESHOLD: ${DOCUMENT_SEMANTIC_PARAM_THRESHOLD:-8}
      DOCUMENT_SEMANTIC_MISSING_THRESHOLD: ${DOCUMENT_SEMANTIC_MISSING_THRESHOLD:-4}
      DOCUMENT_SEMANTIC_ARRAY_GROUP_THRESHOLD: ${DOCUMENT_SEMANTIC_ARRAY_GROUP_THRESHOLD:-2}
    ports:
      - "${AI_ORCHESTRATOR_PORT:-3007}:${AI_ORCHESTRATOR_PORT:-3007}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/intelligence/ai-orchestrator:/app
      - ${PROJECT_ROOT:-..}/packages/contracts:/packages/contracts
      - ai_orchestrator_node_modules:/app/node_modules
      - ${PROJECT_ROOT:-..}/apps/backend/var/cache/ai-orchestrator:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser-semantics:
        condition: service_started

  report:
    <<: *common-node-service
    container_name: ops-report
    command: >
      sh -c "npm config set registry https://registry.npmmirror.com
      && npm install --package-lock=false --legacy-peer-deps --include=dev --workspaces=false
      && npx prisma generate
      && npm run build
      && rm -rf /app/dist/generated
      && mkdir -p /app/dist/generated
      && cp -R /app/generated/prisma /app/dist/generated/prisma
      && npm run start"
    environment:
      <<: *common-env
      PORT: ${REPORT_PORT:-3008}
      AI_ORCHESTRATOR_URL: http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      SESSION_BROKER_URL: http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
      FILES_DIR: /app/files
    ports:
      - "${REPORT_PORT:-3008}:${REPORT_PORT:-3008}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/capabilities/document-domain/report:/app
      - ${PROJECT_ROOT:-..}/packages/backend-contracts:/packages/backend-contracts
      - report_runtime_node_modules:/app/node_modules
      - report_files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-orchestrator:
        condition: service_started
      session-broker:
        condition: service_started
    profiles:
      - report

  # ============================================
  # Frontend
  # ============================================
  portal:
    <<: *common-node-service
    container_name: ops-portal
    environment:
      NODE_ENV: development
      DOCKER_ENV: true
      AUTH_SERVICE_HOST: platform
      PLATFORM_HOST: platform
      BROWSER_TEMPLATE_HOST: browser-template
      VITE_API_BASE_URL: /api
      VITE_CONTROL_PLANE_API_URL: http://${HOST_IP:-localhost}:${CONTROL_PLANE_PORT:-3003}/api
      VITE_HOST_IP: ${HOST_IP:-localhost}
      VITE_RECORDER_WS_URL: ws://${HOST_IP:-localhost}:${BROWSER_WORKER_PORT:-3004}
      VITE_CARBONE_API_URL: http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
      VITE_NOVNC_URL: http://${HOST_IP:-localhost}:${NOVNC_PORT:-6080}/vnc.html
    ports:
      - "${PORTAL_PORT:-5173}:${PORTAL_PORT:-5173}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/frontend/portal:/app
      - ${PROJECT_ROOT:-..}/apps/frontend/shared:/shared
      - ${PROJECT_ROOT:-..}/packages/contracts:/packages/contracts
      - ${PROJECT_ROOT:-..}/packages/backend-contracts:/packages/backend-contracts
      - ${PROJECT_ROOT:-..}/packages/user-core:/packages/user-core
      - ${PROJECT_ROOT:-..}/tsconfig.base.json:/tsconfig.base.json:ro
      - portal_node_modules:/app/node_modules
    depends_on:
      - platform
      - browser-worker
      - browser-template

  user-web:
    <<: *common-node-service
    container_name: ops-user-web
    environment:
      NODE_ENV: development
      DOCKER_ENV: true
      USER_WEB_PORT: ${USER_WEB_PORT:-5174}
      VITE_API_BASE_URL: /api
      VITE_CONTROL_PLANE_API_URL: http://${HOST_IP:-localhost}:${CONTROL_PLANE_PORT:-3003}/api
      VITE_AI_API_BASE_URL: /api/ai
      VITE_HOST_IP: ${HOST_IP:-localhost}
    ports:
      - "${USER_WEB_PORT:-5174}:${USER_WEB_PORT:-5174}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/frontend/user-web:/app
      - ${PROJECT_ROOT:-..}/apps/frontend/shared:/shared
      - ${PROJECT_ROOT:-..}/packages/contracts:/packages/contracts
      - ${PROJECT_ROOT:-..}/packages/backend-contracts:/packages/backend-contracts
      - ${PROJECT_ROOT:-..}/packages/user-core:/packages/user-core
      - ${PROJECT_ROOT:-..}/tsconfig.base.json:/tsconfig.base.json:ro
      - user_web_node_modules:/app/node_modules
    depends_on:
      - platform
      - control-plane
      - ai-orchestrator

  # ============================================
  # Browser Chrome (noVNC + CDP + Codegen)
  # ============================================
  browser-chrome:
    build:
      context: ../..
      dockerfile: docker/browser-worker/Dockerfile
    image: ${SESSION_BROWSER_IMAGE:-ops-browser-chrome:local}
    container_name: ops-browser-chrome
    ports:
      - "${NOVNC_PORT:-6080}:8080"
      - "${CDP_PORT:-9222}:9222"
      - "${VNC_PORT:-5900}:5900"
      - "${CODEGEN_API_PORT:-3011}:${CODEGEN_API_PORT:-3011}"
    environment:
      SCREEN_WIDTH: 1920
      SCREEN_HEIGHT: 1080
      CODEGEN_API_PORT: ${CODEGEN_API_PORT:-3011}
    command: ["/start-recorder.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/vnc.html >/dev/null && curl -fsS http://localhost:${CODEGEN_API_PORT:-3011}/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ops-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  auth_node_modules:
  session_broker_node_modules:
  control_plane_node_modules:
  browser_worker_node_modules:
  browser_template_node_modules:
  browser_semantics_node_modules:
  ai_orchestrator_node_modules:
  portal_node_modules:
  user_web_node_modules:
  report_runtime_node_modules:
  report_files:

networks:
  ops-network:
    external: true
    name: ${NETWORK_NAME:-ops-network}
