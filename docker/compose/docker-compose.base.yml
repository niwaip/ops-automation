# Ops Automation - Default Development Compose
# 日常开发默认入口：./docker/start-smart.sh dev up -d
# Optional services such as `report` are gated by compose profiles
# Equivalent explicit entry: ./docker/start-smart.sh docker-compose.base.yml up -d

x-common-env: &common-env
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?connection_limit=${PRISMA_CONNECTION_LIMIT:-5}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
  EXTERNAL_HOST: ${HOST_IP:-localhost}

x-common-node-service: &common-node-service
  image: ${DOCKER_REGISTRY:-}node:20-bullseye
  working_dir: /workspace
  networks:
    - ops-network

services:
  # ============================================
  # Workspace Dependencies Init (must complete before other services)
  # ============================================
  workspace-deps-init:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-workspace-init
    working_dir: /workspace
    command: >
      sh -c "bash /workspace/docker/scripts/bootstrap-workspace-deps.sh
      && bash /workspace/docker/scripts/apply-all-db-schema-in-container.sh"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?connection_limit=${PRISMA_CONNECTION_LIMIT:-5}
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ops-network

  # ============================================
  # Infrastructure Services
  # ============================================
  postgres:
    image: ${DOCKER_REGISTRY:-}postgres:15-alpine
    container_name: ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ops}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ops} -d ${POSTGRES_DB:-ops}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ops-network

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    container_name: ops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_secret}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ops-network

  # ============================================
  # Backend Service Templates (override as needed)
  # ============================================
  platform:
    <<: *common-node-service
    container_name: ops-platform
    environment:
      <<: *common-env
      DOCKER_ENV: true
      PORT: ${PLATFORM_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      IM_CHANNEL_ENCRYPTION_KEY: ${IM_CHANNEL_ENCRYPTION_KEY:-7fd6414a543574effddb645132638c2357ba2f12a57c09216bc45880f5271757}
      IM_CHANNEL_MAX_ACTIVE_CONNECTIONS: ${IM_CHANNEL_MAX_ACTIVE_CONNECTIONS:-100}
      AI_ORCHESTRATOR_URL: http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      SANDBOX_WORKER_URL: http://sandbox-worker:8090
      ACTIVITY_VALIDATION_AGENT_URL: http://sandbox-worker:8090
      CARBONE_SERVICE_URL: http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-84c47505-ec2e-49fb-9929-2d95b1e32d68}
      BROWSER_RUN_OUTPUT_V2_ENABLED: ${BROWSER_RUN_OUTPUT_V2_ENABLED:-true}
      BROWSER_RUN_OUTPUT_V2_DUAL_WRITE: ${BROWSER_RUN_OUTPUT_V2_DUAL_WRITE:-true}
      BROWSER_CONTENT_REF_ENABLED: ${BROWSER_CONTENT_REF_ENABLED:-true}
      BROWSER_POST_STATE_RECONCILIATION_ENABLED: ${BROWSER_POST_STATE_RECONCILIATION_ENABLED:-true}
    command: >
      sh -c "corepack enable && pnpm --filter @ops/platform run build
      && rm -rf /workspace/apps/backend/core/platform/dist/generated /workspace/apps/backend/core/platform/dist/src/generated
      && mkdir -p /workspace/apps/backend/core/platform/dist/generated /workspace/apps/backend/core/platform/dist/src/generated
      && cp -R /workspace/apps/backend/core/platform/src/generated/prisma /workspace/apps/backend/core/platform/dist/generated/prisma
      && cp -R /workspace/apps/backend/core/platform/src/generated/prisma /workspace/apps/backend/core/platform/dist/src/generated/prisma
      && pnpm --filter @ops/platform run start"
    ports:
      - '${PLATFORM_PORT:-3001}:${PLATFORM_PORT:-3001}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  session-broker:
    <<: *common-node-service
    container_name: ops-session-broker
    command: >
      sh -c "corepack enable && pnpm --filter @ops/session-broker run build
      && rm -rf /workspace/apps/backend/execution-control/session-broker/dist/generated
      && mkdir -p /workspace/apps/backend/execution-control/session-broker/dist/generated
      && cp -R /workspace/apps/backend/execution-control/session-broker/src/generated/prisma /workspace/apps/backend/execution-control/session-broker/dist/generated/prisma
      && pnpm --filter @ops/session-broker run start"
    environment:
      <<: *common-env
      PORT: ${SESSION_BROKER_PORT:-3002}
      DOCKER_ENV: true
      BROWSER_WORKER_URL: http://${BROWSER_WORKER_HOST:-browser-worker}:${BROWSER_WORKER_PORT:-3004}
    ports:
      - '${SESSION_BROKER_PORT:-3002}:${SESSION_BROKER_PORT:-3002}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  control-plane:
    <<: *common-node-service
    container_name: ops-control-plane
    command: >
      sh -c "bash /workspace/docker/scripts/build-control-plane-runtime.sh
      && node /workspace/docker/scripts/start-control-plane-runtime.cjs api"
    environment:
      <<: *common-env
      DOCKER_ENV: true
      PORT: ${CONTROL_PLANE_PORT:-3003}
      CONTROL_PLANE_ROLE: ${CONTROL_PLANE_ROLE:-all}
      BROWSER_LOOP_WORKFLOW_ENABLED: ${BROWSER_LOOP_WORKFLOW_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      WEB_SEARCH_TIMEOUT_MS: ${WEB_SEARCH_TIMEOUT_MS:-18000}
      AUTH_SERVICE_URL: http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      AI_ORCHESTRATOR_URL: http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      CARBONE_SERVICE_URL: http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      LLM_OPERATION_TIMEOUT_MS: ${LLM_OPERATION_TIMEOUT_MS:-300000}
      HABIT_LEARNING_DAILY_JOB_ENABLED: ${HABIT_LEARNING_DAILY_JOB_ENABLED:-true}
      HABIT_LEARNING_ACTIVATION_ENABLED: ${HABIT_LEARNING_ACTIVATION_ENABLED:-true}
      EXECUTION_OUTBOX_ENABLED: ${EXECUTION_OUTBOX_ENABLED:-false}
      EXECUTION_DISPATCHER_V2_ENABLED: ${EXECUTION_DISPATCHER_V2_ENABLED:-false}
      SAFE_READY_SET_PARALLEL_ENABLED: ${SAFE_READY_SET_PARALLEL_ENABLED:-false}
      SAFE_READY_SET_MAX_CONCURRENCY: ${SAFE_READY_SET_MAX_CONCURRENCY:-4}
      SCHEDULE_FIRE_V2_ENABLED: ${SCHEDULE_FIRE_V2_ENABLED:-false}
      PLAN_RISK_EVALUATOR_V2_ENABLED: ${PLAN_RISK_EVALUATOR_V2_ENABLED:-false}
      RESULT_REF_ENABLED: ${RESULT_REF_ENABLED:-true}
      BROWSER_CONTENT_REF_ENABLED: ${BROWSER_CONTENT_REF_ENABLED:-true}
      DETERMINISTIC_CONTENT_BINDING_ENABLED: ${DETERMINISTIC_CONTENT_BINDING_ENABLED:-true}
      OPS_REPORT_PROJECTION_ENABLED: ${OPS_REPORT_PROJECTION_ENABLED:-true}
      COMPOSITE_BROWSER_PLAN_ENABLED: ${COMPOSITE_BROWSER_PLAN_ENABLED:-true}
      SESSION_BROKER_URL: http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
      PROXY_TIMEOUT_DEFAULT_MS: ${PROXY_TIMEOUT_DEFAULT_MS:-60000}
      PROXY_TIMEOUT_PLATFORM_MS: ${PROXY_TIMEOUT_PLATFORM_MS:-60000}
      PROXY_TIMEOUT_AUTH_MS: ${PROXY_TIMEOUT_AUTH_MS:-60000}
      PROXY_TIMEOUT_BROWSER_TEMPLATE_MS: ${PROXY_TIMEOUT_BROWSER_TEMPLATE_MS:-60000}
      PROXY_TIMEOUT_SESSION_MS: ${PROXY_TIMEOUT_SESSION_MS:-60000}
      PROXY_TIMEOUT_AI_MS: ${PROXY_TIMEOUT_AI_MS:-60000}
      PROXY_TIMEOUT_WORKER_MS: ${PROXY_TIMEOUT_WORKER_MS:-60000}
    ports:
      - '${CONTROL_PLANE_PORT:-3003}:${CONTROL_PLANE_PORT:-3003}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  execution-dispatcher:
    <<: *common-node-service
    profiles: ['durable-dispatch']
    command: >
      sh -c "bash /workspace/docker/scripts/build-control-plane-runtime.sh
      && node /workspace/docker/scripts/start-control-plane-runtime.cjs worker"
    environment:
      <<: *common-env
      DOCKER_ENV: true
      CONTROL_PLANE_ROLE: dispatcher
      EXECUTION_OUTBOX_ENABLED: 'true'
      EXECUTION_DISPATCHER_V2_ENABLED: 'true'
      SCHEDULE_FIRE_V2_ENABLED: 'false'
      PLAN_RISK_EVALUATOR_V2_ENABLED: ${PLAN_RISK_EVALUATOR_V2_ENABLED:-false}
      RESULT_REF_ENABLED: ${RESULT_REF_ENABLED:-true}
      BROWSER_CONTENT_REF_ENABLED: ${BROWSER_CONTENT_REF_ENABLED:-true}
      DETERMINISTIC_CONTENT_BINDING_ENABLED: ${DETERMINISTIC_CONTENT_BINDING_ENABLED:-true}
      OPS_REPORT_PROJECTION_ENABLED: ${OPS_REPORT_PROJECTION_ENABLED:-true}
      COMPOSITE_BROWSER_PLAN_ENABLED: ${COMPOSITE_BROWSER_PLAN_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      WEB_SEARCH_TIMEOUT_MS: ${WEB_SEARCH_TIMEOUT_MS:-18000}
      AUTH_SERVICE_URL: http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      AI_ORCHESTRATOR_URL: http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      CARBONE_SERVICE_URL: http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      SESSION_BROKER_URL: http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  schedule-trigger:
    <<: *common-node-service
    profiles: ['durable-dispatch']
    command: >
      sh -c "bash /workspace/docker/scripts/build-control-plane-runtime.sh
      && node /workspace/docker/scripts/start-control-plane-runtime.cjs worker"
    environment:
      <<: *common-env
      DOCKER_ENV: true
      CONTROL_PLANE_ROLE: schedule
      EXECUTION_OUTBOX_ENABLED: 'true'
      EXECUTION_DISPATCHER_V2_ENABLED: 'false'
      SCHEDULE_FIRE_V2_ENABLED: 'true'
      PLAN_RISK_EVALUATOR_V2_ENABLED: ${PLAN_RISK_EVALUATOR_V2_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      AUTH_SERVICE_URL: http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      AI_ORCHESTRATOR_URL: http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      CARBONE_SERVICE_URL: http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      SESSION_BROKER_URL: http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-worker:
    <<: *common-node-service
    container_name: ops-browser-worker
    command: >
      sh -c "corepack enable && if [ \"${BROWSER_WORKER_RUN_MODE:-prod}\" = \"dev\" ]; then pnpm --filter @ops/browser-worker run dev; else pnpm --filter @ops/browser-worker run build && node --enable-source-maps /workspace/apps/backend/runtimes/browser-worker/dist/main.js; fi"
    environment:
      NODE_ENV: ${BROWSER_WORKER_NODE_ENV:-production}
      DOCKER_ENV: true
      PORT: ${BROWSER_WORKER_PORT:-3004}
      CHROME_REMOTE_DEBUGGING_HOST: browser-chrome
      CHROME_REMOTE_DEBUGGING_PORT: ${CDP_PORT:-9222}
      CODEGEN_API_PORT: ${CODEGEN_API_PORT:-3011}
      BROWSER_WORKER_RUN_MODE: ${BROWSER_WORKER_RUN_MODE:-prod}
      CHROME_DEVTOOLS_CLI_IDLE_TTL_MS: ${CHROME_DEVTOOLS_CLI_IDLE_TTL_MS:-300000}
      SESSION_BROKER_URL: http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
      BROWSER_WORKER_ORPHAN_SWEEP_ENABLED: ${BROWSER_WORKER_ORPHAN_SWEEP_ENABLED:-true}
      BROWSER_WORKER_ORPHAN_SWEEP_INTERVAL_MS: ${BROWSER_WORKER_ORPHAN_SWEEP_INTERVAL_MS:-30000}
      BROWSER_WORKER_ORPHAN_SWEEP_REQUEST_TIMEOUT_MS: ${BROWSER_WORKER_ORPHAN_SWEEP_REQUEST_TIMEOUT_MS:-3003}
      BROWSER_WORKER_ORPHAN_SWEEP_MIN_IDLE_MS: ${BROWSER_WORKER_ORPHAN_SWEEP_MIN_IDLE_MS:-1800000}
      PLAYWRIGHT_CLI_ACTION_TIMEOUT_MS: ${PLAYWRIGHT_CLI_ACTION_TIMEOUT_MS:-60000}
      PLAYWRIGHT_CLI_NAVIGATION_TIMEOUT_MS: ${PLAYWRIGHT_CLI_NAVIGATION_TIMEOUT_MS:-60000}
      PLAYWRIGHT_CLI_PROCESS_TIMEOUT_MS: ${PLAYWRIGHT_CLI_PROCESS_TIMEOUT_MS:-120000}
      BROWSER_NORMALIZED_ARTIFACTS_ENABLED: ${BROWSER_NORMALIZED_ARTIFACTS_ENABLED:-true}
      BROWSER_CONTENT_EXTRACTION_ENABLED: ${BROWSER_CONTENT_EXTRACTION_ENABLED:-true}
      BROWSER_WORKER_PUBLIC_BASE_URL: ${BROWSER_WORKER_PUBLIC_BASE_URL:-http://${HOST_IP:-localhost}:${BROWSER_WORKER_PORT:-3004}}
      BROWSER_WORKER_PROFILE_ROOT: /backend-var/browser-profiles/sessions
      PLAYWRIGHT_CLI_PROFILE_DIR: /backend-var/browser-profiles/playwright-cli
      PLAYWRIGHT_CLI_ARTIFACT_DIR: /backend-var/tmp/browser-worker/playwright-cli-artifacts
      SESSION_BROWSER_IMAGE: ${SESSION_BROWSER_IMAGE:-ops-browser-chrome:local}
      NETWORK_NAME: ${NETWORK_NAME:-ops-network}
      EXTERNAL_HOST: ${HOST_IP:-localhost}
    ports:
      - '${BROWSER_WORKER_PORT:-3004}:${BROWSER_WORKER_PORT:-3004}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}/apps/backend/var/browser-profiles:/backend-var/browser-profiles
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}/apps/backend/var/tmp/browser-worker:/backend-var/tmp/browser-worker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      browser-chrome:
        condition: service_started

  browser-template:
    <<: *common-node-service
    container_name: ops-browser-template
    command: >
      sh -c "corepack enable && pnpm --filter @ops/browser-template exec prisma generate
      && pnpm --filter @ops/browser-template exec prisma db push
      && pnpm --filter @ops/browser-template run build
      && pnpm --filter @ops/browser-template run start"
    environment:
      <<: *common-env
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=browser_templates&connection_limit=${PRISMA_CONNECTION_LIMIT:-5}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-ops}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ops_secret}
      DB_DATABASE: ${POSTGRES_DB:-ops}
      PORT: ${BROWSER_TEMPLATE_PORT:-3005}
    ports:
      - '${BROWSER_TEMPLATE_PORT:-3005}:${BROWSER_TEMPLATE_PORT:-3005}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  browser-semantics:
    <<: *common-node-service
    container_name: ops-browser-semantics
    command: >
      sh -c "corepack enable && pnpm --filter @ops/browser-semantics exec prisma generate
      && pnpm --filter @ops/browser-semantics exec prisma db push
      && if [ \"${BROWSER_SEMANTICS_RUN_DEFAULT_SEED:-false}\" = \"true\" ]; then pnpm --filter @ops/browser-semantics run seed:browser-recorder; fi
      && pnpm --filter @ops/browser-semantics run build
      && rm -rf /workspace/apps/backend/capabilities/browser-domain/semantics/dist/generated
      && mkdir -p /workspace/apps/backend/capabilities/browser-domain/semantics/dist/generated
      && cp -R /workspace/apps/backend/capabilities/browser-domain/semantics/generated/prisma /workspace/apps/backend/capabilities/browser-domain/semantics/dist/generated/prisma
      && pnpm --filter @ops/browser-semantics run start"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=browser_semantics&connection_limit=${PRISMA_CONNECTION_LIMIT:-5}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      EXTERNAL_HOST: ${HOST_IP:-localhost}
      PORT: ${BROWSER_SEMANTICS_PORT:-3006}
      BROWSER_SEMANTICS_AUTO_SEED: ${BROWSER_SEMANTICS_AUTO_SEED:-true}
      BROWSER_SEMANTICS_RUN_DEFAULT_SEED: ${BROWSER_SEMANTICS_RUN_DEFAULT_SEED:-false}
    ports:
      - '${BROWSER_SEMANTICS_PORT:-3006}:${BROWSER_SEMANTICS_PORT:-3006}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  ai-orchestrator:
    <<: *common-node-service
    container_name: ops-ai-orchestrator
    command: >
      sh -c "corepack enable && pnpm --filter @ops/ai-orchestrator run build
      && pnpm --filter @ops/ai-orchestrator run start"
    environment:
      <<: *common-env
      COMPOSITE_BROWSER_PLAN_ENABLED: ${COMPOSITE_BROWSER_PLAN_ENABLED:-true}
      RECORDER_COMPOSITION_EDITOR_ENABLED: ${RECORDER_COMPOSITION_EDITOR_ENABLED:-false}
      DOCKER_ENV: true
      PORT: ${AI_ORCHESTRATOR_PORT:-3007}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      AUTH_SERVICE_URL: http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      BROWSER_WORKER_URL: http://${BROWSER_WORKER_HOST:-browser-worker}:${BROWSER_WORKER_PORT:-3004}
      BROWSER_POST_STATE_RECONCILIATION_ENABLED: ${BROWSER_POST_STATE_RECONCILIATION_ENABLED:-false}
      CONTROL_PLANE_URL: http://${CONTROL_PLANE_HOST:-control-plane}:${CONTROL_PLANE_PORT:-3003}
      CARBONE_SERVICE_URL: http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      CARBONE_EXTERNAL_URL: http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
      ALIBABA_CODING_API_KEY: ${ALIBABA_CODING_API_KEY:-}
      ALIBABA_BAILIAN_API_KEY: ${ALIBABA_BAILIAN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_OPERATION_SYSTEM_BOOTSTRAP_ENABLED: ${LLM_OPERATION_SYSTEM_BOOTSTRAP_ENABLED:-true}
      ROUTING_POLICY_FILE: ${ROUTING_POLICY_FILE:-}
      ROUTING_POLICY_JSON: ${ROUTING_POLICY_JSON:-}
      PLANNING_DECISION_PERSIST_ENABLED: ${PLANNING_DECISION_PERSIST_ENABLED:-false}
      PLANNER_CAPABILITY_TOP_K: ${PLANNER_CAPABILITY_TOP_K:-6}
      MODEL_INVOCATION_LEDGER_ENABLED: ${MODEL_INVOCATION_LEDGER_ENABLED:-false}
      SCOPED_MEMORY_PROMPT_ENABLED: ${SCOPED_MEMORY_PROMPT_ENABLED:-false}
      SCOPED_MEMORY_PLANNER_KIND: ${SCOPED_MEMORY_PLANNER_KIND:-planner_context}
      SCOPED_MEMORY_PLANNER_KEY: ${SCOPED_MEMORY_PLANNER_KEY:-default}
      PRODUCTION_REACT_FALLBACK_ENABLED: ${PRODUCTION_REACT_FALLBACK_ENABLED:-false}
      DOCUMENT_SEMANTIC_SUBAGENT_ENABLED: ${DOCUMENT_SEMANTIC_SUBAGENT_ENABLED:-true}
      DOCUMENT_SEMANTIC_PARAM_THRESHOLD: ${DOCUMENT_SEMANTIC_PARAM_THRESHOLD:-8}
      DOCUMENT_SEMANTIC_MISSING_THRESHOLD: ${DOCUMENT_SEMANTIC_MISSING_THRESHOLD:-4}
      DOCUMENT_SEMANTIC_ARRAY_GROUP_THRESHOLD: ${DOCUMENT_SEMANTIC_ARRAY_GROUP_THRESHOLD:-2}
    ports:
      - '${AI_ORCHESTRATOR_PORT:-3007}:${AI_ORCHESTRATOR_PORT:-3007}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}/apps/backend/var/cache/ai-orchestrator:/app/data
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser-semantics:
        condition: service_started

  report:
    <<: *common-node-service
    container_name: ops-report
    command: >
      sh -c "corepack enable && pnpm --filter @ops/report exec prisma generate
      && pnpm --filter @ops/report exec prisma db push
      && pnpm --filter @ops/report run build
      && rm -rf /workspace/apps/backend/capabilities/document-domain/report/dist/generated
      && mkdir -p /workspace/apps/backend/capabilities/document-domain/report/dist/generated
      && cp -R /workspace/apps/backend/capabilities/document-domain/report/generated/prisma /workspace/apps/backend/capabilities/document-domain/report/dist/generated/prisma
      && pnpm --filter @ops/report run start"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=reports&connection_limit=${PRISMA_CONNECTION_LIMIT:-5}
      PORT: ${REPORT_PORT:-3008}
      AI_ORCHESTRATOR_URL: http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      SESSION_BROKER_URL: http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
      FILES_DIR: /workspace/apps/backend/capabilities/document-domain/report/files
    ports:
      - '${REPORT_PORT:-3008}:${REPORT_PORT:-3008}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
      - report_files:/workspace/apps/backend/capabilities/document-domain/report/files
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-orchestrator:
        condition: service_started
      session-broker:
        condition: service_started

  # ============================================
  # Carbone Engine (Document Domain - Studio API)
  # ============================================
  carbone-engine:
    <<: *common-node-service
    build:
      context: ${PROJECT_ROOT:?PROJECT_ROOT must be set}
      dockerfile: docker/carbone-engine/Dockerfile
    image: ops-carbone-engine:dev
    container_name: carbone-engine
    command: >
      sh -c "corepack enable && pnpm --filter carbone-engine exec prisma db push --schema ../template/prisma/schema.prisma
      && pnpm --filter carbone-engine run dev"
    environment:
      <<: *common-env
      DOCKER_ENV: true
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=document_engine&connection_limit=${PRISMA_CONNECTION_LIMIT:-5}
      PORT: ${CARBONE_ENGINE_PORT:-3009}
      TEMPLATES_DIR: /workspace/apps/backend/var/templates/document-engine
      OUTPUTS_DIR: /workspace/apps/backend/var/outputs/document-engine
      STORAGE_RENDER_DIR: /workspace/apps/backend/var/outputs/document-engine/renders
      CARBONE_EXTERNAL_URL: http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
    ports:
      - '${CARBONE_ENGINE_PORT:-3009}:${CARBONE_ENGINE_PORT:-3009}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ============================================
  # Frontend
  # ============================================
  portal:
    <<: *common-node-service
    container_name: ops-portal
    command: sh -c "corepack enable && pnpm --filter @ops/portal run dev --host 0.0.0.0 --port 5173"
    environment:
      NODE_ENV: development
      DOCKER_ENV: true
      AUTH_SERVICE_HOST: platform
      PLATFORM_HOST: platform
      BROWSER_TEMPLATE_HOST: browser-template
      VITE_API_BASE_URL: /api
      VITE_CONTROL_PLANE_API_URL: http://${HOST_IP:-localhost}:${CONTROL_PLANE_PORT:-3003}/api
      VITE_HOST_IP: ${HOST_IP:-localhost}
      VITE_RECORDER_WS_URL: ws://${HOST_IP:-localhost}:${BROWSER_WORKER_PORT:-3004}
      VITE_CARBONE_API_URL: http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
      VITE_NOVNC_URL: http://${HOST_IP:-localhost}:${NOVNC_PORT:-6080}/vnc.html
    ports:
      - '${PORTAL_PORT:-5173}:${PORTAL_PORT:-5173}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      platform:
        condition: service_started
      browser-worker:
        condition: service_started
      browser-template:
        condition: service_started
      carbone-engine:
        condition: service_started

  user-web:
    <<: *common-node-service
    container_name: ops-user-web
    command: sh -c "corepack enable && pnpm --filter @ops/user-web run dev --host 0.0.0.0 --port 5174"
    environment:
      NODE_ENV: development
      DOCKER_ENV: true
      USER_WEB_PORT: ${USER_WEB_PORT:-5174}
      VITE_API_BASE_URL: /api
      VITE_CONTROL_PLANE_API_URL: http://${HOST_IP:-localhost}:${CONTROL_PLANE_PORT:-3003}/api
      VITE_AI_API_BASE_URL: /api/ai
      VITE_HOST_IP: ${HOST_IP:-localhost}
    ports:
      - '${USER_WEB_PORT:-5174}:${USER_WEB_PORT:-5174}'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
    depends_on:
      workspace-deps-init:
        condition: service_completed_successfully
      platform:
        condition: service_started
      control-plane:
        condition: service_started
      ai-orchestrator:
        condition: service_started

  # ============================================
  # Browser Chrome (noVNC + CDP + Codegen)
  # ============================================
  browser-chrome:
    build:
      context: ../..
      dockerfile: docker/browser-worker/Dockerfile
    image: ${SESSION_BROWSER_IMAGE:-ops-browser-chrome:local}
    container_name: ops-browser-chrome
    ports:
      - '${NOVNC_PORT:-6080}:8080'
      - '${CDP_PORT:-9222}:9222'
      - '${VNC_PORT:-5900}:5900'
      - '${CODEGEN_API_PORT:-3011}:${CODEGEN_API_PORT:-3011}'
    environment:
      SCREEN_WIDTH: 1920
      SCREEN_HEIGHT: 1080
      CODEGEN_API_PORT: ${CODEGEN_API_PORT:-3011}
    command: ['/start-recorder.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:8080/vnc.html >/dev/null && curl -fsS http://localhost:${CODEGEN_API_PORT:-3011}/status >/dev/null',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ops-network

  # ============================================
  # Temporal Server & UI & Sandbox Worker
  # ============================================
  temporal:
    image: ${DOCKER_REGISTRY:-}temporalio/auto-setup:1.22.0
    container_name: ops-temporal
    ports:
      - '7233:7233'
      - '7234:7234'
      - '7235:7235'
      - '7236:7236'
    environment:
      - DB=postgresql
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-ops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ops_secret}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-ops_secret}
      - POSTGRES_DB=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic_config.yaml
    volumes:
      - temporal_data:/var/lib/postgresql/data
      - ../temporal/dynamic_config.yaml:/etc/temporal/dynamic_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ops-network

  temporal-ui:
    image: ${DOCKER_REGISTRY:-}temporalio/ui:2.20.0
    container_name: ops-temporal-ui
    ports:
      - '8088:8080'
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://${HOST_IP:-localhost}:8088,http://${HOST_IP:-localhost}:${PORTAL_PORT:-5173}
    depends_on:
      - temporal
    networks:
      - ops-network

  sandbox-worker:
    build:
      context: ../..
      dockerfile: docker/temporal/Dockerfile
      args:
        SANDBOX_WORKER_PROJECT_PATH: ${SANDBOX_WORKER_PROJECT_PATH:-apps/backend/runtimes/sandbox-worker}
    container_name: ops-sandbox-worker
    restart: unless-stopped
    working_dir: /workspace/apps/backend/runtimes/sandbox-worker
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - AUTH_SERVICE_URL=http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      - AI_ORCHESTRATOR_URL=http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      - SANDBOX_WORKER_TASK_QUEUE=sandbox-worker-task-queue
      - ACTIVITY_VALIDATION_TASK_QUEUE=activity-validation-task-queue
      - SANDBOX_HTTP_PORT=8090
      - CARBONE_SERVICE_URL=http://${CARBONE_ENGINE_HOST:-carbone-engine}:${CARBONE_ENGINE_PORT:-3009}
      - CARBONE_EXTERNAL_URL=http://${HOST_IP:-localhost}:${CARBONE_ENGINE_PORT:-3009}
    ports:
      - '8090:8090'
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - temporal
    networks:
      - ops-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  report_files:
  temporal_data:

networks:
  ops-network:
    external: true
    name: ${NETWORK_NAME:-ops-network}
