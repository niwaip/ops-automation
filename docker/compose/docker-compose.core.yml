# Legacy V4 Core Group
# 仅保留给分层调试/兼容校验使用。
# 日常开发请优先使用 ./docker/start-smart.sh dev up -d

services:
  postgres:
    image: ${DOCKER_REGISTRY:-}postgres:15-alpine
    container_name: ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops} -d ${POSTGRES_DB:-ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ops-network

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    container_name: ops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ops-network

  platform:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-platform
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && rm -f tsconfig.tsbuildinfo && npx tsc && node dist/main.js"
    environment:
      NODE_ENV: development
      DOCKER_ENV: true
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET: ${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      PORT: ${PLATFORM_PORT:-3001}
      EXTERNAL_HOST: ${HOST_IP:-localhost}
      SANDBOX_WORKER_URL: http://sandbox-worker:8090
      ACTIVITY_VALIDATION_AGENT_URL: http://sandbox-worker:8090
    ports:
      - "${PLATFORM_PORT:-3001}:${PLATFORM_PORT:-3001}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/core/platform:/app
      - auth_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-network

  control-plane:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-control-plane
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmjs.org && npm install --legacy-peer-deps && npx prisma generate && npm run dev"
    environment:
      NODE_ENV: development
      DOCKER_ENV: true
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET: ${JWT_SECRET:-ops_local_dev_jwt_secret_2026_06_02_8f4a6c9d7b1e53aa}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:-ops_internal_shared_secret_change_me}
      PORT: ${CONTROL_PLANE_PORT:-3003}
      AUTH_SERVICE_URL: http://${PLATFORM_SERVICE_HOST:-platform}:${PLATFORM_PORT:-3001}
      AI_ORCHESTRATOR_URL: http://${AI_ORCHESTRATOR_HOST:-ai-orchestrator}:${AI_ORCHESTRATOR_PORT:-3007}
      SESSION_BROKER_URL: http://${SESSION_BROKER_HOST:-session-broker}:${SESSION_BROKER_PORT:-3002}
      EXTERNAL_HOST: ${HOST_IP:-localhost}
    ports:
      - "${CONTROL_PLANE_PORT:-3003}:${CONTROL_PLANE_PORT:-3003}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/execution-control/control-plane:/app
      - control_plane_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-network

  session-broker:
    image: ${DOCKER_REGISTRY:-}node:20-bullseye
    container_name: ops-session-broker
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps && rm -f tsconfig.tsbuildinfo && npx tsc && node dist/main.js"
    environment:
      NODE_ENV: development
      DOCKER_ENV: true
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      PORT: ${SESSION_BROKER_PORT:-3002}
      EXTERNAL_HOST: ${HOST_IP:-localhost}
    ports:
      - "${SESSION_BROKER_PORT:-3002}:${SESSION_BROKER_PORT:-3002}"
    volumes:
      - ${PROJECT_ROOT:-..}/apps/backend/execution-control/session-broker:/app
      - session_broker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  auth_node_modules:
  control_plane_node_modules:
  session_broker_node_modules:

networks:
  ops-network:
    external: true
    name: ${NETWORK_NAME:-ops-network}
