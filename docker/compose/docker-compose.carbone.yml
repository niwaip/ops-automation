# Carbone Engine - 独立模板编辑器服务
# 必须从仓库根目录通过 start-smart.sh 启动，确保挂载当前仓库
# 使用方法: ./docker/start-smart.sh docker-compose.carbone.yml up -d carbone-engine
# 开发模式: ./docker/start-smart.sh docker-compose.carbone.yml --profile dev up -d carbone-engine-dev

services:
  carbone-engine:
    build:
      context: ../..
      dockerfile: docker/carbone-engine/Dockerfile
    container_name: carbone-engine
    working_dir: /workspace/apps/backend/capabilities/document-domain
    command: >
      sh -c "npm install -g pnpm@8.12.0 && pnpm config set ignore-scripts true && pnpm install --no-frozen-lockfile
      && pnpm run build
      && pnpm run start:prod"
    environment:
      - NODE_ENV=production
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=document_engine
      - PORT=3009
      - TEMPLATES_DIR=/workspace/apps/backend/var/templates/document-engine
      - OUTPUTS_DIR=/workspace/apps/backend/var/outputs/document-engine
      - STORAGE_RENDER_DIR=/workspace/apps/backend/var/outputs/document-engine/renders
      - LIBREOFFICE_PATH=/usr/bin/soffice
      - TMP_DIR=/tmp/carbone-preview
      - AI_ORCHESTRATOR_URL=http://ai-orchestrator:3007
    ports:
      - "3009:3009"
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}/apps/backend/var/templates/document-engine:/workspace/apps/backend/var/templates/document-engine
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}/apps/backend/var/outputs/document-engine:/workspace/apps/backend/var/outputs/document-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3009/api"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ops-network

  # 开发模式配置（可选）
  carbone-engine-dev:
    image: node:20-bullseye
    container_name: carbone-engine-dev
    working_dir: /workspace/apps/backend/capabilities/document-domain
    command: >
      sh -c "npm install -g pnpm@8.12.0 && pnpm config set ignore-scripts true && pnpm install --no-frozen-lockfile
      && pnpm run dev"
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops_secret}@postgres:5432/${POSTGRES_DB:-ops}?schema=document_engine
      - PORT=3009
      - TEMPLATES_DIR=/workspace/apps/backend/var/templates/document-engine
      - OUTPUTS_DIR=/workspace/apps/backend/var/outputs/document-engine
      - STORAGE_RENDER_DIR=/workspace/apps/backend/var/outputs/document-engine/renders
    ports:
      - "3010:3009"
    volumes:
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}:/workspace
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}/apps/backend/var/templates/document-engine:/workspace/apps/backend/var/templates/document-engine
      - ${PROJECT_ROOT:?PROJECT_ROOT must be set}/apps/backend/var/outputs/document-engine:/workspace/apps/backend/var/outputs/document-engine
    networks:
      - ops-network
    profiles:
      - dev

volumes:
  carbone_templates:
    driver: local
  carbone_outputs:
    driver: local

networks:
  ops-network:
    name: ${NETWORK_NAME:-ops-network}
    external: true
