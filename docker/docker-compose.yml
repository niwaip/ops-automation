version: '3.8'

services:
  # Carbone Official API Service (支持 HTTPS)
  carbone-api:
    build:
      context: ./carbone-official
      dockerfile: Dockerfile.community
    container_name: carbone-api
    ports:
      - "3100:3100"   # HTTP
      - "3443:3443"   # HTTPS (使用与 office-addin 相同的证书)
    volumes:
      - ./carbone-official/templates:/app/templates
      - ./office-addin/certs:/app/certs:ro  # 挂载 SSL 证书
    environment:
      - CARBONE_API_PORT=3100
      - CARBONE_API_HTTPS_PORT=3443
      - ENABLE_HTTPS=true
      - CERT_PATH=/app/certs
      - NODE_ENV=production
      - CARBONE_ENGINE_URL=http://host.docker.internal:3009  # 代理到主机上的carbone-engine
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "require('https').get({host:'localhost',port:3443,path:'/health',rejectUnauthorized:false},(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Office Add-in Development Server
  office-addin:
    build:
      context: ../services/office-addin
      dockerfile: ../../docker/office-addin/Dockerfile.dev
    container_name: office-addin
    ports:
      - "3000:3000"
    volumes:
      # 挂载源码支持热更新
      - ../services/office-addin/src:/app/src
      - ../services/office-addin/public:/app/public
      # 挂载SSL证书
      - ./office-addin/certs:/app/certs:ro
    environment:
      - VITE_API_URL=https://carbone-api:3443  # 改为 HTTPS
      - NODE_ENV=development
      - DOCKER=true
    depends_on:
      - carbone-api
    restart: unless-stopped

networks:
  carbone-network:
    external: true
